`。\n3.  **移除选中状态**: 修改 `MonthView`, `WeekView`, `DayView` 移除 `isSelected` 判断及相关 CSS 类。  \n    **✅ 已完成** — 三个视图均未在 DOM 上应用 `selected` 类（可选后续：删除未使用的 `isSelected` 变量）。\n4.  **验证**:\n    - 运行复现单元测试，确认修复前失败，修复后通过。 **✅**\n    - 运行现有测试。 **✅**\n    - **视觉验证**: 启动日历演示并在浏览器中验证行为。 **见下方 Demo 步骤**\n"},"source-92b2d89500b2b237-s10":{"body":"来源：`.spec/rfc/completed/0013-fix-today-handling.md:63-72`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Demo 视觉验证步骤\n\n1.  **启动演示**: 在项目根目录执行 `pnpm run build:calendar` 后执行 `pnpm run dev:react`，浏览器打开 **http://localhost:3000/**。\n2.  **月视图**: 确认右侧为日历，视图为「月」。\n3.  **切到非当前月**: 点击日历头部的「下月」或「上月」，进入非当前月份（例如今天 2 月，则切到 3 月或 1 月）。\n4.  **检查「今天」**: 在月历中会看到上/下月的灰色小格（other-month）。若某格数字与「今天」的日期相同（例如今天 22 号，则找灰色格里的 22）：\n    - **通过**: 该灰色格**没有**蓝色/高亮「今天」样式，仅灰显。\n    - **失败**: 该灰色格被高亮成「今天」样式。\n5.  **可选**: 切回当前月，确认当月内的「今天」仍然有「今天」高亮。\n"},"source-92b2d89500b2b237-s11":{"body":"来源：`.spec/rfc/completed/0013-fix-today-handling.md:73-75`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 替代方案\n\n- **仅 CSS 修复**: 我们可以使用 CSS 优先级使 `.other-month.today` 看起来不同。然而，在逻辑中简单地隐藏 \"今天\" 状态更健壮，并能防止意外的样式冲突。"},"source-d5b759e7bd2a82cd":{"body":"# .spec/rfc/0012-calendar-plugin-mechanism.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：README.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC-0012: Calendar 插件机制\n\n**状态**: Draft  \n**创建日期**: 2026-01-01  \n**最后更新**: 2026-01-01  \n**作者**: CalenderJS Team  \n**关联 RFC**: RFC-0009, RFC-0011\n\n## 摘要\n\n设计并实现 Calendar 组件的插件机制，允许为不同类型的事件（Event）注册自定义的详情卡片渲染器。\n\n**核心设计理念**（参考 Editor.js 插件架构）：\n\n- Calendar 组件提供插件注册系统\n- 插件根据 `Event.type` 注册不同的详情卡片渲染器\n- 插件可以访问 `Event.extra` 字段来渲染详情卡片\n- 插件系统应该易于扩展，不修改核心代码\n\n### 插件系统架构图\n\n```mermaid\n%%{init: {'theme':'base', 'themeVariables': {'primaryColor':'#1e88e5', 'primaryTextColor':'#fff', 'primaryBorderColor':'#1565c0', 'lineColor':'#64b5f6', 'secondaryColor':'#ff9800', 'tertiaryColor':'#4caf50', 'background':'#121212', 'mainBkgColor':'#1e1e1e', 'secondBkgColor':'#2d2d2d', 'textColor':'#e0e0e0', 'clusterBkg':'#2d2d2d', 'clusterBorder':'#64b5f6'}}}%%\ngraph TB\n    subgraph \"Calendar 组件\"\n        A[Calendar]\n        B[CalendarPluginRegistry]\n    end\n\n    subgraph \"插件系统\"\n        C[Appointment Plugin]\n        D[Holiday Plugin]\n        E[Meeting Plugin]\n        F[Default Plugin]\n    end\n\n    subgraph \"Event 数据\"\n        G[Event.type: appointment]\n        H[Event.type: holiday]\n        I[Event.type: meeting]\n        J[Event.extra]\n    end\n\n    A --> B\n    B --> C\n    B --> D\n    B --> E\n    B --> F\n    G --> C\n    H --> D\n    I --> E\n    J --> C\n    J --> D\n    J --> E\n\n    C --> K[详情卡片渲染]\n    D --> K\n    E --> K\n    F --> K\n\n    style A fill:#4caf50,stroke:#388e3c,color:#fff\n    style B fill:#4caf50,stroke:#388e3c,color:#fff\n    style C fill:#ff9800,stroke:#f57c00,color:#fff\n    style D fill:#ff9800,stroke:#f57c00,color:#fff\n    style E fill:#ff9800,stroke:#f57c00,color:#fff\n    style F fill:#ff9800,stroke:#f57c00,color:#fff\n    style K fill:#1e88e5,stroke:#1565c0,color:#fff\n```\n\n## 动机\n\n当前状态：\n\n- ✅ Calendar 组件已实现（WeekView、DayView、MonthView）\n- ✅ Event Data Model 已定义（`@calenderjs/event-model`）\n- ✅ Event 接口包含 `extra` 字段（用于详情卡片数据）\n- ❌ Calendar 组件缺少插件机制\n- ❌ 无法为不同类型的事件渲染不同的详情卡片\n\n需要解决的问题：\n\n1. 如何为不同类型的事件（appointment, holiday, meeting）渲染不同的详情卡片？\n2. 如何设计插件系统，使其易于扩展？\n3. 如何确保插件系统不影响 Calendar 核心功能？\n\n## 目标\n\n1. **设计插件接口**\n   - 定义插件接口规范\n   - 支持根据 `Event.type` 注册不同的渲染器\n   - 支持插件访问 `Event.extra` 字段\n\n2. **实现插件注册系统**\n   - Calendar 组件提供插件注册 API\n   - 支持注册、注销、查询插件\n   - 支持插件优先级和冲突处理\n\n3. **实现详情卡片渲染**\n   - 根据 `Event.type` 选择对应的插件\n   - 使用插件渲染详情卡片\n   - 支持默认插件（当没有注册插件时）\n\n## 范围\n\n### In-Scope\n\n- 插件接口定义\n- 插件注册系统\n- 详情卡片渲染机制\n- 插件生命周期管理\n- 插件与 Calendar 组件的集成\n\n### Out-of-Scope\n\n- 插件市场或插件分发机制\n- 插件权限系统\n- 插件热加载\n- 插件配置管理\n\n## 核心交付物\n\n1. **插件接口定义**\n   - `EventDetailCardPlugin` 接口\n   - 插件注册 API\n   - 插件渲染方法\n\n2. **插件注册系统**\n   - `CalendarPluginRegistry` 类\n   - 插件注册、注销、查询方法\n   - 插件优先级处理\n\n3. **详情卡片渲染**\n   - 根据 `Event.type` 选择插件\n   - 渲染详情卡片\n   - 默认插件支持\n\n## 成功标准\n\n1. ✅ 可以为不同类型的事件注册自定义详情卡片渲染器\n2. ✅ 插件系统支持注册、注销、查询插件\n3. ✅ Calendar 组件可以根据 `Event.type` 渲染不同的详情卡片\n4. ✅ 插件系统不影响 Calendar 核心功能\n5. ✅ 所有代码达到 100% 测试覆盖率\n6. ✅ 所有测试通过\n\n## 详细设计\n\n### 1. 数据契约\n\n**数据契约定义**（来自 RFC-0011）：\n\nEvent Data Model 定义了 Calendar 组件消费 Event 数据的标准接口：\n\n```typescript\ninterface Event {\n  id: string;\n  type: string;\n  title: string;\n  startTime: Date;\n  endTime: Date;\n  color?: string;\n  icon?: string;\n  extra?: Record\u003cstring, any>; // 详情卡片数据\n  metadata?: EventMetadata;\n}\n```\n\n**数据契约的作用**：\n\n- 定义 Calendar 组件消费 Event 数据的标准接口\n- 确保所有 Event 数据都符合统一的结构\n- 支持插件系统根据 `Event.type` 渲染不同的详情卡片\n\n**数据契约与插件系统关系图**：\n\n```mermaid\n%%{init: {'theme':'base', 'themeVariables': {'primaryColor':'#1e88e5', 'primaryTextColor':'#fff', 'primaryBorderColor':'#1565c0', 'lineColor':'#64b5f6', 'secondaryColor':'#ff9800', 'tertiaryColor':'#4caf50', 'background':'#121212', 'mainBkgColor':'#1e1e1e', 'secondBkgColor':'#2d2d2d', 'textColor':'#e0e0e0', 'clusterBkg':'#2d2d2d', 'clusterBorder':'#64b5f6'}}}%%\ngraph TB\n    subgraph \"数据契约 (Data Contract)\"\n        A[Event 接口]\n        B[Event.type]\n        C[Event.extra]\n    end\n\n    subgraph \"插件系统\"\n        D[CalendarPluginRegistry]\n        E[插件选择逻辑]\n    end\n\n    subgraph \"插件\"\n        F[Appointment Plugin]\n        G[Holiday Plugin]\n        H[Default Plugin]\n    end\n\n    A --> D\n    B --> E\n    C --> F\n    C --> G\n    E --> F\n    E --> G\n    E --> H\n\n    style A fill:#1e88e5,stroke:#1565c0,color:#fff\n    style B fill:#1e88e5,stroke:#1565c0,color:#fff\n    style C fill:#1e88e5,stroke:#1565c0,color:#fff\n    style D fill:#4caf50,stroke:#388e3c,color:#fff\n    style E fill:#4caf50,stroke:#388e3c,color:#fff\n    style F fill:#ff9800,stroke:#f57c00,color:#fff\n    style G fill:#ff9800,stroke:#f57c00,color:#fff\n    style H fill:#ff9800,stroke:#f57c00,color:#fff\n```\n\n### 2. 插件接口设计\n\n#### 2.1 EventDetailCardPlugin 接口\n\n```typescript\n/**\n * 事件详情卡片插件接口\n *\n * 参考 Editor.js 插件架构设计\n */\ninterface EventDetailCardPlugin {\n  /** 插件名称 */\n  name: string;\n\n  /** 支持的事件类型（对应 Event.type） */\n  type: string | string[];\n\n  /** 插件版本 */\n  version?: string;\n\n  /** 插件优先级（数字越大优先级越高，默认 0） */\n  priority?: number;\n\n  /**\n   * 渲染详情卡片\n   *\n   * @param event - Event 对象\n   * @param context - 渲染上下文（可选）\n   * @returns 详情卡片的 HTML 字符串或 HTMLElement\n   */\n  render(event: Event, context?: RenderContext): string | HTMLElement;\n\n  /**\n   * 检查是否支持该事件类型\n   *\n   * @param eventType - 事件类型（Event.type）\n   * @returns 是否支持\n   */\n  supports(eventType: string): boolean;\n\n  /**\n   * 插件初始化（可选）\n   *\n   * @param calendar - Calendar 组件实例\n   */\n  initialize?(calendar: Calendar): void;\n\n  /**\n   * 插件销毁（可选）\n   */\n  destroy?(): void;\n}\n```\n\n#### 2.2 RenderContext 接口\n\n```typescript\n/**\n * 渲染上下文\n */\ninterface RenderContext {\n  /** 用户上下文 */\n  user?: User;\n\n  /** Calendar 组件实例 */\n  calendar?: Calendar;\n\n  /** 其他上下文数据 */\n  [key: string]: any;\n}\n```\n\n### 3. 插件注册系统\n\n#### 3.1 CalendarPluginRegistry 类\n\n```typescript\n/**\n * Calendar 插件注册表\n *\n * 管理所有注册的插件，提供注册、注销、查询功能\n */\nclass CalendarPluginRegistry {\n  private plugins: Map\u003cstring, EventDetailCardPlugin[]> = new Map();\n\n  /**\n   * 注册插件\n   *\n   * @param plugin - 插件实例\n   */\n  register(plugin: EventDetailCardPlugin): void;\n\n  /**\n   * 注销插件\n   *\n   * @param pluginName - 插件名称\n   */\n  unregister(pluginName: string): void;\n\n  /**\n   * 获取支持指定事件类型的插件\n   *\n   * @param eventType - 事件类型\n   * @returns 插件列表（按优先级排序）\n   */\n  getPlugins(eventType: string): EventDetailCardPlugin[];\n\n  /**\n   * 获取所有注册的插件\n   *\n   * @returns 插件列表\n   */\n  getAllPlugins(): EventDetailCardPlugin[];\n}\n```\n\n#### 3.2 Calendar 组件集成\n\n```typescript\n/**\n * Calendar 组件应该提供插件注册 API\n */\nclass Calendar {\n  private pluginRegistry: CalendarPluginRegistry;\n\n  /**\n   * 注册插件\n   *\n   * @param plugin - 插件实例\n   */\n  registerPlugin(plugin: EventDetailCardPlugin): void;\n\n  /**\n   * 注销插件\n   *\n   * @param pluginName - 插件名称\n   */\n  unregisterPlugin(pluginName: string): void;\n\n  /**\n   * 渲染事件详情卡片\n   *\n   * @param event - Event 对象\n   * @returns 详情卡片的 HTML 字符串或 HTMLElement\n   */\n  renderEventDetailCard(event: Event): string | HTMLElement;\n}\n```\n\n### 4. 插件使用示例\n\n#### 4.1 注册 Appointment 插件\n\n```typescript\nimport { Calendar } from \"@calenderjs/calendar\";\nimport type { Event } from \"@calenderjs/event-model\";\n\nconst appointmentPlugin: EventDetailCardPlugin = {\n  name: \"appointment-detail-card\",\n  type: \"appointment\",\n  priority: 10,\n\n  supports(eventType: string): boolean {\n    return eventType === \"appointment\";\n  },\n\n  render(event: Event, context?: RenderContext): string {\n    const { doctor, department, notes } = event.extra || {};\n\n    return `\n      \u003cdiv class=\"appointment-detail-card\">\n        \u003ch3>${event.title}\u003c/h3>\n        \u003cp>医生: ${doctor}\u003c/p>\n        \u003cp>科室: ${department}\u003c/p>\n        ${notes ? `\u003cp>备注: ${notes}\u003c/p>` : \"\"}\n      \u003c/div>\n    `;\n  },\n};\n\n// 注册插件\ncalendar.registerPlugin(appointmentPlugin);\n```\n\n#### 4.2 注册 Holiday 插件\n\n```typescript\nconst holidayPlugin: EventDetailCardPlugin = {\n  name: \"holiday-detail-card\",\n  type: \"holiday\",\n  priority: 10,\n\n  supports(eventType: string): boolean {\n    return eventType === \"holiday\";\n  },\n\n  render(event: Event, context?: RenderContext): string {\n    const { country, isOfficial, description } = event.extra || {};\n\n    return `\n      \u003cdiv class=\"holiday-detail-card\">\n        \u003ch3>${event.title}\u003c/h3>\n        \u003cp>国家: ${country}\u003c/p>\n        \u003cp>类型: ${isOfficial ? \"法定节假日\" : \"假期\"}\u003c/p>\n        ${description ? `\u003cp>${description}\u003c/p>` : \"\"}\n      \u003c/div>\n    `;\n  },\n};\n\n// 注册插件\ncalendar.registerPlugin(holidayPlugin);\n```\n\n#### 4.3 默认插件\n\n```typescript\nconst defaultPlugin: EventDetailCardPlugin = {\n  name: \"default-detail-card\",\n  type: \"*\", // 支持所有类型\n  priority: 0, // 最低优先级\n\n  supports(eventType: string): boolean {\n    return true; // 支持所有类型\n  },\n\n  render(event: Event, context?: RenderContext): string {\n    return `\n      \u003cdiv class=\"default-detail-card\">\n        \u003ch3>${event.title}\u003c/h3>\n        \u003cp>时间: ${event.startTime.toLocaleString()} - ${event.endTime.toLocaleString()}\u003c/p>\n        ${event.extra ? `\u003cpre>${JSON.stringify(event.extra, null, 2)}\u003c/pre>` : \"\"}\n      \u003c/div>\n    `;\n  },\n};\n\n// 注册默认插件（当没有其他插件时使用）\ncalendar.registerPlugin(defaultPlugin);\n```\n\n### 5. 插件选择逻辑\n\n```typescript\n/**\n * Calendar 组件渲染详情卡片时的插件选择逻辑\n */\nclass Calendar {\n  renderEventDetailCard(event: Event): string | HTMLElement {\n    // 1. 获取支持该事件类型的插件（按优先级排序）\n    const plugins = this.pluginRegistry.getPlugins(event.type);\n\n    // 2. 选择优先级最高的插件\n    const plugin = plugins[0];\n\n    if (!plugin) {\n      // 3. 如果没有找到插件，使用默认插件\n      const defaultPlugin = this.pluginRegistry.getPlugins(\"*\")[0];\n      if (defaultPlugin) {\n        return defaultPlugin.render(event, this.getRenderContext());\n      }\n\n      // 4. 如果连默认插件都没有，返回空字符串\n      return \"\";\n    }\n\n    // 5. 使用选中的插件渲染详情卡片\n    return plugin.render(event, this.getRenderContext());\n  }\n}\n```\n\n**插件选择流程图**：\n\n```mermaid\n%%{init: {'theme':'base', 'themeVariables': {'primaryColor':'#1e88e5', 'primaryTextColor':'#fff', 'primaryBorderColor':'#1565c0', 'lineColor':'#64b5f6', 'secondaryColor':'#ff9800', 'tertiaryColor':'#4caf50', 'background':'#121212', 'mainBkgColor':'#1e1e1e', 'secondBkgColor':'#2d2d2d', 'textColor':'#e0e0e0', 'noteBkgColor':'#2d2d2d', 'noteTextColor':'#e0e0e0'}}}%%\nflowchart TD\n    A[用户点击 Event] --> B[Calendar.renderEventDetailCard]\n    B --> C[获取 Event.type]\n    C --> D[pluginRegistry.getPlugins\u003cbr/>event.type]\n    D --> E{找到插件?}\n    E -->|是| F[按优先级排序]\n    E -->|否| G[获取默认插件\u003cbr/>type: '*']\n    F --> H[选择优先级最高的插件]\n    G --> I{找到默认插件?}\n    I -->|是| J[使用默认插件渲染]\n    I -->|否| K[返回空字符串]\n    H --> L[调用 plugin.render\u003cbr/>event, context]\n    J --> L\n    L --> M[返回详情卡片]\n\n    style A fill:#1e88e5,stroke:#1565c0,color:#fff\n    style B fill:#4caf50,stroke:#388e3c,color:#fff\n    style E fill:#ff9800,stroke:#f57c00,color:#fff\n    style H fill:#ff9800,stroke:#f57c00,color:#fff\n    style L fill:#ff9800,stroke:#f57c00,color:#fff\n    style M fill:#1e88e5,stroke:#1565c0,color:#fff\n```\n\n### 6. 插件生命周期\n\n```typescript\n/**\n * 插件生命周期管理\n */\nclass Calendar {\n  private plugins: EventDetailCardPlugin[] = [];\n\n  registerPlugin(plugin: EventDetailCardPlugin): void {\n    // 1. 检查插件是否已注册\n    if (this.plugins.find((p) => p.name === plugin.name)) {\n      throw new Error(`Plugin ${plugin.name} is already registered`);\n    }\n\n    // 2. 调用插件初始化方法\n    if (plugin.initialize) {\n      plugin.initialize(this);\n    }\n\n    // 3. 注册插件\n    this.pluginRegistry.register(plugin);\n    this.plugins.push(plugin);\n  }\n\n  unregisterPlugin(pluginName: string): void {\n    const plugin = this.plugins.find((p) => p.name === pluginName);\n    if (!plugin) {\n      return;\n    }\n\n    // 1. 调用插件销毁方法\n    if (plugin.destroy) {\n      plugin.destroy();\n    }\n\n    // 2. 注销插件\n    this.pluginRegistry.unregister(pluginName);\n    this.plugins = this.plugins.filter((p) => p.name !== pluginName);\n  }\n}\n```\n\n**插件生命周期图**：\n\n```mermaid\n%%{init: {'theme':'base', 'themeVariables': {'primaryColor':'#1e88e5', 'primaryTextColor':'#fff', 'primaryBorderColor':'#1565c0', 'lineColor':'#64b5f6', 'secondaryColor':'#ff9800', 'tertiaryColor':'#4caf50', 'background':'#121212', 'mainBkgColor':'#1e1e1e', 'secondBkgColor':'#2d2d2d', 'textColor':'#e0e0e0', 'noteBkgColor':'#2d2d2d', 'noteTextColor':'#e0e0e0'}}}%%\nstateDiagram-v2\n    [*] --> 未注册: 插件定义\n    未注册 --> 注册中: registerPlugin()\n    注册中 --> 初始化: 检查是否已注册\n    初始化 --> 已注册: plugin.initialize()\n    已注册 --> 运行中: 插件可用\n    运行中 --> 渲染: plugin.render()\n    渲染 --> 运行中: 渲染完成\n    运行中 --> 注销中: unregisterPlugin()\n    注销中 --> 销毁: plugin.destroy()\n    销毁 --> [*]: 插件移除\n\n    note right of 已注册\n        插件已注册到\n        CalendarPluginRegistry\n        可以处理 Event\n    end note\n\n    note right of 运行中\n        插件可以响应\n        Event 渲染请求\n    end note\n```\n\n## 实施计划\n\n### 阶段一：插件接口定义\n\n**步骤 1.1**: 定义插件接口\n\n- 文件：`packages/calendar/src/plugins/EventDetailCardPlugin.ts`\n- 定义 `EventDetailCardPlugin` 接口\n- 定义 `RenderContext` 接口\n- ✅ 完成标准：接口定义完整，类型清晰\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n**步骤 1.2**: 定义插件注册表接口\n\n- 文件：`packages/calendar/src/plugins/CalendarPluginRegistry.ts`\n- 定义 `CalendarPluginRegistry` 类接口\n- ✅ 完成标准：接口定义完整，方法清晰\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n### 阶段二：插件注册系统实现\n\n**步骤 2.1**: 实现 CalendarPluginRegistry 类\n\n- 文件：`packages/calendar/src/plugins/CalendarPluginRegistry.ts`\n- 实现插件注册、注销、查询功能\n- 实现插件优先级排序\n- ✅ 完成标准：功能完整，性能良好\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n**步骤 2.2**: 在 Calendar 组件中集成插件系统\n\n- 文件：`packages/calendar/src/Calendar.wsx`\n- 添加插件注册 API\n- 添加插件注册表实例\n- ✅ 完成标准：API 清晰，集成完整\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n### 阶段三：详情卡片渲染\n\n**步骤 3.1**: 实现详情卡片渲染方法\n\n- 文件：`packages/calendar/src/Calendar.wsx`\n- 实现 `renderEventDetailCard` 方法\n- 实现插件选择逻辑\n- ✅ 完成标准：功能完整，性能良好\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n**步骤 3.2**: 实现默认插件\n\n- 文件：`packages/calendar/src/plugins/DefaultDetailCardPlugin.ts`\n- 实现默认详情卡片插件\n- ✅ 完成标准：功能完整，样式美观\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n### 阶段四：示例插件\n\n**步骤 4.1**: 实现 Appointment 插件示例\n\n- 文件：`packages/calendar/src/plugins/examples/AppointmentDetailCardPlugin.ts`\n- 实现 Appointment 详情卡片插件\n- ✅ 完成标准：功能完整，样式美观\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n**步骤 4.2**: 实现 Holiday 插件示例\n\n- 文件：`packages/calendar/src/plugins/examples/HolidayDetailCardPlugin.ts`\n- 实现 Holiday 详情卡片插件\n- ✅ 完成标准：功能完整，样式美观\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n## 变更历史\n\n- 2026-01-01: 初始创建"},"source-d5b759e7bd2a82cd-s1":{"body":"来源：`.spec/rfc/0012-calendar-plugin-mechanism.md:1-8`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC-0012: Calendar 插件机制\n\n**状态**: Draft  \n**创建日期**: 2026-01-01  \n**最后更新**: 2026-01-01  \n**作者**: CalenderJS Team  \n**关联 RFC**: RFC-0009, RFC-0011\n"},"source-d5b759e7bd2a82cd-s2":{"body":"来源：`.spec/rfc/0012-calendar-plugin-mechanism.md:9-19`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 摘要\n\n设计并实现 Calendar 组件的插件机制，允许为不同类型的事件（Event）注册自定义的详情卡片渲染器。\n\n**核心设计理念**（参考 Editor.js 插件架构）：\n\n- Calendar 组件提供插件注册系统\n- 插件根据 `Event.type` 注册不同的详情卡片渲染器\n- 插件可以访问 `Event.extra` 字段来渲染详情卡片\n- 插件系统应该易于扩展，不修改核心代码\n"},"source-d5b759e7bd2a82cd-s3":{"body":"来源：`.spec/rfc/0012-calendar-plugin-mechanism.md:20-69`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 插件系统架构图\n\n```mermaid\n%%{init: {'theme':'base', 'themeVariables': {'primaryColor':'#1e88e5', 'primaryTextColor':'#fff', 'primaryBorderColor':'#1565c0', 'lineColor':'#64b5f6', 'secondaryColor':'#ff9800', 'tertiaryColor':'#4caf50', 'background':'#121212', 'mainBkgColor':'#1e1e1e', 'secondBkgColor':'#2d2d2d', 'textColor':'#e0e0e0', 'clusterBkg':'#2d2d2d', 'clusterBorder':'#64b5f6'}}}%%\ngraph TB\n    subgraph \"Calendar 组件\"\n        A[Calendar]\n        B[CalendarPluginRegistry]\n    end\n\n    subgraph \"插件系统\"\n        C[Appointment Plugin]\n        D[Holiday Plugin]\n        E[Meeting Plugin]\n        F[Default Plugin]\n    end\n\n    subgraph \"Event 数据\"\n        G[Event.type: appointment]\n        H[Event.type: holiday]\n        I[Event.type: meeting]\n        J[Event.extra]\n    end\n\n    A --> B\n    B --> C\n    B --> D\n    B --> E\n    B --> F\n    G --> C\n    H --> D\n    I --> E\n    J --> C\n    J -- pe` 渲染不同的详情卡片\n\n**数据契约与插件系统关系图**：\n\n```mermaid\n%%{init: {'theme':'base', 'themeVariables': {'primaryColor':'#1e88e5', 'primaryTextColor':'#fff', 'primaryBorderColor':'#1565c0', 'lineColor':'#64b5f6', 'secondaryColor':'#ff9800', 'tertiaryColor':'#4caf50', 'background':'#121212', 'mainBkgColor':'#1e1e1e', 'secondBkgColor':'#2d2d2d', 'textColor':'#e0e0e0', 'clusterBkg':'#2d2d2d', 'clusterBorder':'#64b5f6'}}}%%\ngraph TB\n    subgraph \"数据契约 (Data Contract)\"\n        A[Event 接口]\n        B[Event.type]\n        C[Event.extra]\n    end\n\n    subgraph \"插件系统\"\n        D[CalendarPluginRegistry]\n        E[插件选择逻辑]\n    end\n\n    subgraph \"插件\"\n        F[Appointment Plugin]\n        G[Holiday Plugin]\n        H[Default Plugin]\n    end\n\n    A --> D\n    B --> E\n    C --> F\n    C --> G\n    E --> F\n    E --> G\n    E --> H\n\n    style A fill:#1e88e5,stroke:#1565c0,color:#fff\n    style B fill:#1e88e5,stroke:#1565c0,color:#fff\n    style C fill:#1e88e5,stroke:#1565c0,color:#fff\n    style D fill:#4caf50,stroke:#388e3c,color:#fff\n    style E fill:#4caf50,stroke:#388e3c,color:#fff\n    style F fill:#ff9800,stroke:#f57c00,color:#fff\n    style G fill:#ff9800,stroke:#f57c00,color:#fff\n    style H fill:#ff9800,stroke:#f57c00,color:#fff\n```\n"},"source-d5b759e7bd2a82cd-s13":{"body":"来源：`.spec/rfc/0012-calendar-plugin-mechanism.md:214-215`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 2. 插件接口设计\n"},"source-d5b759e7bd2a82cd-s14":{"body":"来源：`.spec/rfc/0012-calendar-plugin-mechanism.md:216-267`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 2.1 EventDetailCardPlugin 接口\n\n```typescript\n/**\n * 事件详情卡片插件接口\n *\n * 参考 Editor.js 插件架构设计\n */\ninterface EventDetailCardPlugin {\n  /** 插件名称 */\n  name: string;\n\n  /** 支持的事件类型（对应 Event.type） */\n  type: string | string[];\n\n  /** 插件版本 */\n  version?: string;\n\n  /** 插件优先级（数字越大      \u003cp>医生: ${doctor}\u003c/p>\n        \u003cp>科室: ${department}\u003c/p>\n        ${notes ? `\u003cp>备注: ${notes}\u003c/p>` : \"\"}\n      \u003c/div>\n    `;\n  },\n};\n\n// 注册插件\ncalendar.registerPlugin(appointmentPlugin);\n```\n"},"source-d5b759e7bd2a82cd-s21":{"body":"来源：`.spec/rfc/0012-calendar-plugin-mechanism.md:398-427`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 4.2 注册 Holiday 插件\n\n```typescript\nconst holidayPlugin: EventDetailCardPlugin = {\n  name: \"holiday-detail-card\",\n  type: \"holiday\",\n  priority: 10,\n\n  supports(eventType: string): boolean {\n    return eventType === \"holiday\";\n  },\n\n  render(event: Event, context?: RenderContext): string {\n    const { country, isOfficial, description } = event.extra || {};\n\n    return `\n      \u003cdiv class=\"holiday-detail-card\">\n        \u003ch3>${event.title}\u003c/h3>\n        \u003cp>国家: ${country}\u003c/p>\n        \u003cp>类型: ${isOfficial ? \"法定节假日\" : \"假期\"}\u003c/p>\n        ${description ? `\u003cp>${description}\u003c/p>` : \"\"}\n      \u003c/div>\n    `;\n  },\n};\n\n// 注册插件\ncalendar.registerPlugin(holidayPlugin);\n```\n"},"source-d5b759e7bd2a82cd-s22":{"body":"来源：`.spec/rfc/0012-calendar-plugin-mechanism.md:428-454`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 4.3 默认插件\n\n```typescript\nconst defaultPlugin: EventDetailCardPlugin = {\n  name: \"default-detail-card\",\n  type: \"*\", // 支持所有类型\n  priority: 0, // 最低优先级\n\n  supports(eventType: string): boolean {\n    return true; // 支持所有类型\n  },\n\n  render(event: Event, context?: RenderContext): string {\n    return `\n      \u003cdiv class=\"default-detail-card\">\n        \u003ch3>${event.title}\u003c/h3>\n        \u003cp>时间: ${event.startTime.toLocaleString()} - ${event.endTime.toLocaleString()}\u003c/p>\n        ${event.extra ? `\u003cpre>${JSON.stringify(event.extra, > 销毁: plugin.destroy()\n    销毁 --> [*]: 插件移除\n\n    note right of 已注册\n        插件已注册到\n        CalendarPluginRegistry\n        可以处理 Event\n    end note\n\n    note right of 运行中\n        插件可以响应\n        Event 渲染请求\n    end note\n```\n"},"source-d5b759e7bd2a82cd-s25":{"body":"来源：`.spec/rfc/0012-calendar-plugin-mechanism.md:584-585`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 实施计划\n"},"source-d5b759e7bd2a82cd-s26":{"body":"来源：`.spec/rfc/0012-calendar-plugin-mechanism.md:586-602`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 阶段一：插件接口定义\n\n**步骤 1.1**: 定义插件接口\n\n- 文件：`packages/calendar/src/plugins/EventDetailCardPlugin.ts`\n- 定义 `EventDetailCardPlugin` 接口\n- 定义 `RenderContext` 接口\n- ✅ 完成标准：接口定义完整，类型清晰\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n**步骤 1.2**: 定义插件注册表接口\n\n- 文件：`packages/calendar/src/plugins/CalendarPluginRegistry.ts`\n- 定义 `CalendarPluginRegistry` 类接口\n- ✅ 完成标准：接口定义完整，方法清晰\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n"},"source-d5b759e7bd2a82cd-s27":{"body":"来源：`.spec/rfc/0012-calendar-plugin-mechanism.md:603-620`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 阶段二：插件注册系统实现\n\n**步骤 2.1**: 实现 CalendarPluginRegistry 类\n\n- 文件：`packages/calendar/src/plugins/CalendarPluginRegistry.ts`\n- 实现插件注册、注销、查询功能\n- 实现插件优先级排序\n- ✅ 完成标准：功能完整，性能良好\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n**步骤 2.2**: 在 Calendar 组件中集成插件系统\n\n- 文件：`packages/calendar/src/Calendar.wsx`\n- 添加插件注册 API\n- 添加插件注册表实例\n- ✅ 完成标准：API 清晰，集成完整\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n"},"source-d5b759e7bd2a82cd-s28":{"body":"来源：`.spec/rfc/0012-calendar-plugin-mechanism.md:621-637`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 阶段三：详情卡片渲染\n\n**步骤 3.1**: 实现详情卡片渲染方法\n\n- 文件：`packages/calendar/src/Calendar.wsx`\n- 实现 `renderEventDetailCard` 方法\n- 实现插件选择逻辑\n- ✅ 完成标准：功能完整，性能良好\ 和 ISO 字符串表示的绝对时间点。\n- 不改变全天事件约束、冲突检测或重复事件生成算法。\n- 不引入第三方时区运行时。\n\n## 方案\n\n### 时区优先级\n\n时间字段按以下顺序解析：\n\n1. `event.timeZone`\n2. `event.recurring.timeZone`\n3. UTC\n\n应用若以本地墙上时间创建事件，必须同时设置浏览器或业务场景对应的 IANA\n时区，例如 `America/Los_Angeles`。\n\n### 支持字段\n\n`startTime` 与 `endTime` 使用相同规则：\n\n| 字段        | 返回值                                     |\n| ----------- | ------------------------------------------ |\n| `hour`      | 0–23                                       |\n| `minute`    | 0–59                                       |\n| `second`    | 0–59                                       |\n| `day`       | 1–31                                       |\n| `month`     | 1–12                                       |\n| `year`      | 四位公历年份                               |\n| `date`      | `YYYY-MM-DD`                               |\n| `dayOfWeek` | 0（周日）至 6（周六）                      |\n| `timeZone`  | 解析所用的显式时区；未声明时为 `undefined` |\n\n显式时区通过平台 `Intl.DateTimeFormat` 解析。未声明时区时直接使用 UTC Date\n访问器。无效日期或无效 IANA 时区返回 `undefined`，使对应验证规则失败，而不是\n抛出运行时异常。\n\n## 兼容性\n\n- 未设置 `timeZone` 的现有事件继续使用 UTC，无行为变化。\n- 已设置 `event.timeZone` 或 `recurring.timeZone` 的事件，时间字段将从“错误的\n  UTC 字段”改为指定时区字段。\n- React demo 将显式设置浏览器本地 IANA 时区，避免依赖宿主机器 UTC 偏移。\n\n## 实现\n\n- 新增内部纯函数模块，负责日期规范化、IANA 时区转换和字段读取。\n- `EventRuntime.evaluateFieldAccess()` 委托该模块处理所有时间属性。\n- 不导出新的公共 API，不增加运行时依赖。\n\n## 测试策略\n\n1. 未声明时区时验证 UTC 兼容行为。\n2. 同一时间点在 UTC、上海和纽约时区产生不同字段。\n3. 覆盖跨日的 `date`、`day`、`dayOfWeek`。\n4. 覆盖 `recurring.timeZone` 回退。\n5. 覆盖无效 IANA 时区不抛异常且规则失败。\n6. 回归 React demo 的本地 10:00 与 14:00 事件。\n\n## 备选方案\n\n### 始终使用宿主本地时区\n\n实现简单，但服务端部署位置会改变验证结果，且忽略 `Event.timeZone`，不可接受。\n\n### 未声明时区时使用宿主本地时区\n\n更符合部分 UI 直觉，但会改变现有 UTC 行为。此兼容性变更应留待未来主版本评估。\n\n## 实施检查清单\n\n- [x] 新增时区感知的纯函数时间字段解析\n- [x] EventRuntime 接入统一解析\n- [x] React demo 显式设置本地 IANA 时区\n- [x] 添加 UTC、IANA、重复事件和无效时区回归测试\n- [x] 通过全量构建、测试、类型检查、lint 和格式检查"},"source-c5c5fd731ecc248a-s1":{"body":"来源：`.spec/rfc/0014-event-runtime-timezone-field-semantics.md:1-7`\n\n约束来源图 / Constraint 源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 实现\n\n- 新增内部纯函数模块，负责日期规范化、IANA 时区转换和字段读取。\n- `EventRuntime.evaluateFieldAccess()` 委托该模块处理所有时间属性。\n- 不导出新的公共 API，不增加运行时依赖。\n"},"source-c5c5fd731ecc248a-s11":{"body":"来源：`.spec/rfc/0014-event-runtime-timezone-field-semantics.md:81-89`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 测试策略\n\n1. 未声明时区时验证 UTC 兼容行为。\n2. 同一时间点在 UTC、上海和纽约时区产生不同字段。\n3. 覆盖跨日的 `date`、`day`、`dayOfWeek`。\n4. 覆盖 `recurring.timeZone` 回退。\n5. 覆盖无效 IANA 时区不抛异常且规则失败。\n6. 回归 React demo 的本地 10:00 与 14:00 事件。\n"},"source-c5c5fd731ecc248a-s12":{"body":"来源：`.spec/rfc/0014-event-runtime-timezone-field-semantics.md:90-91`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 备选方案\n"},"source-c5c5fd731ecc248a-s13":{"body":"来源：`.spec/rfc/0014-event-runtime-timezone-field-semantics.md:92-95`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 始终使用宿主本地时区\n\n实现简单，但服务端部署位置会改变验证结果，且忽略 `Event.timeZone`，不可接受。\n"},"source-c5c5fd731ecc248a-s14":{"body":"来源：`.spec/rfc/0014-event-runtime-timezone-field-semantics.md:96-99`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 未声明时区时使用宿主本地时区\n\n更符合部分 UI 直觉，但会改变现有 UTC 行为。此兼容性变更应留待未来主版本评估。\n"},"source-c5c5fd731ecc248a-s15":{"body":"来源：`.spec/rfc/0014-event-runtime-timezone-field-semantics.md:100-106`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 实施检查清单\n\n- [x] 新增时区感知的纯函数时间字段解析\n- [x] EventRuntime 接入统一解析\n- [x] React demo 显式设置本地 IANA 时区\n- [x] 添加 UTC、IANA、重复事件和无效时区回归测试\n- [x] 通过全量构建、测试、类型检查、lint 和格式检查"},"source-b4312b0856c5f094":{"body":"# .spec/rfc/0003-multi-tenant-service.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：README.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC-0003: Multi-Tenant Calendar Service\n\n**状态**: Future Plan（未来计划）  \n**创建日期**: 2024-12-19  \n**作者**: WSX Team  \n**关联 RFC**: RFC-0001, RFC-0002\n\n## 摘要\n\n设计并实现基于 Next.js 的多租户日历服务架构。该服务支持客户注册、员工登录、Google Calendar 同步和 Slack 集成，提供完整的基于日历的预约管理系统。服务使用 RFC-0001 的组件库和 RFC-0002 的 DSL 系统。\n\n**重要说明**：本 RFC 是未来计划，当前阶段仅保留在文档中，暂不实现。当前阶段专注于 RFC-0001（组件库）、RFC-0002（DSL）和 RFC-0004（演示网站）的实现。\n\n## 动机\n\n### 为什么需要多租户服务？\n\n- **SaaS 模式**：支持多个客户（租户）使用同一套系统\n- **数据隔离**：确保每个租户的数据完全隔离\n- **可扩展性**：支持从单个客户到大规模企业的扩展\n- **统一管理**：提供统一的管理界面和 API\n- **成本效益**：共享基础设施，降低运营成本\n\n### 为什么需要第三方集成？\n\n- **Google Calendar 同步**：与现有日历系统集成，提高用户便利性\n- **Slack 集成**：在团队协作工具中直接管理预约，提高工作效率\n- **生态扩展**：为未来集成更多第三方服务打下基础\n\n## 详细设计\n\n### 1. 项目结构\n\n```\napps/\n├── calendar-service/             # Next.js 服务应用\n│   ├── app/\n│   │   ├── (auth)/\n│   │   │   ├── login/\n│   │   │   └── register/\n│   │   ├── (tenant)/\n│   │   │   ├── [tenantId]/\n│   │   │   │   ├── dashboard/\n│   │   │   │   ├── calendar/\n│   │   │   │   └── settings/\n│   │   │   └── layout.tsx        # 租户布局\n│   │   ├── api/\n│   │   │   ├── tenants/\n│   │   │   ├── appointments/\n│   │   │   ├── sync/\n│   │   │   │   ├── google/\n│   │   │   │   └── slack/\n│   │   │   └── auth/\n│   │   └── layout.tsx\n│   ├── lib/\n│   │   ├── db/                   # 数据库层\n│   │   │   ├── tenant.ts\n│   │   │   ├── user.ts\n│   │   │   └── appointment.ts\n│   │   ├── auth/                  # 认证层\n│   │   │   ├── middleware.ts\n│   │   │   └── session.ts\n│   │   ├── sync/                  # 同步服务\n│   │   │   ├── google.ts\n│   │   │   └── slack.ts\n│   │   └── dsl/                   # DSL 服务\n│   │       └── loader.ts\n│   ├── components/\n│   │   ├── CalendarView.tsx       # 使用 @calenderjs/core 组件\n│   │   └── AppointmentForm.tsx\n│   └── package.json\n│\n└── package.json\n```\n\n### 2. 数据模型\n\n```typescript\n// lib/db/types.ts\n\n// 租户模型\nexport interface Tenant {\n  id: string;\n  name: string;\n  subdomain?: string; // 子域名（如：acme.calenderjs.com）\n  domain?: string; // 自定义域名\n  createdAt: Date;\n  updatedAt: Date;\n  settings: TenantSettings;\n}\n\n// 租户设置\nexport interface TenantSettings {\n  // DSL 配置\n  appointmentDSL?: AppointmentDSL;\n  // 集成配置\n  integrations?: {\n    googleCalendar?: GoogleCalendarConfig;\n    slack?: SlackConfig;\n  };\n  // 业务配置\n  businessHours?: {\n    start: string; // 如 \"09:00\"\n    end: string; // 如 \"18:00\"\n    timezone: string; // 时区\n  };\n}\n\n// 用户模型\nexport interface User {\n  id: string;\n  tenantId: string; // 租户 ID\n  email: string;\n  name: string;\n  role: \"owner\" | \"admin\" | \"employee\";\n  createdAt: Date;\n  updatedAt: Date;\n}\n\n// 预约模型（扩展 RFC-0001）\nexport interface Appointment {\n  id: string;\n  tenantId: string; // 租户 ID\n  userId: string; // 创建者 ID\n  type?: string; // DSL 类型 ID\n  title: string;\n  startTime: Date;\n  endTime: Date;\n  description?: string;\n  color?: string;\n  allDay?: boolean;\n  recurring?: RecurringRule;\n  attendees?: string[];\n  location?: string;\n  // DSL 扩展字段\n  dslData?: Record\u003cstring, any>;\n  // 同步信息\n  syncInfo?: {\n    googleCalendar?: {\n      eventId: string;\n      calendarId: string;\n    };\n    slack?: {\n      messageId: string;\n      channelId: string;\n    };\n  };\n  createdAt: Date;\n  updatedAt: Date;\n}\n```\n\n### 3. 多租户中间件\n\n```typescript\n// lib/auth/middleware.ts\nimport { NextRequest, NextResponse } from \"next/server\";\nimport { getTenantFromRequest } from \"./tenant\";\n\nexport async function tenantMiddleware(request: NextRequest) {\n  // 从请求中提取租户信息\n  const tenant = await getTenantFromRequest(request);\n\n  if (!tenant) {\n    return NextResponse.redirect(new URL(\"/login\", request.url));\n  }\n\n  // 将租户信息添加到请求头\n  const requestHeaders = new Headers(request.headers);\n  requestHeaders.set(\"x-tenant-id\", tenant.id);\n\n  return NextResponse.next({\n    request: {\n      headers: requestHeaders,\n    },\n  });\n}\n\n// 获取租户信息\nasync function getTenantFromRequest(\n  request: NextRequest,\n): Promise\u003cTenant | null> {\n  // 从子域名获取\n  const hostname = request.headers.get(\"host\") || \"\";\n  const subdomain = hostname.split(\".\")[0];\n\n  // 从路径获取（如 /t/[tenantId]）\n  const pathname = request.nextUrl.pathname;\n  const tenantMatch = pathname.match(/^\\/t\\/([^/]+)/);\n  const tenantId = tenantMatch?.[1];\n\n  // 从会话获取\n  const session = await getSession(request);\n  const sessionTenantId = session?.tenantId;\n\n  // 查询数据库\n  const tenantIdToUse = tenantId || sessionTenantId;\n  if (!tenantIdToUse) {\n    return null;\n  }\n\n  return await getTenantById(tenantIdToUse);\n}\n```\n\n### 4. API 路由设计\n\n```typescript\n// app/api/appointments/route.ts\nimport { NextRequest, NextResponse } from \"next/server\";\nimport { getTenantId } from \"@/lib/auth/session\";\nimport { getAppointments, createAppointment } from \"@/lib/db/appointment\";\nimport { loadDSLRuntime } from \"@/lib/dsl/loader\";\n\nexport async function GET(request: NextRequest) {\n  const tenantId = await getTenantId(request);\n  if (!tenantId) {\n    return NextResponse.json({ error: \"Unauthorized\" }, { status: 401 });\n  }\n\n  const { searchParams } = new URL(request.url);\n  const startDate = searchParams.get(\"startDate\");\n  const endDate = searchParams.get(\"endDate\");\n\n  const appointments = await getAppointments(tenantId, {\n    startDate: startDate ? new Date(startDate) : undefined,\n    endDate: endDate ? new Date(endDate) : undefined,\n  });\n\n  return NextResponse.json(appointments);\n}\n\nexport async function POST(request: NextRequest) {\n  const tenantId = await getTenantId(request);\n  if (!tenantId) {\n    return NextResponse.json({ error: \"Unauthorized\" }, { status: 401 });\n  }\n\n  const body = await request.json();\n\n  // 验证预约数据（使用 DSL）\n  const tenant = await getTenant(tenantId);\n  if (tenant.settings.appointmentDSL && body.type) {\n    const dslRuntime = await loadDSLRuntime(tenant.settings.appointmentDSL);\n    const validation = dslRuntime.validate(body, body.type);\n    if (!validation.valid) {\n      return NextResponse.json(\n        { error: \"Validation failed\", details: validation.errors },\n        { status: 400 },\n      );\n    }\n  }\n\n  const appointment = await createAppointment(tenantId, body);\n  return NextResponse.json(appointment);\n}\n```\n\n### 5. 第三方集成\n\n#### 5.1 Google Calendar 同步\n\n```typescript\n// lib/sync/google.ts\nimport { google } from \"googleapis\";\n\nexport class GoogleCalendarSync {\n  private oauth2Client: OAuth2Client;\n\n  constructor(credentials: GoogleCalendarConfig) {\n    this.oauth2Client = new google.auth.OAuth2(\n      credentials.clientId,\n      credentials.clientSecret,\n      credentials.redirectUri,\n    );\n    this.oauth2Client.setCredentials({\n      refresh_token: credentials.refreshToken,\n    });\n  }\n\n  /**\n   * 同步预约到 Google Calendar\n   */\n  async syncAppointment(appointment: Appointment): Promise\u003cvoid> {\n    const calendar = google.calendar({\n      version: \"v3\",\n      auth: this.oauth2Client,\n    });\n\n    // 如果已有同步信息，更新事件\n    if (appointment.syncInfo?.googleCalendar?.eventId) {\n      await calendar.events.update({\n        calendarId: appointment.syncInfo.googleCalendar.calendarId,\n        eventId: appointment.syncInfo.googleCalendar.eventId,\n        requestBody: this.appointmentToGoogleEvent(appointment),\n      });\n    } else {\n      // 创建新事件\n      const event = await calendar.events.insert({\n        calendarId: \"primary\",\n        requestBody: this.appointmentToGoogleEvent(appointment),\n      });\n\n      // 更新预约的同步信息\n      await updateAppointmentSyncInfo(appointment.id, {\n        googleCalendar: {\n          eventId: event.data.id!,\n          calendarId: \"primary\",\n        },\n      });\n    }\n  }\n\n  /**\n   * 从 Google Calendar 同步事件\n   */\n  async syncFromGoogle(calendarId: string): Promise\u003cAppointment[]> {\n    const calendar = google.calendar({\n      version: \"v3\",\n      auth: this.oauth2Client,\n    });\n    const events = await calendar.events.list({\n      calendarId,\n      timeMin: new Date().toISOString(),\n      maxResults: 100,\n    });\n\n    return (\n      events.data.items?.map((event) => this.googleEventToAppointment(event)) ||\n      []\n    );\n  }\n\n  private appointmentToGoogleEvent(appointment: Appointment): any {\n    return {\n      summary: appointment.title,\n      description: appointment.description,\n      start: {\n        dateTime: appointment.startTime.toISOString(),\n        timeZone: \"UTC\",\n      },\n      end: {\n        dateTime: appointment.endTime.toISOString(),\n        timeZone: \"UTC\",\n      },\n      attendees: appointment.attendees?.map((email) => ({ email })),\n      location: appointment.location,\n    };\n  }\n\n  private googleEventToAppointment(event: any): Appointment {\n    return {\n      id: event.id,\n      title: event.summary || \"\",\n      description: event.description,\n      startTime: new Date(event.start.dateTime || event.start.date),\n      endTime: new Date(event.end.dateTime || event.end.date),\n      location: event.location,\n      attendees: event.attendees?.map((a: any) => a.email),\n      syncInfo: {\n        googleCalendar: {\n          eventId: event.id,\n          calendarId: event.organizer?.email || \"primary\",\n        },\n      },\n    };\n  }\n}\n```\n\n#### 5.2 Slack 集成\n\n```typescript\n// lib/sync/slack.ts\nimport { WebClient } from \"@slack/web-api\";\n\nexport class SlackIntegration {\n  private client: WebClient;\n\n  constructor(token: string) {\n    this.client = new WebClient(token);\n  }\n\n  /**\n   * 发送预约通知到 Slack\n   */\n  async notifyAppointment(\n    appointment: Appointment,\n    channelId: string,\n  ): Promise\u003cvoid> {\n    await this.client.chat.postMessage({\n      channel: channelId,\n      text: `新的预约: ${appointment.title}`,\n      blocks: [\n        {\n          type: \"section\",\n          text: {\n            type: \"mrkdwn\",\n            text: `*${appointment.title}*\\n${this.formatAppointment(appointment)}`,\n          },\n        },\n        {\n          type: \"actions\",\n          elements: [\n            {\n              type: \"button\",\n              text: {\n                type: \"plain_text\",\n                text: \"查看详情\",\n              },\n              url: `https://app.calenderjs.com/appointments/${appointment.id}`,\n            },\n          ],\n        },\n      ],\n    });\n  }\n\n  /**\n   * 创建 Slack 交互（如：快速创建预约）\n   */\n  async createAppointmentFromSlack(\n    payload: SlackInteractionPayload,\n  ): Promise\u003cAppointment> {\n    // 解析 Slack 交互数据\n    const appointmentData = this.parseSlackPayload(payload);\n\n    // 创建预约\n    const appointment = await createAppointment(appointmentData);\n\n    // 发送确认消息\n    await this.client.chat.postMessage({\n      channel: payload.channel.id,\n      text: `预约已创建: ${appointment.title}`,\n    });\n\n    return appointment;\n  }\n\n  private formatAppointment(appointment: Appointment): string {\n    return [\n      `时间: ${this.formatTimeRange(appointment.startTime, appointment.endTime)}`,\n      appointment.location && `地点: ${appointment.location}`,\n      appointment.attendees && `参会人: ${appointment.attendees.join(\", \")}`,\n    ]\n      .filter(Boolean)\n      .join(\"\\n\");\n  }\n}\n```\n\n### 6. 前端集成\n\n#### 6.1 Next.js 页面组件\n\n```typescript\n// app/(tenant)/[tenantId]/calendar/page.tsx\n'use client';\n\nimport { Calendar } from '@calenderjs/core';\nimport { AppointmentDSLRuntime } from '@calenderjs/event-dsl';\nimport { useEffect, useState } from 'react';\n\nexport default function CalendarPage({ params }: { params: { tenantId: string } }) {\n  const [appointments, setAppointments] = useState\u003cAppointment[]>([]);\n  const [dslRuntime, setDSLRuntime] = useState\u003cAppointmentDSLRuntime | null>(null);\n\n  useEffect(() => {\n    // 加载 DSL 配置\n    loadDSLConfig(params.tenantId).then(config => {\n      const runtime = new AppointmentDSLRuntime(config);\n      setDSLRuntime(runtime);\n    });\n\n    // 加载预约数据\n    loadAppointments(params.tenantId).then(setAppointments);\n  }, [params.tenantId]);\n\n  const handleAppointmentCreate = async (appointment: Partial\u003cAppointment>) => {\n    // 使用 DSL 验证\n    if (dslRuntime && appointment.type) {\n      const validation = dslRuntime.validate(appointment, appointment.type);\n      if (!validation.valid) {\n        alert(validation.errors.join('\\n'));\n        return;\n      }\n    }\n\n    const newAppointment = await createAppointment(params.tenantId, appointment);\n    setAppointments([...appointments, newAppointment]);\n  };\n\n  return (\n    \u003cdiv>\n      \u003cCalendar\n        appointments={appointments}\n        dslRuntime={dslRuntime}\n        onAppointmentCreate={handleAppointmentCreate}\n        onAppointmentUpdate={handleAppointmentUpdate}\n        onAppointmentDelete={handleAppointmentDelete}\n      />\n    \u003c/div>\n  );\n}\n```\n\n## 实现计划\n\n### 阶段 1: 多租户架构（1 周）\n\n1. **租户数据模型**（2 天）\n   - 实现租户数据模型\n   - 实现用户数据模型\n   - 实现预约数据模型扩展\n\n2. **多租户中间件**（2 天）\n   - 实现租户识别逻辑\n   - 实现租户隔离中间件\n   - 实现会话管理\n\n3. **租户隔离**（1 天）\n   - 实现数据库查询隔离\n   - 实现 API 路由隔离\n\n### 阶段 2: 认证和授权（3 天）\n\n1. **用户注册**（1 天）\n   - 实现客户注册流程\n   - 实现租户创建\n\n2. **员工登录**（1 天）\n   - 实现员工登录\n   - 实现会话管理\n\n3. **权限控制**（1 天）\n   - 实现基于角色的访问控制（RBAC）\n   - 实现 API 权限验证\n\n### 阶段 3: API 实现（4 天）\n\n1. **预约 CRUD API**（2 天）\n   - 实现 GET /api/appointments\n   - 实现 POST /api/appointments\n   - 实现 PUT /api/appointments/:id\n   - 实现 DELETE /api/appointments/:id\n\n2. **DSL 配置 API**（1 天）\n   - 实现 GET /api/tenants/:id/dsl\n   - 实现 PUT /api/tenants/:id/dsl\n\n3. **租户管理 API**（1 天）\n   - 实现租户管理接口\n\n### 阶段 4: 前端页面（3 天）\n\n1. **登录/注册页面**（1 天）\n   - 实现登录页面\n   - 实现注册页面\n\n2. **日历页面**（1 天）\n   - 集成 @calenderjs/core 组件\n   - 集成 @calenderjs/event-dsl 运行时\n\n3. **设置页面**（1 天）\n   - 实现租户设置\n   - 实现 DSL 配置界面\n\n### 阶段 5: 第三方集成（2 周）\n\n1. **Google Calendar 同步**（5 天）\n   - 实现 OAuth 认证\n   - 实现双向同步\n   - 实现冲突处理\n\n2. **Slack 集成**（3 天）\n   - 实现 Slack OAuth\n   - 实现通知功能\n   - 实现交互功能\n\n3. **集成测试**（2 天）\n   - 测试同步功能\n   - 测试集成稳定性\n\n## 技术栈\n\n### 前端\n\n- **@calenderjs/core**: 基于 RFC-0001 的组件库\n- **@calenderjs/event-dsl**: 基于 RFC-0002 的 DSL 系统\n- **Next.js 14**: App Router, Server Components\n- **TypeScript**: 类型安全\n- **React**: UI 框架\n\n### 后端\n\n- **Next.js API Routes**: API 服务\n- **Prisma / Drizzle**: ORM（数据库访问）\n- **PostgreSQL**: 数据库\n- **NextAuth.js**: 认证\n\n### 第三方集成\n\n- **Google Calendar API**: 日历同步\n- **Slack API**: Slack 集成\n\n### 工具\n\n- **pnpm**: 包管理\n- **Nx**: Monorepo 管理\n- **ESLint / Prettier**: 代码质量\n\n## 安全考虑\n\n1. **多租户数据隔离**\n   - 所有数据库查询必须包含 tenantId\n   - 使用行级安全策略（RLS）\n   - API 中间件验证租户权限\n\n2. **认证和授权**\n   - 使用 JWT 或 Session 管理认证\n   - 实现基于角色的访问控制（RBAC）\n   - 保护 API 端点\n\n3. **第三方集成安全**\n   - 安全存储 OAuth tokens\n   - 使用环境变量存储密钥\n   - 实现 token 刷新机制\n\n4. **数据验证**\n   - 使用 DSL 验证所有用户输入\n   - 防止 SQL 注入和 XSS 攻击\n   - 实现速率限制\n\n## 性能考虑\n\n1. **数据库优化**\n   - 为 tenantId 和常用查询字段创建索引\n   - 使用连接池\n   - 实现查询缓存\n\n2. **API 优化**\n   - 实现分页\n   - 使用 Server Components 减少客户端负担\n   - 实现 API 缓存\n\n3. **前端优化**\n   - 使用 React Server Components\n   - 实现代码分割\n   - 优化组件渲染性能\n\n## 未解决问题\n\n1. **同步冲突处理**：当多个来源修改同一预约时如何处理冲突？\n2. **扩展性**：如何支持更多第三方集成？\n3. **移动端支持**：是否需要开发移动端应用？\n4. **实时同步**：是否需要 WebSocket 支持实时更新？\n5. **多区域部署**：如何支持多区域部署和数据本地化？\n\n---\n\n_本 RFC 设计并实现多租户日历服务，使用 RFC-0001 的组件库和 RFC-0002 的 DSL 系统，提供完整的基于日历的预约管理解决方案。_"},"source-b4312b0856c5f094-s1":{"body":"来源：`.spec/rfc/0003-multi-tenant-service.md:1-7`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC-0003: Multi-Tenant Calendar Service\n\n**状态**: Future Plan（未来计划）  \n**创建日期**: 2024-12-19  \n**作者**: WSX Team  \n**关联 RFC**: RFC-0001, RFC-0002\n"},"source-b4312b0856c5f094-s2":{"body":"来源：`.spec/rfc/0003-multi-tenant-service.md:8-13`\n\n约束来源图 / Constraint sour ut.tsx        # 租户布局\n│   │   ├── api/\n│   │   │   ├── tenants/\n│   │   │   ├── appointments/\n│   │   │   ├── sync/\n│   │   │   │   ├── google/\n│   │   │   │   └── slack/\n│   │   │   └── auth/\n│   │   └── layout.tsx\n│   ├── lib/\n│   │   ├── db/                   # 数据库层\n│   │   │   ├── tenant.ts\n│   │   │   ├── user.ts\n│   │   │   └── appointment.ts\n│   │   ├── auth/                  # 认证层\n│   │   │   ├── middleware.ts\n│   │   │   └── session.ts\n│   │   ├── sync/                  # 同步服务\n│   │   │   ├── google.ts\n│   │   │   └── slack.ts\n│   │   └── dsl/                   # DSL 服务\n│   │       └── loader.ts\n│   ├── components/\n│   │   ├── CalendarView.tsx       # 使用 @calenderjs/core 组件\n│   │   └── AppointmentForm.tsx\n│   └── package.json\n│\n└── package.json\n```\n"},"source-b4312b0856c5f094-s8":{"body":"来源：`.spec/rfc/0003-multi-tenant-service.md:76-152`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 2. 数据模型\n\n```typescript\n// lib/db/types.ts\n\n// 租户模型\nexport interface Tenant {\n  id: string;\n  name: string;\n  subdomain?: string; // 子域名（如：acme.calenderjs.com）\n  domain?: string; // 自定义域名\n  createdAt: Date;\n  updatedAt: Date;\n  settings: TenantSettings;\n}\n\n// 租户设置\nexport interface TenantSettings {\n  // DSL 配置\n  appointmentDSL?: AppointmentDSL;\n  // 集成配置\n  integrations?: {\n    googleCalendar?: GoogleCalendarConfig;\n    slack?: SlackConfig;\n  };\n  // 业务配置\n  businessHours?: {\n    start: string; // 如 \"09:00\"\n    end: string; // 如 \"18:00\"\n    timezone: string; // 时区\n  };\n}\n\n// 用户模型\nexport interface User {\n  id: string;\n  tenantId: string; // 租户 ID\n  email: string;\n  name: string;\n  role: \"owner\" | \"admin\" | \"employee\";\n  createdAt: Date;\n  updatedAt: Date;\n}\n\n// 预约模型（扩展 RFC-0001）\nexport interface Appointment {\n  id: string;\n  tenantId: string; // 租户 ID\n  userId: string; // 创建者 ID\n  type?: string; // DSL 类型 ID\n  title: string;\n  startTime: Date;\n  endTime: Date;\n  description?: string;\n  color?: string;\n  allDay?: boolean;\n  recurring?: RecurringRule;\n  attendees?: string[];\n  location?: string;\n  // DSL 扩展字段\n  dslData?: Record\u003cstring, any>;\n  // 同步信息\n  syncInfo?: {\n    googleCalendar?: {\n      eventId: string;\n      calendarId: string;\n    };\n    slack?: {\n      messageId: string;\n      channelId: string;\n    };\n  };\n  createdAt: Date;\n  updatedAt: Date;\n}\n```\n"},"source-b4312b0856c5f094-s9":{"body":"来源：`.spec/rfc/0003-multi-tenant-service.md:153-205`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 3. 多租户中间件\n\n```typescript\n// lib/auth/middleware.ts\nimport { NextRequest, NextResponse } from \"next/server\";\nimport { getTenantFromRequest } from \"./tenant\";\n\nexport async function tenantMiddleware(request: NextRequest) {\n  // 从请求中提取租户信息\n  const tenant = await getTenantFromRequest(request);\n\n  if (!tenant) {\n    return NextResponse.redirect(new URL(\"/login\", request.url));\n  }\n\n  // 将租户信息添加到请求头\n  const requestHeaders = new Headers(request.headers);\n  requestHeaders.set(\"x-tenant-id\", tenant.id);\n\n  return NextResponse.next({\n    request: {\n      headers: requestHeaders,\n    },\n  });\n}\n\n// 获取租户信息\nasync function getTenantFromRequest(\n  request: NextRequest,\n): Promise\u003cTenant | null> {\n  // 从子域名获取\n  const hostname = request.headers.get(\"host\") || \"\";\n  const subdomain = hostname.split(\".\")[0];\n\n  // 从路径获取（如 /t/[tenantId]）\n  const pathname = request.nextUrl.pathname;\n  const tenantMatch = pathname.match(/^\\/t\\/([^/]+)/);\n  const tenantId = tenantMatch?.[1];\n\n  // 从会话获取\n  const session = await getSession(request);\n  const sessionTenantId = session?.tenantId;\n\n  // 查询数据库\n  const tenantIdToUse = tenantId || sessionTenantId;\n  if (!tenantIdToUse) {\n    return null;\n  }\n\n  return await getTenantById(tenantIdToUse);\n}\n```\n"},"source-b4312b0856c5f094-s10":{"body":"来源：`.spec/rfc/0003-multi-tenant-service.md:206-258`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 4. API 路由设计\n\n```typescript\n// app/api/appointments/route.ts\nimport { NextRequest, NextResponse } from \"next/server\";\nimport { getTenantId } from \"@/lib/auth/session\";\nimport { getAppointments, createAppointment } from \"@/lib/db/appointment\";\nimport { loadDSLRuntime } from \"@/lib/dsl/loader\";\n\nexport async function GET(request: NextRequest) {\n  const tenantId = await getTenantId(request);\n  if (!tenantId) {\n    return NextResponse.json({ error: \"Unauthorized\" }, { status: 401 });\n  }\n\n  const { searchParams } = new URL(request.url);\n  const startDate = searchParams.get(\"startDate\");\n  const endDate = searchParams.get(\"endDate\");\n\n  const appointments = await getAppointments(tenantId, {\n    startDate: startDate ? new Date(startDate) : undefined,\n    endDate: endDate ? new Date(endDate) : undefined,\n  });\n\n  return NextResponse.json(appointments);\n}\n\nexport async function POST(request: NextRequest) {\n  const tenantId = await getTenantId(request);\n  if (!tenantId) {\n    return NextResponse.json({ error: \"Unauthorized\" }, { status: 401 });\n  }\n\n  const body = await request.json();\n\n  // 验证预约数据（使用 DSL）\n  const tenant = await getTenant(tenantId);\n  if (tenant.settings.appointmentDSL && body.type) {\n    const dslRuntime = await loadDSLRuntime(tenant.settings.appointmentDSL);\n    const validation = dslRuntime.validate(body, body.type);\n    if (!validation.valid) {\n      return NextResponse.json(\n        { error: \"Validation failed\", details: validation.errors },\n        { status: 400 },\n      );\n    }\n  }\n\n  const appointment = await createAppointment(tenantId, body);\n  return NextResponse.json(appointment);\n}\n```\n"},"source-b4312b0856c5f094-s11":{"body":"来源：`.spec/rfc/0003-multi-tenant-service.md:259-260`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 5. 第三方集成\n"},"source-b4312b0856c5f094-s12":{"body":"来源：`.spec/rfc/0003-multi-tenant-service.md:261-370`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 5.1 Google Calendar 同步\n\n```typescript\n// lib/sync/google.ts\nimport { google } from \"googleapis\";\n\nexport class GoogleCalendarSync {\n  private oauth2Client: OAuth2Client;\n\n  constructor(credentials: GoogleCalendarConfig) {\n    this.oauth2Client = new google.auth.OAuth2(\n      credentials.clientId,\n      credentials.clientSecret,\n      credentials.redirectUri,\n    );\n    this.oauth2Client.setCredentials({\n      refresh_token: credentials.refreshToken,\n    });\n  }\n\n  /**\n   * 同步预约到 Google Calendar\n   */\n  async syncAppointment(appointment: Appointment): Promise\u003cvoid> {\n    const calendar = google.calendar({\n      version: \"v3\",\n      auth: this.oauth2Client,\n    });\n\n    // 如果已有同步信息，更新事件\n    if (appointment.syncInfo?.googleCalendar?.eventId) {\n      await calendar.events.update({\n        calendarId: appointment.syncInfo.googleCalendar.calendarId,\n        eventId: appointment.syncInfo.googleCalendar.eventId,\n        requestBody: this.appointmentToGoogleEvent(appointment),\n      });\n    } else {\n      // 创建新事件\n      const event = await calendar.events.insert({\n        calendarId: \"primary\",\n        requestBody: this.appointmentToGoogleEvent(appointment),\n      });\n\n      // 更新预约的同步信息\n      await updateAppointmentSyncInfo(appointment.id, {\n        googleCalendar: {\n          eventId: event.data.id!,\n          calendarId: \"primary\",\n        },\n      });\n    }\n  }\n\n  /**\n   * 从 Google Calendar 同步事件\n   */\n  async syncFromGoogle(calendarId: string): Promise\u003cAppointment[]> {\n    const calendar = google.calendar({\n      version: \"v3\",\n      auth: this.oauth2Client,\n    });\n    const events = await calendar.events.list({\n      calendarId,\n      timeMin: new Date().toISOString(),\n      maxResults: 100,\n    });\n\n    return (\n      events.data.items?.map((event) => this.googleEventToAppointment(event)) ||\n      []\n    );\n  }\n\n  private appointmentToGoogleEvent(appointment: Appointment): any {\n    return {\n      summary: appointment.title,\n      description: appointment.description,\n      start: {\n        dateTime: appointment.startTime.toISOString(),\n        timeZone: \"UTC\",\n      },\n      end: {\n        dateTime: appointment.endTime.toISOString(),\n        timeZone: \"UTC\",\n      },\n      attendees: appointment.attendees?.map((email) => ({ email })),\n      location: appointment.location,\n    };\n  }\n\n  private googleEventToAppointment(event: any): Appointment {\n    return {\n      id: event.id,\n      title: event.summary || \"\",\n      description: event.description,\n      startTime: new Date(event.start.dateTime || event.start.date),\n      endTime: new Date(event.end.dateTime || event.end.date),\n      location: event.location,\n      attendees: event.attendees?.map((a: any) => a.email),\n      syncInfo: {\n        googleCalendar: {\n          eventId: event.id,\n          calendarId: event.organizer?.email || \"primary\",\n        },\n      },\n    };\n  }\n}\n```\n"},"source-b4312b0856c5f094-s13":{"body":"来源：`.spec/rfc/0003-multi-tenant-service.md:371-451`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 5.2 Slack 集成\n\n```typescript\n// lib/sync/slack.ts\nimport { WebClient } from \"@slack/web-api\";\n\nexport class SlackIntegration {\n  private client: WebClient;\n\n  constructor(token: string) {\n    this.client = new WebClient(token);\n  }\n\n  /**\n   * 发送预约通知到 Slack\n   */\n  async notifyAppointment(\n    appointment: Appointment,\n    channelId: string,\n  ): Promise\u003cvoid> {\n    await this.client.chat.postMessage({\n      channel: channelId,\n      text: `新的预约: ${appointment.title}`,\n      blocks: [\n        {\n          type: \"section\",\n          text: {\n            type: \"mrkdwn\",\n            text: `*${appointment.title}*\\n${this.formatAppointment(appointment)}`,\n          },\n        },\n        {\n          type: \"actions\",\n          elements: [\n            {\n              type: \"button\",\n              text: {\n                type: \"plain_text\",\n                text: \"查看详情\",\n              },\n              url: `https://app.calenderjs.com/appointments/${appointment.id}`,\n            },\n          ],\n        },\n      ],\n    });\n  }\n\n  /**\n   * 创建 Slack 交互（如：快速创建预约）\n   */\n  async createAppointmentFromSlack(\n    payload: SlackInteractionPayload,\n  ): Promise\u003cAppointment> {\n    // 解析 Slack 交互数据\n    const appointmentData = this.parseSlackPayload(payload);\n\n    // 创建预约\n    const appointment = await createAppointment(appointmentData);\n\n    // 发送确认消息\n    await this.client.chat.postMessage({\n      channel: payload.channel.id,\n      text: `预约已创建: ${appointment.title}`,\n    });\n\n    return appointment;\n  }\n\n  private formatAppointment(appointment: Appointment): string {\n    return [\n      `时间: ${this.formatTimeRange(appointment.startTime, appointment.endTime)}`,\n      appointment.location && `地点: ${appointment.location}`,\n      appointment.attendees && `参会人: ${appointment.attendees.join(\", \")}`,\n    ]\n      .filter(Boolean)\n      .join(\"\\n\");\n  }\n}\n```\n"},"source-b4312b0856c5f094-s14":{"body":"来源：`.spec/rfc/0003-multi-tenant-service.md:452-453`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 6. 前端集成\n"},"source-b4312b0856c5f094-s15":{"body":"来源：`.spec/rfc/0003-multi-tenant-service.md:454-506`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 6.1 Next.js 页面组件\n\n```typescript\n// app/(tenant)/[tenantId]/calendar/page.tsx\n'use client';\n\nimport { Calendar } from '@calenderjs/core';\nimport { AppointmentDSLRuntime } from '@calenderjs/event-dsl';\nimport { useEffect, useState } from 'react';\n\nexport default function CalendarPage({ params }: { params: { tenantId: string } }) {\n  const [appointments, setAppointments] = useState\u003cAppointment[]>([]);\n  const [dslRuntime, setDSLRuntime] = useState\u003cAppointmentDSLRuntime | null>(null);\n\n  useEffect(() => {\n    // 加载 DSL 配置\n    loadDSLConfig(params.tenantId).then(config => {\n      const runtime = new AppointmentDSLRuntime(config);\n      setDSLRuntime(runtime);\n    });\n\n    // 加载预约数据\n    loadAppointments(params.tenantId).then(setAppointments);\n  }, [params.tenantId]);\n\n  const handleAppointmentCreate = async (appointment: Partial\u003cAppointment>) => {\n    // 使用 DSL 验证\n    if (dslRuntime && appointment.type) {\n      const validation = dslRuntime.validate(appointment, appointment.type);\n      if (!validation.valid) {\n        alert(validation.errors.join('\\n'));\n        return;\n      }\n    }\n\n    const newAppointment = await createAppointment(params.tenantId, appointment);\n    setAppointments([...appointments, newAppointment]);\n  };\n\n  return (\n    \u003cdiv>\n      \u003cCalendar\n        appointments={appointments}\n        dslRuntime={dslRuntime}\n        onAppointmentCreate={handleAppointmentCreate}\n        onAppointmentUpdate={handleAppointmentUpdate}\n        onAppointmentDelete={handleAppointmentDelete}\n      />\n    \u003c/div>\n  );\n}\n```\n"},"source-b4312b0856c5f094-s16":{"body":"来源：`.spec/rfc/0003-multi-tenant-service.md:507-508`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 实现计划\n"},"source-b4312b0856c5f094-s17":{"body":"来源：`.spec/rfc/0003-multi-tenant-service.md:509-524`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件 合指定的 JSON Schema\n\n## 依赖关系\n\n```\n@calenderjs/event-model (SSOT)\n    ↑                    ↑\n    │                    │\n@calenderjs/calendar  @calenderjs/event-dsl\n```\n\n## 导出\n\n### 1. Event 接口和类型\n\n```typescript\nimport { Event, EventMetadata } from \"@calenderjs/event-model\";\n\nconst event: Event = {\n  id: \"event-1\",\n  type: \"meeting\",\n  title: \"团队会议\",\n  startTime: new Date(\"2025-01-15T10:00:00\"),\n  endTime: new Date(\"2025-01-15T11:00:00\"),\n  data: {\n    attendees: [\"user1@example.com\"],\n    location: \"会议室 A\",\n  },\n};\n```\n\n### 2. Event JSON Schema\n\n```typescript\nimport { EVENT_BASE_SCHEMA } from \"@calenderjs/event-model\";\n\n// EVENT_BASE_SCHEMA 定义了 Event 接口的 JSON Schema\n// 用于验证 Event 对象的基本结构\nconsole.log(EVENT_BASE_SCHEMA);\n```\n\n### 3. Event 验证器\n\n```typescript\nimport { EventValidator, EVENT_BASE_SCHEMA } from \"@calenderjs/event-model\";\nimport type { Event } from \"@calenderjs/event-model\";\n\nconst validator = new EventValidator();\n\n// 验证 Event 对象是否符合 Event Data Model\nconst event: Event = {\n  id: \"event-1\",\n  type: \"meeting\",\n  title: \"团队会议\",\n  startTime: new Date(\"2025-01-15T10:00:00\"),\n  endTime: new Date(\"2025-01-15T11:00:00\"),\n  data: {},\n};\n\nconst result = validator.validateBase(event);\nif (!result.valid) {\n  console.error(\"验证失败:\", result.errors);\n}\n```\n\n## 使用\n\n### 在 calendar 包中使用\n\n```typescript\nimport type { Event } from \"@calenderjs/event-model\";\n\nexport class Calendar {\n  private events: Event[] = [];\n\n  addEvent(event: Event) {\n    this.events.push(event);\n  }\n}\n```\n\n### 在 event-dsl 包中使用\n\n```typescript\nimport type { Event } from \"@calenderjs/event-model\";\n\nexport class EventRuntime {\n  validate(event: Event): ValidationResult {\n    // 验证逻辑\n  }\n}\n```\n\n## 相关 RFC\n\n- RFC-0001: Event Calendar DSL\n- RFC-0011: Event 数据模型与 Event DSL 集成"},"source-668d71d514024fb0-s1":{"body":"来源：`packages/event-model/README.md:1-4`\n\n约束来源图 / Constraint source gra \";\n```\n\n## 相关包\n\n- [@calenderjs/calendar](../calendar/) — 日历 Web Component\n- [@calenderjs/event-model](../event-model/) — Event 数据模型\n- [@calenderjs/event-dsl](../event-dsl/) — Event DSL"},"source-af0c08d6f291aa75-s1":{"body":"来源：`packages/core/README.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# @calenderjs/core\n\nCalenderJS 核心包 — 提供通用数据模型、上下文接口和工具函数。\n\n> **注意**：日历 Web Component 位于 `@calenderjs/calendar`（`\u003cwsx-calendar>`），不在本包中。\n"},"source-af0c08d6f291aa75-s2":{"body":"来源：`packages/core/README.md:7-12`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 职责\n\n- 核心数据模型（`User` 等）\n- 上下文接口（渲染、验证、行为检查上下文）\n- 通用类型定义与工具函数\n"},"source-af0c08d6f291aa75-s3":{"body":"来源：`packages/core/README.md:13-18`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 安装\n\n```bash\npnpm add @calenderjs/core\n```\n"},"source-af0c08d6f291aa75-s4":{"body":"来源：`packages/core/README.md:19-31`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 使用示例\n\n```typescript\nimport type { User } from \"@calenderjs/core\";\nimport {} from /* 工具函数 */ \"@calenderjs/core\";\n\nconst user: User = {\n  id: \"1\",\n  email: \"user@example.com\",\n  role: \"user\",\n};\n```\n"},"source-af0c08d6f291aa75-s5":{"body":"来源：`packages/core/README.md:32-48`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 与 Calendar 的关系\n\n```\n@calenderjs/event-model   # Event 接口 SSOT\n@calenderjs/core          # 核心模型、上下文、工具（本包）\n@calenderjs/calendar      # WSX 日历组件 \u003cwsx-calendar>\n@calenderjs/react         # React 封装\n```\n\nCalendar 组件通过 `@calenderjs/calendar` 导入：\n\n```typescript\nimport { Calendar } from \"@calenderjs/calendar\";\n// 或 React\nimport { Calendar } @calenderjs/react-event-editor` | React Event DSL 编辑器（Monaco）   |\n| `@calenderjs/monaco-event-dsl`   | Monaco Editor DSL 语言插件         |\n\n### 关键架构决策\n\n| 决策                 | 选择                                                    |\n| -------------------- | ------------------------------------------------------- |\n| Calendar 与 DSL      | DSL 驱动；Calendar 接受 EventRuntime，无 runtime 时降级 |\n| Event vs Appointment | Appointment 是业务概念，Event 是技术模型                |\n| DSL 形态             | 文本 DSL（PEG.js → AST）                                |\n| 扩展字段             | `data`（RFC-0011）                                      |\n| 编译/运行时          | `event-dsl`（编译时）与 `event-runtime`（运行时）分离   |\n\n---\n\n## 角色列表\n\n所有角色定义位于 `docs/persona/` 目录：\n\n### 技术专家\n\n- [Linus Torvalds](docs/persona/linus-torvalds.md) - Linux 内核创造者，代码质量与简洁性专家\n- [Evan You](docs/persona/evan-you.md) - Vue.js 和 Vite 创造者，前端开发专家\n- [Addy Osmani](docs/persona/addy-osmani.md) - Chrome 团队工程师，Web 性能专家\n- [Jake Archibald](docs/persona/jake-archibald.md) - Chrome 团队工程师，Service Worker 专家\n- [Ryan Dahl](docs/persona/ryan-dahl.md) - Node.js 和 Deno 创造者\n- [John Carmack](docs/persona/john-carmack.md) - 游戏引擎大师，id Software 联合创始人\n- [Nikola Tesla](docs/persona/nikola-tesla.md) - 发明家和电气工程先驱\n\n### 软件工程\n\n- [Kent Beck](docs/persona/kent-beck.md) - 测试驱动开发(TDD)创始人，极限编程(XP)联合创始人\n- [Robert C. Martin (Uncle Bob)](docs/persona/robert-c-martin-uncle-bob.md) - Clean Code 和 SOLID 原则倡导者\n\n### AI/ML 专家\n\n- [Jeremy Howard](docs/persona/jeremy-howard.md) - fast.ai 联合创始人，实用 AI 教育倡导者\n- [Yann LeCun](docs/persona/yann-lecun.md) - 深度学习先驱，Meta AI 首席科学家，图灵奖得主\n- [Andrej Karpathy](docs/persona/andrej-karpathy.md) - OpenAI 研究员，前 Tesla AI 总监，LLM 工程实践专家\n- [Christopher Manning](docs/persona/christopher-manning.md) - NLP 理论专家，斯坦福大学教授\n\n### 设计专家\n\n- [Don Norman](docs/persona/don-norman.md) - UX 设计之父，《设计心理学》作者\n- [Saul Bass](docs/persona/saul-bass.md) - 电影标题设计和品牌设计大师\n- [Salvador Dalí](docs/persona/salvador-dalí.md) - 超现实主义艺术大师\n- [Leonardo da Vinci](docs/persona/leonardo-da-vinci.md) - 文艺复兴大师，跨学科天才\n- [Pablo Picasso](docs/persona/pablo-picasso.md) - 现代艺术大师，立体主义创造者\n- [Osamu Tezuka](docs/persona/osamu-tezuka.md) - 日本漫画之神，动画大师\n\n### 商业与管理\n\n- [Marc Benioff](docs/persona/marc-benioff.md) - Salesforce 创始人，SaaS 先驱\n- [Tim Cook](docs/persona/tim-cook.md) - 苹果公司 CEO，运营管理专家\n- [Sheryl Sandberg](docs/persona/sheryl-sandberg.md) - Facebook/Meta 前 COO，《向前一步》作者\n- [Dale Carnegie](docs/persona/dale-carnegie.md) - 人际关系大师，《人性的弱点》作者\n\n## 使用方式\n\n每个角色文件包含：角色介绍、核心哲学、沟通原则、需求确认流程、决策输出模式、代码审查标准。\n\n## 软件架构宗师之心法\n\n详见：[软件架构宗师之心法](docs/persona/software-architecture-master.md)\n\n---\n\n## 行为准则\n\n**所有 AI 代理必须严格遵守：**\n\n1. **尊重项目配置**\n   - **严禁**随意使用 `npx` 或猜测命令\n   - **必须**先检查 `package.json`、`turbo.json`\n   - 使用 `pnpm` 运行脚本（`pnpm test`、`pnpm build` 等）\n   - Monorepo 任务通过 Turbo 或 `pnpm --filter` 执行\n\n2. **RFC 驱动开发**\n   - 非琐碎变更**必须**先在 `.spec/rfc/` 创建或更新 RFC\n   - 严禁无 RFC 支持的重大重构或功能移除\n   - RFC 必须反映当前决策状态\n\n3. **语言规范**\n   - 默认使用**中文**与用户沟通（除非用户明确要求其他语言）\n\n4. **WSX 组件开发**\n   - 日历组件位于 `packages/calendar/`，使用 `.wsx` 文件\n   - 参考 `.cursor/skills/wsx-work/SKILL.md` 了解 WSX 开发约定\n\n---\n\n## 项目开发规范\n\n### 包管理器\n\n本项目使用 **pnpm**，**严禁使用 npx**。\n\n### 常用命令\n\n| 任务                 | 命令                                      |\n| -------------------- | ----------------------------------------- |\n| 运行所有测试         | `pnpm test`                               |\n| 运行 calendar 包测试 | `pnpm --filter @calenderjs/calendar test` |\n| 构建所有包           | `pnpm build`                              |\n| 构建 calendar 包     | `pnpm build:calendar`                     |\n| 开发模式             | `pnpm dev`                                |\n| React 演示           | `pnpm dev:react`                          |\n| 代码检查             | `pnpm lint`                               |\n| 类型检查             | `pnpm typecheck`                          |\n| 校验 LLM 文档链接    | `pnpm validate:docs`                      |\n\n### Cursor 规则\n\nAI 代理自动加载 `.cursor/rules/`：\n\n- `00-llm-onboarding.mdc` — 始终生效，任务路由与不变量\n- `wsx-calendar.mdc` — 编辑 `packages/calendar/**` 时生效\n\n### 关键约定\n\n- 测试框架：**vitest**（通过 pnpm 脚本调用，不要直接用 npx）\n- Monorepo 工具：**Turbo + pnpm workspaces**\n- 运行时版本：Node >= 20.19.0 或 >= 22.12.0，pnpm 10.27.0（Volta 管理）\n- RFC 文档位于 `.spec/rfc/`，实现前必须经过审批流程\n- 日历组件标签：`\u003cwsx-calendar>`，主包 `@calenderjs/calendar`（非 `@calenderjs/core`）\n\n---\n\n_最后更新：2026年3月_\n\n\u003c!-- nx configuration start-->\n\u003c!-- Leave the start & end comments to automatically receive updates. -->\n\n# General Guidelines for working with Nx\n\n- When running tasks (for example build, lint, test, e2e, etc.), always prefer running the task through `nx` (i.e. `nx run`, `nx run-many`, `nx affected`) instead of using the underlying tooling directly\n- You have access to the Nx MCP server and its tools, use them to help the user\n- When answering questions about the repository, use the `nx_workspace` tool first to gain an understanding of the workspace architecture where applicable.\n- When working in individual projects, use the `nx_project_details` mcp tool to analyze and understand the specific project structure and dependencies\n- For questions around nx configuration, best practices or if you're unsure, use the `nx_docs` tool to get relevant, up-to-date docs. Always use this instead of assuming things about nx configuration\n- If the user needs help with an Nx configuration or project graph error, use the `nx_workspace` tool to get any errors\n\n\u003c!-- nx configuration end-->"},"source-6ebdb617a8104a77-s1":{"body":"来源：`CLAUDE.md:1-7`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# CLAUDE.md - calenderjs 项目指南\n\n> 与 [AGENTS.md](./AGENTS.md) 保持同步。以 AGENTS.md 为准。\n> **AI 代理入口**：[docs/llm-guide.md](./docs/llm-guide.md) · [llms.txt](./llms.txt)\n\n本文档为 AI 代理与开发者提供项目上下文、角色定义和开发规范。\n"},"source-6ebdb617a8104a77-s2":{"body":"来源：`CLAUDE.md:8-20`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。 务概念，Event 是技术模型                |\n| DSL 形态             | 文本 DSL（PEG.js → AST）                                |\n| 扩展字段             | `data`（RFC-0011）                                      |\n| 编译/运行时          | `event-dsl`（编译时）与 `event-runtime`（运行时）分离   |\n\n---\n"},"source-6ebdb617a8104a77-s5":{"body":"来源：`CLAUDE.md:47-50`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 角色列表\n\n所有角色定义位于 `docs/persona/` 目录：\n"},"source-6ebdb617a8104a77-s6":{"body":"来源：`CLAUDE.md:51-60`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 技术专家\n\n- [Linus Torvalds](docs/persona/linus-torvalds.md) - Linux 内核创造者，代码质量与简洁性专家\n- [Evan You](docs/persona/evan-you.md) - Vue.js 和 Vite 创造者，前端开发专家\n- [Addy Osmani](docs/persona/addy-osmani.md) - Chrome 团队工程师，Web 性能专家\n- [Jake Archibald](docs/persona/jake-archibald.md) - Chrome 团队工程师，Service Worker 专家\n- [Ryan Dahl](docs/persona/ryan-dahl.md) - Node.js 和 Deno 创造者\n- [John Carmack](docs/persona/john-carmack.md) - 游戏引擎大师，id Software 联合创始人\n- [Nikola Tesla](docs/persona/nikola-tesla.md) - 发明家和电气工程先驱\n"},"source-6ebdb617a8104a77-s7":{"body":"来源：`CLAUDE.md:61-65`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 软件工程\n\n- [Kent Beck](docs/persona/kent-beck.md) - 测试驱动开发(TDD)创始人，极限编程(XP)联合创始人\n- [Robert C. Martin (Uncle Bob)](docs/persona/robert-c-martin-uncle-bob.md) - Clean Code 和 SOLID 原则倡导者\n"},"source-6ebdb617a8104a77-s8":{"body":"来源：`CLAUDE.md:66-72`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### AI/ML 专家\n\n- [Jeremy Howard](docs/persona/jeremy-howard.md) - fast.ai 联合创始人，实用 AI 教育倡导者\n- [Yann LeCun](docs/persona/yann-lecun.md) - 深度学习先驱，Meta AI 首席科学家，图灵奖得主\n- [Andrej Karpathy](docs/persona/andrej-karpathy.md) - OpenAI 研究员，前 Tesla AI 总监，LLM 工程实践专家\n- [Christopher Manning ,"rule-rfc-driven":{"body":"# 非琐碎变更须有 RFC\n\n无 RFC 支持的重大重构/功能移除禁止；RFC 须反映当前决策。\n\n## 适用条件\n\n重大功能、重构或移除前\n\n适用性：conditional\n\n## 原文\n\n   - 非琐碎变更**必须**先在 `.spec/rfc/` 创建或更新 RFC\n   - 严禁无 RFC 支持的重大重构或功能移除\n   - RFC 必须反映当前决策状态\n\n## 验证计划\n\n对照 .spec/rfc 与 ROADMAP/TASK 是否一致。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-calendar-pkg":{"body":"# 日历主包是 calendar 非 core\n\nUI 在 @calenderjs/calendar；core 仅模型/上下文/工具。\n\n## 适用条件\n\n导入或引用日历组件时\n\n适用性：conditional\n\n## 原文\n\n- 日历组件标签：`\u003cwsx-calendar>`，主包 `@calenderjs/calendar`（非 `@calenderjs/core`）\n\n## 验证计划\n\n检查 import 路径与自定义元素标签。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-calendar-not-core":{"body":"# Calendar 不在 core\n\n日历实现只在 calendar 包；core 不含日历 UI。\n\n## 适用条件\n\n引用日历实现时\n\n适用性：conditional\n\n## 原文\n\nCALENDAR_PACKAGE     = @calenderjs/calendar   # NOT @calenderjs/core\nCALENDAR_TAG         = wsx-calendar\nEVENT_SSOT           = packages/event-model/src/Event.ts\nDSL_COMPILE_TIME     = @calenderjs/event-dsl\nDSL_RUN_TIME         = @calenderjs/event-runtime\nPACKAGE_MANAGER      = pnpm                  # NEVER npx\nTEST_RUNNER          = vitest via pnpm scripts\nMONOREPO_TOOL        = turbo + pnpm workspaces\n```\n\n## 验证计划\n\n搜索从 core 导入 Calendar 的错误路径。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-event-data-field":{"body":"# 扩展字段用 data\n\n禁止使用已废弃的 extra；业务字段走 Event.data。\n\n## 适用条件\n\n读写 Event 扩展业务字段时\n\n适用性：conditional\n\n## 原文\n\n| Use `extra` field on Event                    | Use `data`                                   |\n| Assume `eventRuntime` prop exists on Calendar | Not implemented yet — check TASK_TRACKING    |\n| Run `npx vitest`                              | `pnpm --filter @calenderjs/calendar test`    |\n| Implement RFC-0003 backend                    | Future plan — out of scope                   |\n| Skip `updateComplete` in WSX tests            | `await element.updateComplete` before assert |\n| Hand-edit `generated/parser.js`               | Edit `.pegjs` and rebuild                    |\n\n## 验证计划\n\ngrep Event.extra / validateExtra 应为空。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-no-0003-now":{"body":"# 禁止实现 RFC-0003\n\n0003 为 Future Plan，当前勿实现。工作树进一步明确落点为兄弟仓 ../site，且勿写本仓 ./site。\n\n## 适用条件\n\n规划或编码多租户后端时\n\n适用性：conditional\n\n## 原文\n\n| Implement RFC-0003 backend                    | Future plan — out of scope                   |\n| Skip `updateComplete` in WSX tests            | `await element.updateComplete` before assert |\n| Hand-edit `generated/parser.js`               | Edit `.pegjs` and rebuild                    |\n\n## 验证计划\n\n确认本仓无租户后端脚手架；./site 仍为文档站。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-pnpm-vitest":{"body":"# 测试走 pnpm filter\n\n用 pnpm --filter 调 vitest，不用 npx vitest。\n\n## 适用条件\n\n跑日历包测试时\n\n适用性：conditional\n\n## 原文\n\n| Run `npx vitest`                              | `pnpm --filter @calenderjs/calendar test`    |\n| Implement RFC-0003 backend                    | Future plan — out of scope                   |\n| Skip `updateComplete` in WSX tests            | `await element.updateComplete` before assert |\n| Hand-edit `generated/parser.js`               | Edit `.pegjs` and rebuild                    |\n\n## 验证计划\n\n检查 CI/本地命令与 package scripts。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-no-event-data-generator":{"body":"# 勿假设 EventDataGenerator 已有\n\nEventDataGenerator 尚未实现；不可当已存在 API 使用。\n\n## 适用条件\n\n生成 Event 实例或规划 0011 时\n\n适用性：conditional\n\n## 原文\n\n- EventDataGenerator (RFC-0011)\n\n## 验证计划\n\n确认 packages/event-dsl/src/generators 无此类。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-no-plugin-yet":{"body":"# 勿假设插件机制已有\n\nRFC-0012 插件机制未实现。\n\n## 适用条件\n\n按 Event.type 注册渲染器时\n\n适用性：conditional\n\n## 原文\n\n- Calendar plugin mechanism (RFC-0012)\n\n## 验证计划\n\n代码库无插件注册 API。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-onboarding-no-0003":{"body":"# onboarding 禁止 0003\n\n明确 DO NOT IMPLEMENT。工作树文案已改为 sibling ../site only。\n\n## 适用条件\n\nAI 代理接到租户/后端任务时\n\n适用性：conditional\n\n## 原文\n\n- RFC-0003 multi-tenant backend (DO NOT IMPLEMENT)\n\n## 验证计划\n\n任务范围不含本仓租户后端。\n\n尚未验证实现；规则适用性不等于合规结果。"},"rule-event-ext-data":{"body":"# 扩展字段名 data\n\n不变量：
