---------------------------------- | --------------------------------------------------------------- |\n| **渲染** | 使用 `event.title`、`event.color` 直接渲染 | 使用 `runtime.render()` 获取增强的 title/color/icon/description |\n| **验证** | 无验证（信任外部数据）                     | 使用 `runtime.validate()` 校验字段/时间约束/冲突                |\n| **行为** | 所有事件可编辑/拖拽/删除                   | 使用 `runtime.canPerform()` 按 DSL behavior 规则和用户角色控制  |\n"},"source-57de40d9754b7ad6-s15":{"body":"来源：`.spec/rfc/0005-calendar-component.md:137-143`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 模式 B：纯数据驱动（无 EventRuntime）\n\n```typescript\nconst calendar = document.querySelector(\"wsx-calendar\");\ncalendar.events = events; // 直接使用 Event 核心字段渲染\n```\n"},"source-57de40d9754b7ad6-s16":{"body":"来源：`.spec/rfc/0005-calendar-component.md:144-197`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Calendar 内部的 DSL 集成逻辑\n\n```typescript\nprivate renderEventBlock(event: Event): HTMLElement {\n  let title = event.title;\n  let color = event.color || '#4285f4';\n  let description = '';\n  let icon: string | undefined;\n\n  if (this._eventRuntime) {\n    const rendered = this._eventRuntime.render(event, { user: this._user });\n    title = rendered.title;\n    color = rendered.color;\n    description = rendered.description || '';\n    icon = rendered.icon;\n  }\n\n  return (\n    \u003cdiv class=\"event-block\" style={{ backgroundColor: color }}\n         onclick={() => this.handleEventClick(event)}>\n      {icon && \u003cspan class=\"event-icon\">{icon}\u003c/span>}\n      \u003cspan class=\"event-title\">{title}\u003c/span>\n      {description && \u003cspan class=\"event-desc\">{description}\u003c/span>}\n    \u003c/div>\n  );\n}\n\nprivate handleEventCreate(eventData: Partial\u003cEvent>): void {\n  if (this._eventRuntime) {\n    const validation = this._eventRuntime.validate(eventData, {\n      existingEvents: this._events,\n      user: this._user\n    });\n    if (!validation.valid) {\n      this.dispatchEvent(new CustomEvent('event-create-error', {\n        detail: { errors: validation.errors },\n        bubbles: true, composed: true\n      }));\n      return;\n    }\n  }\n\n  this.dispatchEvent(new CustomEvent('event-create', {\n    detail: { event: eventData },\n    bubbles: true, composed: true\n  }));\n}\n\nprivate isEventDraggable(event: Event): boolean {\n  if (!this._eventRuntime) return true;\n  return this._eventRuntime.canPerform('drag', event, this._user);\n}\n```\n"},"source-57de40d9754b7ad6-s17":{"body":"来源：`.spec/rfc/0005-calendar-component.md:198-256`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Event 数据模型\n\nCalendar 消费的核心数据结构（定义在 `@calenderjs/event-model`）：\n\n```typescript\ninterface Event {\n  id: string; // 唯一标识符\n  type: string; // DSL 类型标识（如 \"meeting\"、\"vacation\"）\n  title: string; // 显示标题\n  startTime: Date; // 开始时间\n  endTime: Date; // 结束时间\n  color?: string; // 显示颜色\n  icon?: string; // 显示图标\n  data?: Record\u003cstring, any>; // DSL 业务字段容器\n  timeZone?: string; // 时区（IANA 标识符）\n  allDay?: boolean; // 全天事件\n  recurring?: RecurringRule; // 重复规则\n  parentEventId?: string; // 父事件ID（重复事件实例）\n  recurrenceId?: string; // 重复实例ID\n  metadata?: EventMetadata; // 创建/更新元数据\n}\n```\n\n**`Event.data` 字段设计（替代原 `extra`）**：\n\n- DSL fields 定义的业务字段统一存储在 `data` 中\n- 语义明确：\"这是此事件类型的核心数据\"，而非\"额外的附加信息\"\n- JSON Schema 校验 `data` 结构（由 DSL 编译器从 fields 生成）\n- TypeScript 类型生成（如 `MeetingData`）提供开发时类型安全\n\n```typescript\n// meeting 类型事件\n{\n  type: \"meeting\",\n  title: \"团队会议\",\n  startTime: new Date(\"2026-01-15T10:00\"),\n  endTime: new Date(\"2026-01-15T11:00\"),\n  data: {\n    attendees: [\"alice@co.com\", \"bob@co.com\"],\n    location: \"会议室 A\",\n    priority: \"high\"\n  }\n}\n\n// vacation 类型事件\n{\n  type: \"vacation\",\n  title: \"年假\",\n  startTime: new Date(\"2026-02-01\"),\n  endTime: new Date(\"2026-02-03\"),\n  allDay: true,\n  data: {\n    reason: \"春节\",\n    approvedBy: \"manager@co.com\",\n    days: 3\n  }\n}\n```\n"},"source-57de40d9754b7ad6-s18":{"body":"来源：`.spec/rfc/0005-calendar-component.md:257-258`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 视图设计\n"},"source-57de40d9754b7ad6-s19":{"body":"来源：`.spec/rfc/0005-calendar-component.md:259-266`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 月视图（MonthView）\n\n- 显示整月日期网格（6 行 x 7 列，含前后月补齐）\n- 每个日期单元格显示事件预览（标题 + 颜色条）\n- 事件过多时显示 \"+N more\"\n- 点击日期跳转到日视图\n- 双击日期创建事件\n"},"source-57de40d9754b7ad6-s20":{"body":"来源：`.spec/rfc/0005-calendar-component.md:267-273`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 周视图（WeekView）\n\n- 显示 7 天时间轴（默认 00:00-24:00）\n- 事件块按时间定位（top = startTime, height = duration）\n- 处理重叠事件的并排布局\n- 当前时间线指示器\n"},"source-57de40d9754b7ad6-s21":{"body":"来源：`.spec/rfc/0005-calendar-component.md:274-279`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 日视图（DayView）\n\n- 显示单日时间轴（时间槽更细：15/30 分钟）\n- 事件块精确定位\n- 详细事件信息展示\n"},"source-57de40d9754b7ad6-s22":{"body":"来源：`.spec/rfc/0005-calendar-component.md:280-302`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 视图渲染与 DSL 集成\n\n所有视图渲染事件时遵循相同逻辑：\n\n```\nEvent → (有 EventRuntime?) → runtime.render(event) → RenderedEvent\n                           ↓ (无)\n                           → 使用 event.title / event.color 直接渲染\n```\n\n`RenderedEvent` 结构：\n\n```typescript\ninterface RenderedEvent {\n  title: string;\n  description?: string;\n  color: string;\n  icon?: string;\n  allDay?: boolean;\n  [key: string]: any; // 允许扩展渲染属性\n}\n```\n"},"source-57de40d9754b n});\n```\n"},"source-57de40d9754b7ad6-s30":{"body":"来源：`.spec/rfc/0005-calendar-component.md:399-419`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### React 集成\n\n```tsx\nimport \"@calenderjs/calendar\";\nimport { useRef, useEffect } from \"react\";\n\nfunction CalendarApp({ events, user, runtime }) {\n  const ref = useRef\u003cHTMLElement>(null);\n\n  useEffect(() => {\n    const el = ref.current;\n    if (!el) return;\n    el.events = events;\n    el.user = user;\n    el.eventRuntime = runtime;\n  }, [events, user, runtime]);\n\n  return \u003cwsx-calendar ref={ref} view=\"week\" />;\n}\n```\n"},"source-57de40d9754b7ad6-s31":{"body":"来源：`.spec/rfc/0005-calendar-component.md:420-447`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 文件结构\n\n```\npackages/calendar/\n├── src/\n│   ├── Calendar.wsx                   # 主组件\n│   ├── Calendar.css                   # 组件样式（Shadow DOM 内联）\n│   ├── views/\n│   │   ├── MonthView.wsx              # 月视图\n│   │   ├── MonthView.css\n│   │   ├── WeekView.wsx               # 周视图\n│   │   ├── WeekView.css\n│   │   ├── DayView.wsx                # 日视图\n│   │   └── DayView.css\n│   ├── utils/\n│   │   ├── date-utils.ts              # 日期工具\n│   │   └── event-utils.ts             # 事件工具\n│   ├── __tests__/\n│   │   ├── Calendar.test.ts\n│   │   └── utils/\n│   │       ├── date-utils.test.ts\n│   │       └── event-utils.test.ts\n│   └── index.ts\n├── vite.config.ts\n├── vitest.config.ts\n└── package.json\n```\n"},"source-57de40d9754b7ad6-s32":{"body":"来源：`.spec/rfc/0005-calendar-component.md:448-466`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 依赖\n\n```json\n{\n  \"dependencies\": {\n    \"@calenderjs/event-model\": \"workspace:*\",\n    \"@wsxjs/wsx-core\": \"^0.0.23\"\n  },\n  \"peerDependencies\": {\n    \"@wsxjs/wsx-co (https://calendar.google.com/)\n- [FullCalendar](https://fullcalendar.io/)\n- [Web Components 标准](https://developer.mozilla.org/en-US/docs/Web/Web_Components)\n- [WSX 框架](https://wsxjs.dev)\n\n---\n\n_本 RFC 定义了 `\u003cwsx-calendar>` 组件的完整架构：DSL 驱动的事件渲染、验证和行为控制，同时支持无 DSL 的纯数据驱动降级模式。_"},"source-feb361f1b9405649":{"body":"# .spec/rfc/0004-react-demo-site.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：README.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC-0004: React Calendar Package and Demo Site\n\n**状态**: Implemented  \n**完成日期**: 2026-03-15  \n**创建日期**: 2024-12-19  \n**作者**: WSX Team  \n**关联 RFC**: RFC-0001\n\n## 摘要\n\n设计并实现两部分内容：\n\n1. **React 组件包 `@calenderjs/react`**：提供 Calendar 组件的 React 封装，将基于 WSX 的 `\u003cwsx-calendar>` Web Component 包装为 React 组件，方便 React 开发者使用。\n\n2. **演示网站 `apps/demo-calenderjs-react`**：基于 React + Vite 的演示网站，展示如何使用 `@calenderjs/react` 包，提供组件使用示例、DSL 配置演示和交互式体验。\n\n**重要说明**：\n\n- **React 包**：创建一个独立的 React 包，暴露 Calendar 组件\n- **演示网站**：创建一个演示网站展示 React 包的使用方式\n- **消费 RFC-0001**：React 包和演示网站都使用 RFC-0001 定义的 `@calenderjs/calendar` 组件和 Event DSL\n- **React 封装**：将基于 WSX 的 Web Component 封装为 React 组件，提供更好的 React 开发体验\n- **类型安全**：提供完整的 TypeScript 类型支持\n\n## 动机\n\n### 为什么需要 React 包？\n\n- **React 集成**：React 开发者需要 React 组件，而不是直接使用 Web Component\n- **类型安全**：提供完整的 TypeScript 类型支持\n- **开发体验**：提供 React Hook 和组件，简化状态管理\n- **生态兼容**：与 React 生态系统（状态管理、路由等）无缝集成\n\n### 为什么需要演示网站？\n\n- **组件展示**：直观展示 React 包的使用方式和功能\n- **DSL 演示**：展示 Event DSL 的定义和使用方式\n- **快速上手**：为开发者提供可运行的示例代码\n- **文档补充**：通过实际运行的应用补充文档说明\n\n### 与 RFC-0003 的区别\n\n- **RFC-0003**：完整的多租户企业服务（ToB），使用 Next.js，包含数据库、认证、第三方集成等\n- **RFC-0004**：React 组件包 + 简单的演示网站，使用 React + Vite，仅用于展示组件功能，无后端服务\n\n## 详细设计\n\n### 1. 包结构\n\n#### 1.1 React 组件包：`@calenderjs/react`\n\n```\npackages/react/\n├── src/\n│   ├── Calendar.tsx                 # React Calendar 组件（包装 wsx-calendar）\n│   ├── hooks/\n│   │   └── useCalendar.ts           # Calendar Hook\n│   ├── types.ts                     # TypeScript 类型定义\n│   └── index.ts                     # 导出入口\n├── package.json\n├── tsconfig.json\n└── vite.config.ts\n```\n\n**包依赖**：\n\n```json\n{\n  \"name\": \"@calenderjs/react\",\n  \"dependencies\": {\n    \"@calenderjs/calendar\": \"workspace:*\",\n    \"@calenderjs/event-dsl\": \"workspace:*\",\n    \"@calenderjs/core\": \"workspace:*\",\n    \"react\": \"^18.0.0\"\n  },\n  \"peerDependencies\": {\n    \"react\": \"^18.0.0\",\n    \"react-dom\": \"^18.0.0\"\n  }\n}\n```\n\n#### 1.2 演示网站：`apps/demo-calenderjs-react`\n\n```\napps/demo-calenderjs-react/\n├── src/\n│   ├── App.tsx                      # 主应用组件\n│   ├── main.tsx                     # 入口文件\n│   ├── pages/\n│   │   ├── Home.tsx                 # 首页（组件展示）\n│   │   ├── BasicExample.tsx         # 基础使用示例\n│   │   ├── DSLExample.tsx           # DSL 使用示例\n│   │   └── AdvancedExample.tsx      # 高级功能示例\n│   ├── components/\n│   │   └── EventForm.tsx            # 事件表单组件\n│   └── styles/\n│       └── globals.css\n├── public/\n│   └── ...\n├── index.html\n├── package.json\n└── vite.config.ts\n```\n\n**演示网站依赖**：\n\n```json\n{\n  \"name\": \"demo-calenderjs-react\",\n  \"dependencies\": {\n    \"@calenderjs/react\": \"workspace:*\",\n    \"react\": \"^18.0.0\",\n    \"react-dom\": \"^18.0.0\",\n    \"react-router-dom\": \"^6.0.0\"\n  }\n}\n```\n\n### 2. React 组件包设计\n\n#### 2.1 Calendar 组件（React 封装）\n\n```typescript\n// packages/react/src/Calendar.tsx\nimport { useEffect, useRef, forwardRef, useImperativeHandle } from 'react';\nimport '@calenderjs/calendar'; // 注册 Web Component\nimport { Event, EventTypeAST, User } from '@calenderjs/core';\n\nexport interface CalendarProps {\n  eventDSL: string | EventTypeAST | EventTypeAST[];\n  events: Event[];\n  user?: User;\n  defaultView?: 'month' | 'week' | 'day';\n  currentDate?: Date;\n  onEventCreate?: (event: Partial\u003cEvent>) => void;\n  onEventUpdate?: (id: string, event: Partial\u003cEvent>) => void;\n  onEventDelete?: (id: string) => void;\n  onViewChange?: (view: 'month' | 'week' | 'day') => void;\n  onDateChange?: (date: Date) => void;\n  className?: string;\n  style?: React.CSSProperties;\n}\n\nexport interface CalendarRef {\n  setEvents: (events: Event[]) => void;\n  setEventDSL: (dsl: string | EventTypeAST | EventTypeAST[]) => void;\n  setUser: (user: User) => void;\n  getCalendar: () => HTMLElement | null;\n}\n\nexport const Calendar = forwardRef\u003cCalendarRef, CalendarProps>(\n  (\n    {\n      eventDSL,\n      events,\n      user,\n      defaultView = 'month',\n      currentDate,\n      onEventCreate,\n      onEventUpdate,\n      onEventDelete,\n      onViewChange,\n      onDateChange,\n      className,\n      style,\n    },\n    ref\n  ) => {\n    const calendarRef = useRef\u003cHTMLElement>(null);\n\n    // 注册 Web Component（如果还没有注册）\n    useEffect(() => {\n      if (!customElements.get('wsx-calendar')) {\n        import('@calenderjs/calendar');\n      }\n    }, []);\n\n    // 设置属性\n    useEffect(() => {\n      const calendar = calendarRef.current as any;\n      if (!calendar) return;\n\n      calendar.eventDSL = eventDSL;\n      calendar.events = events;\n      if (user) calendar.user = user;\n      if (defaultView) calendar.defaultView = defaultView;\n      if (currentDate) calendar.currentDate = currentDate;\n    }, [eventDSL, events, user, defaultView, currentDate]);\n\n    // 监听事件\n    useEffect(() => {\n      const calendar = calendarRef.current;\n      if (!calendar) return;\n\n      const handleEventCreate = (e: CustomEvent) => {\n        onEventCreate?.(e.detail);\n      };\n      const handleEventUpdate = (e: CustomEvent) => {\n        onEventUpdate?.(e.detail.id, e.detail.event);\n      };\n      const handleEventDelete = (e: CustomEvent) => {\n        onEventDelete?.(e.detail.id);\n      };\n      const handleViewChange = (e: CustomEvent) => {\n        onViewChange?.(e.detail.view);\n      };\n      const handleDateChange = (e: CustomEvent) => {\n        onDateChange?.(e.detail.date);\n      };\n\n      calendar.addEventListener('event-create', handleEventCreate);\n      calendar.addEventListener('event-update', handleEventUpdate);\n      calendar.addEventListener('event-delete', handleEventDelete);\n      calendar.addEventListener('view-change', handleViewChange);\n      calendar.addEventListener('date-change', handleDateChange);\n\n      return () => {\n        calendar.removeEventListener('event-create', handleEventCreate);\n        calendar.removeEventListener('event-update', handleEventUpdate);\n        calendar.removeEventListener('event-delete', handleEventDelete);\n        calendar.removeEventListener('view-change', handleViewChange);\n        calendar.removeEventListener('date-change', handleDateChange);\n      };\n    }, [onEventCreate, onEventUpdate, onEventDelete, onViewChange, onDateChange]);\n\n    // 暴露方法给父组件\n    useImperativeHandle(ref, () => ({\n      setEvents: (newEvents: Event[]) => {\n        const calendar = calendarRef.current as any;\n        if (calendar) calendar.events = newEvents;\n      },\n      setEventDSL: (dsl: string | EventTypeAST | EventTypeAST[]) => {\n        const calendar = calendarRef.current as any;\n        if (calendar) calendar.eventDSL = dsl;\n      },\n      setUser: (newUser: User) => {\n        const calendar = calendarRef.current as any;\n        if (calendar) calendar.user = newUser;\n      },\n      getCalendar: () => calendarRef.current,\n    }));\n\n    return (\n      \u003cwsx-calendar\n        ref={calendarRef}\n        className={className}\n        style={style}\n      />\n    );\n  }\n);\n\nCalendar.displayName = 'Calendar';\n```\n\n#### 2.2 useCalendar Hook\n\n```typescript\n// packages/react/src/hooks/useCalendar.ts\nimport { useState, useCallback, useMemo } from \"react\";\nimport { Event, EventTypeAST, User } from \"@calenderjs/core\";\nimport { parseEventDSL } from \"@calenderjs/event-dsl\";\n\nexport function useCalendar(dslText: string, initialUser?: User) {\n  const [events, setEvents] = useState\u003cEvent[]>([]);\n  const [user, setUser] = useState\u003cUser | undefined>(initialUser);\n\n  // 解析 DSL\n  const ast = useMemo(() => {\n    try {\n      return parseEventDSL(dslText);\n    } catch (error) {\n      console.error(\"Failed to parse DSL:\", error);\n      return null;\n    }\n  }, [dslText]);\n\n  // 添加事件\n  const addEvent = useCallback((event: Event) => {\n    setEvents((prev) => [...prev, event]);\n  }, []);\n\n  // 更新事件\n  const updateEvent = useCallback((id: string, updates: Partial\u003cEvent>) => {\n    setEvents((prev) =>\n      prev.map((event) => (event.id === id ? { ...event, ...updates } : event)),\n    );\n  }, []);\n\n  // 删除事件\n  const deleteEvent = useCallback((id: string) => {\n    setEvents((prev) => prev.filter((event) => event.id !== id));\n  }, []);\n\n  return {\n    events,\n    setEvents,\n    user,\n    setUser,\n    ast,\n    addEvent,\n    updateEvent,\n    deleteEvent,\n  };\n}\n```\n\n#### 2.3 导出\n\n```typescript\n// packages/react/src/index.ts\nexport { Calendar } from \"./Calendar\";\nexport type { CalendarProps, CalendarRef } from \"./Calendar\";\nexport { useCalendar } from \"./hooks/useCalendar\";\nexport * from \"@calenderjs/core\";\n```\n\n### 3. 演示网站功能\n\n#### 3.1 组件展示页面\n\n- **基础使用**：展示如何使用 `@calenderjs/react` 的 Calendar 组件\n- **DSL 集成**：展示如何使用 Event DSL 定义和渲染事件类型\n- **交互功能**：展示拖拽、调整大小等功能（待实现）\n\n#### 3.2 示例代码\n\n- **可运行的示例**：所有示例都可以直接在浏览器中运行\n- **代码展示**：展示源代码和使用说明\n- **交互式编辑**：允许用户修改示例代码（可选）\n\n### 4. 技术实现\n\n#### 4.1 React 包构建配置\n\n```typescript\n// packages/react/vite.config.ts\nimport { defineConfig } from \"vite\";\nimport react from \"@vitejs/plugin-react\";\nimport { resolve } from \"path\";\n\nexport default defineConfig({\n  build: {\n    lib: {\n      entry: resolve(__dirname, \"src/index.ts\"),\n      name: \"CalenderJSReact\",\n      formats: [\"es\", \"cjs\"],\n      fileName: (format) => `index.${format === \"es\" ? \"js\" : \"cjs\"}`,\n    },\n    rollupOptions: {\n      external: [\n        \"react\",\n        \"react-dom\",\n        \"@calenderjs/calendar\",\n        \"@calenderjs/event-dsl\",\n        \"@calenderjs/core\",\n      ],\n      output: {\n        globals: {\n          react: \"React\",\n          \"react-dom\": \"ReactDOM\",\n        },\n      },\n    },\n  },\n  plugins: [react()],\n});\n```\n\n#### 4.2 演示网站 Vite 配置\n\n```typescript\n// apps/demo-calenderjs-react/vite.config.ts\nimport { defineConfig } from \"vite\";\nimport react from \"@vitejs/plugin-react\";\nimport path from \"path\";\n\nexport default defineConfig({\n  plugins: [react()],\n  resolve: {\n    alias: {\n      \"@\": path.resolve(__dirname, \"./src\"),\n    },\n  },\n  build: {\n    outDir: \"dist\",\n  },\n});\n```\n\n### 5. 演示网站页面设计\n\n#### 5.1 首页（Home.tsx）\n\n- 组件概览\n- 快速开始指南\n- 功能特性列表\n- 链接到各个示例页面\n\n#### 5.2 基础使用示例（BasicExample.tsx）\n\n```tsx\nimport { Calendar } from \"@calenderjs/react\";\nimport { Event } from \"@calenderjs/core\";\n\nfunction BasicExample() {\n  const [events, setEvents] = useState\u003cEvent[]>([]);\n\n  return (\n    \u003cCalendar\n      eventDSL={simpleDSL}\n      events={events}\n      defaultView=\"week\"\n      onEventCreate={(event) => {\n        const newEvent: Event = {\n          id: Date.now().toString(),\n          type: \"meeting\",\n          title: event.title || \"新事件\",\n          startTime: event.startTime || new Date(),\n          endTime: event.endTime || new Date(),\n          data: event.data || {},\n        };\n        setEvents((prev) => [...prev, newEvent]);\n      }}\n    />\n  );\n}\n```\n\n#### 5.3 DSL 使用示例（DSLExample.tsx）\n\n- 展示如何定义 Event DSL\n- 展示如何使用 `useCalendar` Hook\n- 展示不同类型的事件渲染\n\n#### 5.4 高级功能示例（AdvancedExample.tsx）\n\n- 自定义渲染\n- 事件处理\n- 视图切换\n- 拖拽功能（待实现）\n\n## 实现计划\n\n### 阶段 1: React 组件包（3 天）\n\n**Day 1-2**：\n\n1. 创建 `packages/react` 包结构\n2. 实现 Calendar React 组件（包装 wsx-calendar）\n3. 实现 useCalendar Hook\n4. 创建 TypeScript 类型定义\n5. 配置构建（Vite）\n\n**Day 3**：\n\n1. 编写单元测试\n2. 编写文档\n3. 发布包\n\n### 阶段 2: 演示网站（2 天）\n\n**Day 1**：\n\n1. 创建 `apps/demo-calenderjs-react` 项目\n2. 配置 Vite + React\n3. 配置 React Router\n4. 创建基础页面结构\n\n**Day 2**：\n\n1. 实现基础使用示例\n2. 实现 DSL 使用示例\n3. 实现高级功能示例\n4. 优化 UI/UX\n\n## 技术栈\n\n- **Vite**: 构建工具\n- **React 18**: UI 框架\n- **TypeScript**: 类型安全\n- **React Router**: 路由（可选）\n- **@calenderjs/calendar**: Calendar 组件（基于 WSX，来自 RFC-0001）\n- **@calenderjs/event-dsl**: Event DSL 系统（来自 RFC-0001）\n- **@calenderjs/core**: 核心接口（来自 RFC-0001）\n\n## React 与 WSX 组件集成\n\n### 集成方式\n\nWSX 组件是基于 Web Components 标准的，可以在 React 中直接使用：\n\n```tsx\n// React 组件中使用 WSX Calendar 组件\nimport { useEffect, useRef } from \"react\";\nimport \"@calenderjs/calendar\"; // 注册 Web Component\n\nfunction CalendarPage() {\n  const calendarRef = useRef\u003cHTMLElement>(null);\n\n  useEffect(() => {\n    // 获取 Web Component 实例\n    const calendar = calendarRef.current as any;\n\n    // 设置 DSL 配置\n    calendar.eventDSL = meetingDSL;\n\n    // 设置事件数据\n    calendar.events = events;\n\n    // 监听事件\n    calendar.addEventListener(\"event-create\", handleEventCreate);\n  }, []);\n\n  return (\n    \u003cwsx-calendar\n      ref={calendarRef}\n      event-dsl={meetingDSL}\n      events={events}\n      default-view=\"week\"\n    />\n  );\n}\n```\n\n### React 包装组件\n\n为了更好的 React 集成体验，可以创建 React 包装组件：\n\n```tsx\n// CalendarWrapper.tsx\nimport { useEffect, useRef, forwardRef } from \"react\";\nimport \"@calenderjs/calendar\";\nimport { Event, EventTypeAST, User } from \"@calenderjs/core\";\n\ninterface CalendarWrapperProps {\n  eventDSL: string | EventTypeAST | EventTypeAST[];\n  events: Event[];\n  user?: User;\n  defaultView?: \"month\" | \"week\" | \"day\";\n  onEventCreate?: (event: Partial\u003cEvent>) => void;\n  onEventUpdate?: (id: string, event: Partial\u003cEvent>) => void;\n  onEventDelete?: (id: string) => void;\n}\n\nexport const CalendarWrapper = forwardRef\u003cHTMLElement, CalendarWrapperProps>(\n  (\n    {\n      eventDSL,\n      events,\n      user,\n      defaultView,\n      onEventCreate,\n      onEventUpdate,\n      onEventDelete,\n    },\n    ref,\n  ) => {\n    const calendarRef = useRef\u003cHTMLElement>(null);\n\n    useEffect(() => {\n      const calendar = (ref || calendarRef).current as any;\n      if (!calendar) return;\n\n      // 设置属性\n      calendar.eventDSL = eventDSL;\n      calendar.events = events;\n      if (user) calendar.user = user;\n      if (defaultView) calendar.defaultView = defaultView;\n\n      // 监听事件\n      if (onEventCreate) {\n        calendar.addEventListener(\"event-create\", (e: CustomEvent) => {\n          onEventCreate(e.detail);\n        });\n      }\n      if (onEventUpdate) {\n        calendar.addEventListener(\"event-update\", (e: CustomEvent) => {\n          onEventUpdate(e.detail.id, e.detail.event);\n        });\n      }\n      if (onEventDelete) {\n        calendar.addEventListener(\"event-delete\", (e: CustomEvent) => {\n          onEventDelete(e.detail.id);\n        });\n      }\n\n      return () => {\n        // 清理事件监听器\n        if (onEventCreate) {\n          calendar.removeEventListener(\"event-create\", onEventCreate);\n        }\n        // ...\n      };\n    }, [\n      eventDSL,\n      events,\n      user,\n      defaultView,\n      onEventCreate,\n      onEventUpdate,\n      onEventDelete,\n    ]);\n\n    return (\n      \u003cwsx-calendar\n        ref={ref || calendarRef}\n        event-dsl={eventDSL}\n        events={events}\n        user={user}\n        default-view={defaultView}\n      />\n    );\n  },\n);\n```\n\n### 使用示例\n\n```tsx\n// App.tsx\nimport { useState } from \"react\";\nimport { CalendarWrapper } from \"./components/CalendarWrapper\";\nimport { Event } from \"@calenderjs/core\";\nimport { parseEventDSL } from \"@calenderjs/event-dsl\";\n\nconst meetingDSL = `\ntype: meeting\nname: 会议\n\nfields:\n  - title: string, required\n  - attendees: list of email, required\n\nvalidate:\n  attendees.count between 1 and 50\n  startTime.hour between 9 and 18\n\ndisplay:\n  color: \"#4285f4\"\n  title: \"{event.title}\"\n`;\n\nfunction App() {\n  const [events, setEvents] = useState\u003cEvent[]>([]);\n  const [user] = useState({ id: \"1\", email: \"user@example.com\", role: \"user\" });\n\n  const handleEventCreate = (event: Partial\u003cEvent>) => {\n    const newEvent: Event = {\n      id: Date.now().toString(),\n      type: \"meeting\",\n      title: event.title || \"新事件\",\n      startTime: event.startTime || new Date(),\n      endTime: event.endTime || new Date(),\n      data: event.data || {},\n    };\n    setEvents([...events, newEvent]);\n  };\n\n  return (\n    \u003cdiv>\n      \u003ch1>CalenderJS React Demo\u003c/h1>\n      \u003cCalendarWrapper\n        eventDSL={meetingDSL}\n        events={events}\n        user={user}\n        defaultView=\"week\"\n        onEventCreate={handleEventCreate}\n      />\n    \u003c/div>\n  );\n}\n```\n\n## 与 RFC-0003 的关系\n\n- **RFC-0003**：完整的企业级多租户服务，使用 Next.js（包含服务端功能）\n- **RFC-0004**：简单的演示网站，使用 React + Vite（纯前端），用于展示组件功能\n- 两者技术栈不同：RFC-0003 需要 Next.js 的服务端功能，RFC-0004 只需要前端展示\n\n## 未解决问题\n\n1. **代码编辑器**：是否需要集成代码编辑器让用户在线编辑？\n2. **部署方式**：如何部署演示网站？\n3. **文档集成**：是否与文档网站集成？\n\n---\n\n_本 RFC 定义了一个 React 组件包 `@calenderjs/react` 和一个演示网站 `apps/demo-calenderjs-react`，用于为 React 开发者提供便捷的 Calendar 组件封装和使用示例。_"},"source-feb361f1b9405649-s1":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:1-8`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC-0004: React Calendar Package and Demo Site\n\n**状态**: Implemented  \n**完成日期**: 2026-03-15  \n**创建日期**: 2024-12-19  \n**作者**: WSX Team  \n**关联 RFC**: RFC-0001\n"},"source-feb361f1b9405649-s2":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:9-24`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 摘要\n\n设计并实现两部分内容：\n\n1. **React 组件包 `@calenderjs/react`**：提供 Calendar 组件的 React 封装，将基于 WSX 的 `\u003cwsx-calendar>` Web Component 包装为 React 组件，方便 React 开发者使用。\n\n2. **演示网站 `apps/demo-calenderjs-react`**：基于 React + Vite 的演示网站，展示如何使用 `@calenderjs/react` 包，提供组件使用示例、DSL 配置演示和交互式体验。\n\n**重要说明**：\n\n- **React 包**：创建一个独立的 React 包，暴露 Calendar 组件\n- **演示网站**：创建一个演示网站展示 React 包的使用方式\n- **消费 RFC-0001**：React 包和演示网站都使用 RFC-0001 定义的 `@calenderjs/calendar` 组件和 Event DSL\n- **React 封装**：将基于 WSX 的 Web Component 封装为 React 组件，提供更好的 React 开发体验\n- **类型安全**：提供完整的 TypeScript 类型支持\n"},"source-feb361f1b9405649-s3":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:25-26`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 动机\n"},"source-feb361f1b9405649-s4":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:27-33`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 为什么需要 React 包？\n\n- **React 集成**：React 开发者需要 React 组件，而不是直接使用 Web Component\n- **类型安全**：提供完整的 TypeScript 类型支持\n- **开发体验**：提供 React Hook 和组件，简化状态管理\n- **生态兼容**：与 React 生态系统（状态管理、路由等）无缝集成\n"},"source-feb361f1b9405649-s5":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:34-40`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 为什么需要演示网站？\n\n- **组件展示**：直观展示 React 包的使用方式和功能\n- **DSL 演示**：展示 Event DSL 的定义和使用方式\n- **快速上手**：为开发者提供可运行的示例代码\n- **文档补充**：通过实际运行的应用补充文档说明\n"},"source-feb361f1b9405649-s6":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:41-45`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 与 RFC-0003 的区别\n\n- **RFC-0003**：完整的多租户企业服务（ToB），使用 Next.js，包含数据库、认证、第三方集成等\n- **RFC-0004**：React 组件包 + 简单的演示网站，使用 React + Vite，仅用于展示组件功能，无后端服务\n"},"source-feb361f1b9405649-s7":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:46-47`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 详细设计\n"},"source-feb361f1b9405649-s8":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:48-49`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 1. 包结构\n"},"source-feb361f1b9405649-s9":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:50-82`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 1.1 React 组件包：`@calenderjs/react`\n\n```\npackages/react/\n├── src/\n│   ├── Calendar.tsx                 # React Calendar 组件（包装 wsx-calendar）\n│   ├── hooks/\n│   │   └── useCalendar.ts           # Calendar Hook\n│   ├── types.ts                     # TypeScript 类型定义\n│   └── index.ts                     # 导出入口\n├── package.json\n├── tsconfig.json\n└── vite.config.ts\n```\n\n**包依赖**：\n\n```json\n{\n  \"name\": \"@calenderjs/react\",\n  \"dependencies\": {\n    \"@calenderjs/calendar\": \"workspace:*\",\n    \"@calenderjs/event-dsl\": \"workspace:*\",\n    \"@calenderjs/core\": \"workspace:*\",\n    \"react\": \"^18.0.0\"\n  },\n  \"peerDependencies\": {\n    \"react\": \"^18.0.0\",\n    \"react-dom\": \"^18.0.0\"\n  }\n}\n```\n"},"source-feb361f1b9405649-s10":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:83-119`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 1.2 演示网站：`apps/demo-calenderjs-react`\n\n```\napps/demo-calenderjs-react/\n├── src/\n│   ├── App.tsx                      # 主应用组件\n│   ├── main.tsx                     # 入口文件\n│   ├── pages/\n│   │   ├── Home.tsx                 # 首页（组件展示）\n│   │   ├── BasicExample.tsx         # 基础使用示例\n│   │   ├── DSLExample.tsx           # DSL 使用示例\n│   │   └── AdvancedExample.tsx      # 高级功能示例\n│   ├── components/\n│   │   └── EventForm.tsx            # 事件表单组件\n│   └── styles/\n│       └── globals.css\n├── public/\n│   └── ...\n├── index.html\n├── package.json\n└── vite.config.ts\n```\n\n**演示网站依赖**：\n\n```json\n{\n  \"name\": \"demo-calenderjs-react\",\n  \"dependencies\": {\n    \"@calenderjs/react\": \"workspace:*\",\n    \"react\": \"^18.0.0\",\n    \"react-dom\": \"^18.0.0\",\n    \"react-router-dom\": \"^6.0.0\"\n  }\n}\n```\n"},"source-feb361f1b9405649-s11":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:120-121`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 2. React 组件包设计\n"},"source-feb361f1b9405649-s12":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:122-256`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 2.1 Calendar 组件（React 封装）\n\n```typescript\n// packages/react/src/Calendar.tsx\nimport { useEffect, useRef, forwardRef, useImperativeHandle } from 'react';\nimport '@calenderjs/calendar'; // 注册 Web Component\nimport { Event, EventTypeAST, User } from '@calenderjs/core';\n\nexport interface CalendarProps {\n  eventDSL: string | EventTypeAST | EventTypeAST[];\n  events: Event[];\n  user?: User;\n  defaultView?: 'month' | 'week' | 'day';\n  currentDate?: Date;\n  onEventCreate?: (event: Partial\u003cEvent>) => void;\n  onEventUpdate?: (id: string, event: Partial\u003cEvent>) => void;\n  onEventDelete?: (id: string) => void;\n  onViewChange?: (view: 'month' | 'week' | 'day') => void;\n  onDateChange?: (date: Date) => void;\n  className?: string;\n  style?: React.CSSProperties;\n}\n\nexport interface CalendarRef {\n  setEvents: (events: Event[]) => void;\n  setEventDSL: (dsl: string | EventTypeAST | EventTypeAST[]) => void;\n  setUser: (user: User) => void;\n  getCalendar: () => HTMLElement | null;\n}\n\nexport const Calendar = forwardRef\u003cCalendarRef, CalendarProps>(\n  (\n    {\n      eventDSL,\n      events,\n      user,\n      defaultView = 'month',\n      currentDate,\n      onEventCreate,\n      onEventUpdate,\n      onEventDelete,\n      onViewChange,\n      onDateChange,\n      className,\n      style,\n    },\n    ref\n  ) => {\n    const calendarRef = useRef\u003cHTMLElement>(null);\n\n    // 注册 Web Component（如果还没有注册）\n    useEffect(() => {\n      if (!customElements.get('wsx-calendar')) {\n        import('@calenderjs/calendar');\n      }\n    }, []);\n\n    // 设置属性\n    useEffect(() => {\n      const calendar = calendarRef.current as any;\n      if (!calendar) return;\n\n      calendar.eventDSL = eventDSL;\n      calendar.events = events;\n      if (user) calendar.user = user;\n      if (defaultView) calendar.defaultView = defaultView;\n      if (currentDate) calendar.currentDate = currentDate;\n    }, [eventDSL, events, user, defaultView, currentDate]);\n\n    // 监听事件\n    useEffect(() => {\n      const calendar = calendarRef.current;\n      if (!calendar) return;\n\n      const handleEventCreate = (e: CustomEvent) => {\n        onEventCreate?.(e.detail);\n      };\n      const handleEventUpdate = (e: CustomEvent) => {\n        onEventUpdate?.(e.detail.id, e.detail.event);\n      };\n      const handleEventDelete = (e: CustomEvent) => {\n        onEventDelete?.(e.detail.id);\n      };\n      const handleViewChange = (e: CustomEvent) => {\n        onViewChange?.(e.detail.view);\n      };\n      const handleDateChange = (e: CustomEvent) => {\n        onDateChange?.(e.detail.date);\n      };\n\n      calendar.addEventListener('event-create', handleEventCreate);\n      calendar.addEventListener('event-update', handleEventUpdate);\n      calendar.addEventListener('event-delete', handleEventDelete);\n      calendar.addEventListener('view-change', handleViewChange);\n      calendar.addEventListener('date-change', handleDateChange);\n\n      return () => {\n        calendar.removeEventListener('event-create', handleEventCreate);\n        calendar.removeEventListener('event-update', handleEventUpdate);\n        calendar.removeEventListener('event-delete', handleEventDelete);\n        calendar.removeEventListener('view-change', handleViewChange);\n        calendar.removeEventListener('date-change', handleDateChange);\n      };\n    }, [onEventCreate, onEventUpdate, onEventDelete, onViewChange, onDateChange]);\n\n    // 暴露方法给父组件\n    useImperativeHandle(ref, () => ({\n      setEvents: (newEvents: Event[]) => {\n        const calendar = calendarRef.current as any;\n        if (calendar) calendar.events = newEvents;\n      },\n      setEventDSL: (dsl: string | EventTypeAST | EventTypeAST[]) => {\n        const calendar = calendarRef.current as any;\n        if (calendar) calendar.eventDSL = dsl;\n      },\n      setUser: (newUser: User) => {\n        const calendar = calendarRef.current as any;\n        if (calendar) calendar.user = newUser;\n      },\n      getCalendar: () => calendarRef.current,\n    }));\n\n    return (\n      \u003cwsx-calendar\n        ref={calendarRef}\n        className={className}\n        style={style}\n      />\n    );\n  }\n);\n\nCalendar.displayName = 'Calendar';\n```\n"},"source-feb361f1b9405649-s13":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:257-308`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 2.2 useCalendar Hook\n\n```typescript\n// packages/react/src/hooks/useCalendar.ts\nimport { useState, useCallback, useMemo } from \"react\";\nimport { Event, EventTypeAST, User } from \"@calenderjs/core\";\nimport { parseEventDSL } from \"@calenderjs/event-dsl\";\n\nexport function useCalendar(dslText: string, initialUser?: User) {\n  const [events, setEvents] = useState\u003cEvent[]>([]);\n  const [user, setUser] = useState\u003cUser | undefined>(initialUser);\n\n  // 解析 DSL\n  const ast = useMemo(() => {\n    try {\n      return parseEventDSL(dslText);\n    } catch (error) {\n      console.error(\"Failed to parse DSL:\", error);\n      return null;\n    }\n  }, [dslText]);\n\n  // 添加事件\n  const addEvent = useCallback((event: Event) => {\n    setEvents((prev) => [...prev, event]);\n  }, []);\n\n  // 更新事件\n  const updateEvent = useCallback((id: string, updates: Partial\u003cEvent>) => {\n    setEvents((prev) =>\n      prev.map((event) => (event.id === id ? { ...event, ...updates } : event)),\n    );\n  }, []);\n\n  // 删除事件\n  const deleteEvent = useCallback((id: string) => {\n    setEvents((prev) => prev.filter((event) => event.id !== id));\n  }, []);\n\n  return {\n    events,\n    setEvents,\n    user,\n    setUser,\n    ast,\n    addEvent,\n    updateEvent,\n    deleteEvent,\n  };\n}\n```\n"},"source-feb361f1b9405649-s14":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:309-318`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 2.3 导出\n\n```typescript\n// packages/react/src/index.ts\nexport { Calendar } from \"./Calendar\";\nexport type { CalendarProps, CalendarRef } from \"./Calendar\";\nexport { useCalendar } from \"./hooks/useCalendar\";\nexport * from \"@calenderjs/core\";\n```\n"},"source-feb361f1b9405649-s15":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:319-320`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 3. 演示网站功能\n"},"source-feb361f1b9405649-s16":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:321-326`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 3.1 组件展示页面\n\n- **基础使用**：展示如何使用 `@calenderjs/react` 的 Calendar 组件\n- **DSL 集成**：展示如何使用 Event DSL 定义和渲染事件类型\n- **交互功能**：展示拖拽、调整大小等功能（待实现）\n"},"source-feb361f1b9405649-s17":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:327-332`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 3.2 示例代码\n\n- **可运行的示例**：所有示例都可以直接在浏览器中运行\n- **代码展示**：展示源代码和使用说明\n- **交互式编辑**：允许用户修改示例代码（可选）\n"},"source-feb361f1b9405649-s18":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:333-334`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 4. 技术实现\n"},"source-feb361f1b9405 // 设置 DSL 配置\n    calendar.eventDSL = meetingDSL;\n\n    // 设置事件数据\n    calendar.events = events;\n\n    // 监听事件\n    calendar.addEventListener(\"event-create\", handleEventCreate);\n  }, []);\n\n  return (\n    \u003cwsx-calendar\n      ref={calendarRef}\n      event-dsl={meetingDSL}\n      events={events}\n      default-view=\"week\"\n    />\n  );\n}\n```\n"},"source-feb361f1b9405649-s32":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:527-618`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### React 包装组件\n\n为了更好的 React 集成体验，可以创建 React 包装组件：\n\n```tsx\n// CalendarWrapper.tsx\nimport { useEffect, useRef, forwardRef } from \"react\";\nimport \"@calenderjs/calendar\";\nimport { Event, EventTypeAST, User } from \"@calenderjs/core\";\n\ninterface CalendarWrapperProps {\n  eventDSL: string | EventTypeAST | EventTypeAST[];\n  events: Event[];\n  user?: User;\n  defaultView?: \"month\" | \"week\" | \"day\";\n  onEventCreate?: (event: Partial\u003cEvent>) => void;\n  onEventUpdate?: (id: string, event: Partial\u003cEvent>) => void;\n  onEventDelete?: (id: string) => void;\n}\n\nexport const CalendarWrapper = forwardRef\u003cHTMLElement, CalendarWrapperProps>(\n  (\n    {\n      eventDSL,\n      events,\n      user,\n      defaultView,\n      onEventCreate,\n      onEventUpdate,\n      onEventDelete,\n    },\n    ref,\n  ) => {\n    const calendarRef = useRef\u003cHTMLElement>(null);\n\n    useEffect(() => {\n      const calendar = (ref || calendarRef).current as any;\n      if (!calendar) return;\n\n      // 设置属性\n      calendar.eventDSL = eventDSL;\n      calendar.events = events;\n      if (user) calendar.user = user;\n      if (defaultView) calendar.defaultView = defaultView;\n\n      // 监听事件\n      if (onEventCreate) {\n        calendar.addEventListener(\"event-create\", (e: CustomEvent) => {\n          onEventCreate(e.detail);\n        });\n      }\n      if (onEventUpdate) {\n        calendar.addEventListener(\"event-update\", (e: CustomEvent) => {\n          onEventUpdate(e.detail.id, e.detail.event);\n        });\n      }\n      if (onEventDelete) {\n        calendar.addEventListener(\"event-delete\", (e: CustomEvent) => {\n          onEventDelete(e.detail.id);\n        });\n      }\n\n      return () => {\n        // 清理事件监听器\n        if (onEventCreate) {\n          calendar.removeEventListener(\"event-create\", onEventCreate);\n        }\n        // ...\n      };\n    }, [\n      eventDSL,\n      events,\n      user,\n      defaultView,\n      onEventCreate,\n      onEventUpdate,\n      onEventDelete,\n    ]);\n\n    return (\n      \u003cwsx-calendar\n        ref={ref || calendarRef}\n        event-dsl={eventDSL}\n        events={events}\n        user={user}\n        default-view={defaultView}\n      />\n    );\n  },\n);\n```\n"},"source-feb361f1b9405649-s33":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:619-675`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 使用示例\n\n```tsx\n// App.tsx\nimport { useState } from \"react\";\nimport { CalendarWrapper } from \"./components/CalendarWrapper\";\nimport { Event } from \"@calenderjs/core\";\nimport { parseEventDSL } from \"@calenderjs/event-dsl\";\n\nconst meetingDSL = `\ntype: meeting\nname: 会议\n\nfields:\n  - title: string, required\n  - attendees: list of email, required\n\nvalidate:\n  attendees.count between 1 and 50\n  startTime.hour between 9 and 18\n\ndisplay:\n  color: \"#4285f4\"\n  title: \"{event.title}\"\n`;\n\nfunction App() {\n  const [events, setEvents] = useState\u003cEvent[]>([]);\n  const [user] = useState({ id: \"1\", email: \"user@example.com\", role: \"user\" });\n\n  const handleEventCreate = (event: Partial\u003cEvent>) => {\n    const newEvent: Event = {\n      id: Date.now().toString(),\n      type: \"meeting\",\n      title: event.title || \"新事件\",\n      startTime: event.startTime || new Date(),\n      endTime: event.endTime || new Date(),\n      data: event.data || {},\n    };\n    setEvents([...events, newEvent]);\n  };\n\n  return (\n    \u003cdiv>\n      \u003ch1>CalenderJS React Demo\u003c/h1>\n      \u003cCalendarWrapper\n        eventDSL={meetingDSL}\n        events={events}\n        user={user}\n        defaultView=\"week\"\n        onEventCreate={handleEventCreate}\n      />\n    \u003c/div>\n  );\n}\n```\n"},"source-feb361f1b9405649-s34":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:676-681`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 与 RFC-0003 的关系\n\n- **RFC-0003**：完整的企业级多租户服务，使用 Next.js（包含服务端功能）\n- **RFC-0004**：简单的演示网站，使用 React + Vite（纯前端），用于展示组件功能\n- 两者技术栈不同：RFC-0003 需要 Next.js 的服务端功能，RFC-0004 只需要前端展示\n"},"source-feb361f1b9405649-s35":{"body":"来源：`.spec/rfc/0004-react-demo-site.md:682-690`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 未解决问题\n\n1. **代码编辑器**：是否需要集成代码编辑器让用户在线编辑？\n2. **部署方式**：如何部署演示网站？\n3. **文档集成**：是否与文档网站集成？\n\n---\n\n_本 RFC 定义了一个 React 组件包 `@calenderjs/react` 和一个演示网站 `apps/demo-calenderjs-react`，用于为 React 开发者提供便捷的 Calendar 组件封装和使用示例。_"},"source-bccda94534da46aa":{"body":"# .spec/rfc/0010-week-view-layout-fix.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：README.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC-0010: 周视图布局修复 - Google Calendar 风格\n\n**状态**: 已实现\n**创建日期**: 2026-01-01\n**作者**: Linus Torvalds (AI Agent)\n\n## 概述\n\n修复了 WeekView 组件布局以匹配 Google Calendar 设计，解决了时间标签出现在错误位置以及模板渲染损坏的关键 DOM 结构问题。\n\n## 问题描述\n\n### 初始问题\n\n1. **时间列位置错误**: 时间标签（00:00, 01:00 等）出现在右侧而不是左侧\n2. **今日标记缺失**: 今日日期的蓝色圆形标记没有显示\n3. **DOM 结构不匹配**: 实际渲染的 DOM 与源代码模板不匹配：\n   - `week-view-time-gutter` 渲染为空（应该包含 24 个 time-label div）\n   - 只有最后一个 `week-view-day-column` 包含小时单元格\n   - 前 6 个日期列为空\n   - 小时单元格错误地包含了时间文本，而不是空白\n\n### 根本原因\n\n问题是**跨不同容器的 KEY 重复**（RFC-0037）：\n\n**问题**：在 time-gutter 和 day-columns 中使用了相同的 key 模式：\n\n```tsx\n// ❌ 错误：不同容器中的重复 key\n\u003cdiv class=\"week-view-time-gutter\">\n    {this.hours.map((hour) => (\n        \u003cdiv key={\"gutter-\" + hour}>00:00\u003c/div>  // ← key=\"gutter-0\", \"gutter-1\", 等等\n    ))}\n\u003c/div>\n\n\u003cdiv class=\"week-view-day-column\">\n    {this.hours.map((hour) => (\n        \u003cdiv key={\"cell-\" + hour}>\u003c/div>  // ← 不同的前缀，但框架看到了冲突！\n    ))}\n\u003c/div>\n```\n\n**为什么会失败**：\n\n- WSX 框架在组件作用域内通过 key 缓存 DOM 元素\n- 尽管 key 有不同的前缀（`gutter-` vs `cell-`），框架仍然在跨容器混淆元素\n- 这导致所有小时单元格只在最后一个日期列中渲染\n- 时间轴保持为空，因为框架将这些元素移动到了日期列\n\n**促成因素**：\n\n1. **Key 重复**: 主要原因 - 跨容器的重复 key 模式\n2. **`textContent` 属性**: 通过在属性中隐藏内容使调试更困难\n3. **元素命名不一致**: 从 `week-view-time-column` 改为 `week-view-time-gutter` 以提高语义清晰度\n\n## 解决方案\n\n### 1. 模板结构 - 修复 Key 重复（WeekView.wsx）\n\n**关键修复**：为不同容器中的元素使用**唯一的 key 前缀**（RFC-0037）\n\n```tsx\n// ❌ 错误：可能在容器间冲突的 key\n\u003cdiv class=\"week-view-time-gutter\">\n    {this.hours.map((hour) => (\n        \u003cdiv key={\"gutter-\" + hour} textContent={timeStr}>\u003c/div>\n        // Keys: gutter-0, gutter-1, ..., gutter-23\n    ))}\n\u003c/div>\n\n\u003cdiv class=\"week-view-day-column\">\n    {this.hours.map((hour) => (\n        \u003cdiv key={\"cell-\" + hour}>\u003c/div>\n        // Keys: cell-0, cell-1, ..., cell-23\n        // ❌ 框架将此视为与 gutter 的 key 冲突！\n    ))}\n\u003c/div>\n```\n\n```tsx\n// ✅ 正确：唯一的语义化 key 前缀\n\u003cdiv class=\"week-view-time-gutter\">\n    {this.hours.map((hour) => (\n        \u003cdiv key={\"time-gutter-label-\" + hour}>\n            {timeStr}  // 同时修复：直接 JSX 内容而不是 textContent\n        \u003c/div>\n        // Keys: time-gutter-label-0, time-gutter-label-1, ..., time-gutter-label-23\n    ))}\n\u003c/div>\n\n\u003cdiv class=\"week-view-day-column\" key={\"day-column-\" + date.getTime()}>\n    {this.hours.map((hour) => (\n        \u003cdiv key={\"time-slot-cell-\" + hour}>\u003c/div>\n        // Keys: time-slot-cell-0, time-slot-cell-1, ..., time-slot-cell-23\n        // ✅ 完全不同的前缀防止冲突\n    ))}\n\u003c/div>\n```\n\n**为什么这样修复有效**：\n\n1. **唯一前缀**: `time-gutter-label-` vs `time-slot-cell-` 完全不同\n2. **语义化命名**: Key 描述了它们的目的（label vs cell）\n3. **框架兼容性**: WSX DOM 缓存可以正确区分元素\n4. **无元素移动**: 元素保持在正确的容器中\n\n**完整的模板结构**：\n\n```tsx\n\u003cdiv class=\"week-view-body\">\n  {/* 左侧：包含 24 小时标签的时间轴 */}\n  \u003cdiv class=\"week-view-time-gutter\">\n    {this.hours.map((hour) => {\n      const hourStr = hour \u003c 10 ? `0${hour}` : `${hour}`;\n      const timeStr = `${hourStr}:00`;\n      return (\n        \u003cdiv class=\"week-view-time-label\" key={\"time-gutter-label-\" + hour}>\n          {timeStr}\n        \u003c/div>\n      );\n    })}\n  \u003c/div>\n\n  {/* 右侧：包含小时单元格的 7 个日期列 */}\n  \u003cdiv class=\"week-view-columns\">\n    {this.weekDates.map((date) => (\n      \u003cdiv class=\"week-view-day-column\" key={\"day-column-\" + date.getTime()}>\n        {/* 24 个空的小时单元格用于时间槽 */}\n        {this.hours.map((hour) => (\n          \u003cdiv class=\"week-view-hour-cell\" key={\"time-slot-cell-\" + hour}>\u003c/div>\n        ))}\n\n        {/* 绝对定位的事件 */}\n        {dayEvents.map((event) => (\n          \u003cdiv class=\"week-view-event\" key={\"time-slot-event-\" + event.id}>\n            {/* 事件内容 */}\n          \u003c/div>\n        ))}\n      \u003c/div>\n    ))}\n  \u003c/div>\n\u003c/div>\n```\n\n### 2. CSS 布局（WeekView.css）\n\n**Flexbox + Grid 混合方法**：\n\n```css\n/* 主容器：Flexbox 用于水平布局 */\n.week-view-body {\n  display: flex;\n  flex-direction: row; /* 明确的从左到右 */\n  flex: 1;\n  overflow: auto;\n  position: relative;\n}\n\n/* 左侧：时间轴（粘性定位，固定宽度） */\n.week-view-time-gutter {\n  width: 60px;\n  min-width: 60px;\n  border-right: 1px solid #dadce0;\n  background: #fff;\n  position: sticky;\n  left: 0;\n  z-index: 5;\n  order: 0; /* 明确指定为第一个 */\n  flex-shrink: 0; /* 防止压缩 */\n}\n\n.week-view-time-label {\n  height: 48px;\n  padding-top: 4px;\n  padding-right: 8px;\n  text-align: right;\n  font-size: 12px;\n  color: #70757a;\n  border-bottom: 1px solid #e8eaed;\n  box-sizing: border-box;\n}\n\n/* 右侧：日期列容器（Grid 用于 7 个等宽列） */\n.week-view-columns {\n  display: grid;\n  grid-template-columns: repeat(7, 1fr);\n  flex: 1;\n  order: 1; /* 明确指定为第二个 */\n}\n\n/* 单个日期列（相对定位用于事件） */\n.week-view-day-column {\n  border-right: 1px solid #dadce0;\n  position: relative;\n  min-width: 0;\n}\n\n/* 小时单元格（背景网格） */\n.week-view-hour-cell {\n  height: 48px;\n  border-bottom: 1px solid #e8eaed;\n  cursor: pointer;\n  transition: background-color 0.15s;\n  position: relative;\n  box-sizing: border-box;\n}\n```\n\n### 3. 今日标记修复\n\n**蓝色圆圈的 CSS**：\n\n```css\n.week-view-day-header.today .week-view-day-date {\n  background-color: #1a73e8;\n  color: #fff;\n  width: 40px;\n  height: 40px;\n  border-radius: 50%;\n  display: flex; /* 从 inline-block 改为 flex */\n  align-items: center;\n  justify-content: center;\n}\n\n/* 基础样式需要 display: inline-block 才能使圆形标记工作 */\n.week-view-day-date {\n  font-size: 26px;\n  font-weight: 400;\n  color: #3c4043;\n  line-height: 1;\n  display: inline-block; /* .today 覆盖所需 */\n}\n```\n\n## 技术细节\n\n### 布局架构\n\n**容器-Light，叶子-Shadow 模式**（RFC-0006）：\n\n- `wsx-week-view`: Shadow DOM 组件（叶子组件）\n- 封装样式防止全局 CSS 污染\n- 使用 `styles from \"./WeekView.css?inline\"` 进行 Shadow DOM 注入\n\n### 关键渲染原则\n\n1. **语义化 Key 命名**：\n   - `time-gutter-label-{hour}`: 左侧时间轴中的时间标签\n   - `day-column-{timestamp}`: 日期列的唯一日期 key\n   - `time-slot-cell-{hour}`: 时间槽的空小时单元格\n   - `time-slot-event-{eventId}`: 定位的事件覆盖层\n\n2. **Flexbox + Grid 混合**：\n   - **Flexbox** 用于主水平布局（time-gutter + columns）\n   - **Grid** 用于 7 个等宽日期列\n   - **明确的 `order` 属性**防止布局偏移\n   - **粘性定位**使时间轴在滚动时保持可见\n\n3. **内容渲染**：\n   - **直接 JSX 文本内容**而不是 `textContent` 属性\n   - 提高可靠性和 WSX 框架兼容性\n   - 在 DevTools 中可见内容，更好调试\n\n## 实现检查清单\n\n- [x] 模板结构：使用直接 JSX 文本内容而不是 `textContent`\n- [x] 模板结构：所有元素的语义化 key 命名\n- [x] CSS：Flexbox + Grid 混合布局\n- [x] CSS：flex 项的明确 `order` 属性\n- [x] CSS：粘性时间轴带 `flex-shrink: 0`\n- [x] CSS：今日标记蓝色圆圈带 flex 居中\n- [x] 构建验证：编译输出与源代码匹配\n- [x] DOM 结构：时间轴渲染 24 个时间标签\n- [x] DOM 结构：每个日期列渲染 24 个空小时单元格\n- [x] 视觉效果：时间列出现在左侧\n- [x] 视觉效果：今日日期显示蓝色圆形标记\n\n## 经验教训\n\n### 1. \"好品味\"的实践（Linus 哲学）\n\n**真正的问题**：跨容器的 Key 重复（RFC-0037）\n\n```tsx\n// ❌ 错误：短的、非唯一的前缀\n\u003cdiv key={\"gutter-\" + hour}>\u003c/div>  // 在 time-gutter 中\n\u003cdiv key={\"cell-\" + hour}>\u003c/div>    // 在 day-column 中\n// 框架将这些混淆为相同的元素！\n```\n\n```tsx\n// ✅ 正确：唯一的语义化前缀消除了\"特殊情况\"\n\u003cdiv key={\"time-gutter-label-\" + hour}>{timeStr}\u003c/div>  // 在 time-gutter 中\n\u003cdiv key={\"time-slot-cell-\" + hour}>\u003c/div>              // 在 day-column 中\n// 没有混淆，没有冲突，没有元素移动\n```\n\n**为什么这是\"好品味\"**：\n\n- **消除特殊情况**: 不需要复杂的缓存 key 生成逻辑\n- **自文档化**: Key 描述了元素是什么以及它属于哪里\n- **不需要条件判断**: 框架不需要猜测哪个容器拥有哪个元素\n- **更可预测**: 元素保持在你放置它们的地方\n\n**Linus 会赞同**因为：\n\n> \"有时你可以从不同角度看问题，重写它让特殊情况消失，变成正常情况。\"\n\n使用唯一的语义化前缀使\"特殊情况\"（key 冲突）完全消失。框架自然而然就能工作。\n\n### 2. Key 重复是沉默而致命的\n\n**问题不是浏览器缓存** - 而是 **key 冲突**（RFC-0037）。\n\n**Key 重复的症状**：\n\n- 元素在错误的容器中渲染\n- 应该有内容的容器为空\n- 内容只出现在循环的最后一次迭代中\n- 框架意外地在容器之间移动元素\n\n**如何调试**：\n\n1. 检查组件中所有的 `key=` 属性\n2. 查找不同容器中的重复 key 模式\n3. 为每个容器使用唯一的语义化前缀：\n   - `time-gutter-label-{id}` 用于时间标签\n   - `day-column-{id}` 用于日期列\n   - `time-slot-cell-{id}` 用于小时单元格\n   - `time-slot-event-{id}` 用于事件\n\n**RFC-0037 规则**：\n\n> **关键规则**：相同的 `key` 不能在不同的父容器中使用！\n\n即使使用不同的前缀，如果框架的缓存 key 生成产生冲突，元素也会移动到错误的容器。\n\n### 3. Flexbox + Grid 是正确的模式\n\n**为什么这种混合方式有效**：\n\n- **Flexbox**: 非常适合带粘性侧边栏的水平布局\n- **Grid**: 非常适合等宽列\n- **明确的 `order`**: 防止布局偏移\n- **粘性定位**: 在滚动时保持时间标签可见\n\n**不起作用的替代方法**：\n\n- ❌ 纯 CSS Grid 配合 `grid-column` - 复杂且脆弱\n- ❌ `:nth-child()` 选择器 - 在动态内容时会破坏\n- ❌ 基于 JavaScript 的定位 - 对静态布局来说过度设计\n\n## 未来考虑\n\n1. **响应式设计**: 为周视图添加移动端断点\n2. **可访问性**: 为时间槽添加 ARIA 标签\n3. **性能**: 为年视图虚拟化日期列\n4. **自定义**: 允许可配置的小时高度和时间轴宽度\n\n## 参考\n\n- RFC-0006: Container-Light, Leaf-Shadow 模式\n- RFC-0009: Calendar 组件架构\n- RFC-0037: 缓存 Key 最佳实践\n- Google Calendar UI: 参考设计\n- WSX 框架: Shadow DOM 和 JSX 渲染\n\n## 结论\n\n周视图布局现在**完全正常**并匹配 Google Calendar 设计：\n\n✅ 时间列在左侧\n✅ 今日日期显示蓝色圆形标记\n✅ DOM 结构与模板匹配\n✅ 正确的 Flexbox + Grid 混合布局\n✅ **唯一的语义化 key 前缀防止缓存冲突**（RFC-0037）\n✅ 直接 JSX 文本内容提高可靠性\n\n**关键要点**：根本原因是**跨不同容器的 KEY 重复**（RFC-0037），而不是浏览器缓存或 CSS 问题。使用唯一的语义化前缀（`time-gutter-label-` vs `time-slot-cell-`）消除了将元素移动到错误容器的框架缓存冲突。\n\n**重要教训**：在 WSX 框架中，始终为不同父容器中的元素使用**完全唯一的 key 前缀**，即使你认为框架应该处理它。像 `gutter-` 和 `cell-` 这样的短前缀仍然可能在框架的缓存 key 生成逻辑中发生冲突。"},"source-bccda94534da46aa-s1":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC-0010: 周视图布局修复 - Google Calendar 风格\n\n**状态**: 已实现\n**创建日期**: 2026-01-01\n**作者**: Linus Torvalds (AI Agent)\n"},"source-bccda94534da46aa-s2":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:7-10`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 概述\n\n修复了 WeekView 组件布局以匹配 Google Calendar 设计，解决了时间标签出现在错误位置以及模板渲染损坏的关键 DOM 结构问题。\n"},"source-bccda94534da46aa-s3":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:11-12`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 问题描述\n"},"source-bccda94534da46aa-s4":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:13-22`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 初始问题\n\n1. **时间列位置错误**: 时间标签（00:00, 01:00 等）出现在右侧而不是左侧\n2. **今日标记缺失**: 今日日期的蓝色圆形标记没有显示\n3. **DOM 结构不匹配**: 实际渲染的 DOM 与源代码模板不匹配：\n   - `week-view-time-gutter` 渲染为空（应该包含 24 个 time-label div）\n   - 只有最后一个 `week-view-day-column` 包含小时单元格\n   - 前 6 个日期列为空\n   - 小时单元格错误地包含了时间文本，而不是空白\n"},"source-bccda94534da46aa-s5":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:23-56`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 根本原因\n\n问题是**跨不同容器的 KEY 重复**（RFC-0037）：\n\n**问题**：在 time-gutter 和 day-columns 中使用了相同的 key 模式：\n\n```tsx\n// ❌ 错误：不同容器中的重复 key\n\u003cdiv class=\"week-view-time-gutter\">\n    {this.hours.map((hour) => (\n        \u003cdiv key={\"gutter-\" + hour}>00:00\u003c/div>  // ← key=\"gutter-0\", \"gutter-1\", 等等\n    ))}\n\u003c/div>\n\n\u003cdiv class=\"week-view-day-column\">\n    {this.hours.map((hour) => (\n        \u003cdiv key={\"cell-\" + hour}>\u003c/div>  // ← 不同的前缀，但框架看到了冲突！\n    ))}\n\u003c/div>\n```\n\n**为什么会失败**：\n\n- WSX 框架在组件作用域内通过 key 缓存 DOM 元素\n- 尽管 key 有不同的前缀（`gutter-` vs `cell-`），框架仍然在跨容器混淆元素\n- 这导致所有小时单元格只在最后一个日期列中渲染\n- 时间轴保持为空，因为框架将这些元素移动到了日期列\n\n**促成因素**：\n\n1. **Key 重复**: 主要原因 - 跨容器的重复 key 模式\n2. **`textContent` 属性**: 通过在属性中隐藏内容使调试更困难\n3. **元素命名不一致**: 从 `week-view-time-column` 改为 `week-view-time-gutter` 以提高语义清晰度\n"},"source-bccda94534da46aa-s6":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:57-58`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 解决方案\n"},"source-bccda94534da46aa-s7":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:59-145`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 1. 模板结构 - 修复 Key 重复（WeekView.wsx）\n\n**关键修复**：为不同容器中的元素使用**唯一的 key 前缀**（RFC-0037）\n\n```tsx\n// ❌ 错误：可能在容器间冲突的 key\n\u003cdiv class=\"week-view-time-gutter\">\n    {this.hours.map((hour) => (\n        \u003cdiv key={\"gutter-\" + hour} textContent={timeStr}>\u003c/div>\n        // Keys: gutter-0, gutter-1, ..., gutter-23\n    ))}\n\u003c/div>\n\n\u003cdiv class=\"week-view-day-column\">\n    {this.hours.map((hour) => (\n        \u003cdiv key={\"cell-\" + hour}>\u003c/div>\n        // Keys: cell-0, cell-1, ..., cell-23\n        // ❌ 框架将此视为与 gutter 的 key 冲突！\n    ))}\n\u003c/div>\n```\n\n```tsx\n// ✅ 正确：唯一的语义化 key 前缀\n\u003cdiv class=\"week-view-time-gutter\">\n    {this.hours.map((hour) => (\n        \u003cdiv key={\"time-gutter-label-\" + hour}>\n            {timeStr}  // 同时修复：直接 JSX 内容而不是 textContent\n        \u003c/div>\n        // Keys: time-gutter-label-0, time-gutter-label-1, ..., time-gutter-label-23\n    ))}\n\u003c/div>\n\n\u003cdiv class=\"week-view-day-column\" key={\"day-column-\" + date.getTime()}>\n    {this.hours.map((hour) => (\n        \u003cdiv key={\"time-slot-cell-\" + hour}>\u003c/div>\n        // Keys: time-slot-cell-0, time-slot-cell-1, ..., time-slot-cell-23\n        // ✅ 完全不同的前缀防止冲突\n    ))}\n\u003c/div>\n```\n\n**为什么这样修复有效**：\n\n1. **唯一前缀**: `time-gutter-label-` vs `time-slot-cell-` 完全不同\n2. **语义化命名**: Key 描述了它们的目的（label vs cell）\n3. **框架兼容性**: WSX DOM 缓存可以正确区分元素\n4. **无元素移动**: 元素保持在正确的容器中\n\n**完整的模板结构**：\n\n```tsx\n\u003cdiv class=\"week-view-body\">\n  {/* 左侧：包含 24 小时标签的时间轴 */}\n  \u003cdiv class=\"week-view-time-gutter\">\n    {this.hours.map((hour) => {\n      const hourStr = hour \u003c 10 ? `0${hour}` : `${hour}`;\n      const timeStr = `${hourStr}:00`;\n      return (\n        \u003cdiv class=\"week-view-time-label\" key={\"time-gutter-label-\" + hour}>\n          {timeStr}\n        \u003c/div>\n      );\n    })}\n  \u003c/div>\n\n  {/* 右侧：包含小时单元格的 7 个日期列 */}\n  \u003cdiv class=\"week-view-columns\">\n    {this.weekDates.map((date) => (\n      \u003cdiv class=\"week-view-day-column\" key={\"day-column-\" + date.getTime()}>\n        {/* 24 个空的小时单元格用于时间槽 */}\n        {this.hours.map((hour) => (\n          \u003cdiv class=\"week-view-hour-cell\" key={\"time-slot-cell-\" + hour}>\u003c/div>\n        ))}\n\n        {/* 绝对定位的事件 */}\n        {dayEvents.map((event) => (\n          \u003cdiv class=\"week-view-event\" key={\"time-slot-event-\" + event.id}>\n            {/* 事件内容 */}\n          \u003c/div>\n        ))}\n      \u003c/div>\n    ))}\n  \u003c/div>\n\u003c/div>\n```\n"},"source-bccda94534da46aa-s8":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:146-209`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 2. CSS 布局（WeekView.css）\n\n**Flexbox + Grid 混合方法**：\n\n```css\n/* 主容器：Flexbox 用于水平布局 */\n.week-view-body {\n  display: flex;\n  flex-direction: row; /* 明确的从左到右 */\n  flex: 1;\n  overflow: auto;\n  position: relative;\n}\n\n/* 左侧：时间轴（粘性定位，固定宽度） */\n.week-view-time-gutter {\n  width: 60px;\n  min-width: 60px;\n  border-right: 1px solid #dadce0;\n  background: #fff;\n  position: sticky;\n  left: 0;\n  z-index: 5;\n  order: 0; /* 明确指定为第一个 */\n  flex-shrink: 0; /* 防止压缩 */\n}\n\n.week-view-time-label {\n  height: 48px;\n  padding-top: 4px;\n  padding-right: 8px;\n  text-align: right;\n  font-size: 12px;\n  color: #70757a;\n  border-bottom: 1px solid #e8eaed;\n  box-sizing: border-box;\n}\n\n/* 右侧：日期列容器（Grid 用于 7 个等宽列） */\n.week-view-columns {\n  display: grid;\n  grid-template-columns: repeat(7, 1fr);\n  flex: 1;\n  order: 1; /* 明确指定为第二个 */\n}\n\n/* 单个日期列（相对定位用于事件） */\n.week-view-day-column {\n  border-right: 1px solid #dadce0;\n  position: relative;\n  min-width: 0;\n}\n\n/* 小时单元格（背景网格） */\n.week-view-hour-cell {\n  height: 48px;\n  border-bottom: 1px solid #e8eaed;\n  cursor: pointer;\n  transition: background-color 0.15s;\n  position: relative;\n  box-sizing: border-box;\n}\n```\n"},"source-bccda94534da46aa-s9":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:210-235`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 3. 今日标记修复\n\n**蓝色圆圈的 CSS**：\n\n```css\n.week-view-day-header.today .week-view-day-date {\n  background-color: #1a73e8;\n  color: #fff;\n  width: 40px;\n  height: 40px;\n  border-radius: 50%;\n  display: flex; /* 从 inline-block 改为 flex */\n  align-items: center;\n  justify-content: center;\n}\n\n/* 基础样式需要 display: inline-block 才能使圆形标记工作 */\n.week-view-day-date {\n  font-size: 26px;\n  font-weight: 400;\n  color: #3c4043;\n  line-height: 1;\n  display: inline-block; /* .today 覆盖所需 */\n}\n```\n"},"source-bccda94534da46aa-s10":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:236-237`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 技术细节\n"},"source-bccda94534da46aa-s11":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:238-245`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 布局架构\n\n**容器-Light，叶子-Shadow 模式**（RFC-0006）：\n\n- `wsx-week-view`: Shadow DOM 组件（叶子组件）\n- 封装样式防止全局 CSS 污染\n- 使用 `styles from \"./WeekView.css?inline\"` 进行 Shadow DOM 注入\n"},"source-bccda94534da46aa-s12":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:246-264`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 关键渲染原则\n\n1. **语义化 Key 命名**：\n   - `time-gutter-label-{hour}`: 左侧时间轴中的时间标签\n   - `day-column-{timestamp}`: 日期列的唯一日期 key\n   - `time-slot-cell-{hour}`: 时间槽的空小时单元格\n   - `time-slot-event-{eventId}`: 定位的事件覆盖层\n\n2. **Flexbox + Grid 混合**：\n   - **Flexbox** 用于主水平布局（time-gutter + columns）\n   - **Grid** 用于 7 个等宽日期列\n   - **明确的 `order` 属性**防止布局偏移\n   - **粘性定位**使时间轴在滚动时保持可见\n\n3. **内容渲染**：\n   - **直接 JSX 文本内容**而不是 `textContent` 属性\n   - 提高可靠性和 WSX 框架兼容性\n   - 在 DevTools 中可见内容，更好调试\n"},"source-bccda94534da46aa-s13":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:265-278`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 实现检查清单\n\n- [x] 模板结构：使用直接 JSX 文本内容而不是 `textContent`\n- [x] 模板结构：所有元素的语义化 key 命名\n- [x] CSS：Flexbox + Grid 混合布局\n- [x] CSS：flex 项的明确 `order` 属性\n- [x] CSS：粘性时间轴带 `flex-shrink: 0`\n- [x] CSS：今日标记蓝色圆圈带 flex 居中\n- [x] 构建验证：编译输出与源代码匹配\n- [x] DOM 结构：时间轴渲染 24 个时间标签\n- [x] DOM 结构：每个日期列渲染 24 个空小时单元格\n- [x] 视觉效果：时间列出现在左侧\n- [x] 视觉效果：今日日期显示蓝色圆形标记\n"},"source-bccda94534da46aa-s14":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:279-280`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 经验教训\n"},"source-bccda94534da46aa-s15":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:281-311`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 1. \"好品味\"的实践（Linus 哲学）\n\n**真正的问题**：跨容器的 Key 重复（RFC-0037）\n\n```tsx\n// ❌ 错误：短的、非唯一的前缀\n\u003cdiv key={\"gutter-\" + hour}>\u003c/div>  // 在 time-gutter 中\n\u003cdiv key={\"cell-\" + hour}>\u003c/div>    // 在 day-column 中\n// 框架将这些混淆为相同的元素！\n```\n\n```tsx\n// ✅ 正确：唯一的语义化前缀消除了\"特殊情况\"\n\u003cdiv key={\"time-gutter-label-\" + hour}>{timeStr}\u003c/div>  // 在 time-gutter 中\n\u003cdiv key={\"time-slot-cell-\" + hour}>\u003c/div>              // 在 day-column 中\n// 没有混淆，没有冲突，没有元素移动\n```\n\n**为什么这是\"好品味\"**：\n\n- **消除特殊情况**: 不需要复杂的缓存 key 生成逻辑\n- **自文档化**: Key 描述了元素是什么以及它属于哪里\n- **不需要条件判断**: 框架不需要猜测哪个容器拥有哪个元素\n- **更可预测**: 元素保持在你放置它们的地方\n\n**Linus 会赞同**因为：\n\n> \"有时你可以从不同角度看问题，重写它让特殊情况消失，变成正常情况。\"\n\n使用唯一的语义化前缀使\"特殊情况\"（key 冲突）完全消失。框架自然而然就能工作。\n"},"source-bccda94534da46aa-s16":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:312-338`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 2. Key 重复是沉默而致命的\n\n**问题不是浏览器缓存** - 而是 **key 冲突**（RFC-0037）。\n\n**Key 重复的症状**：\n\n- 元素在错误的容器中渲染\n- 应该有内容的容器为空\n- 内容只出现在循环的最后一次迭代中\n- 框架意外地在容器之间移动元素\n\n**如何调试**：\n\n1. 检查组件中所有的 `key=` 属性\n2. 查找不同容器中的重复 key 模式\n3. 为每个容器使用唯一的语义化前缀：\n   - `time-gutter-label-{id}` 用于时间标签\n   - `day-column-{id}` 用于日期列\n   - `time-slot-cell-{id}` 用于小时单元格\n   - `time-slot-event-{id}` 用于事件\n\n**RFC-0037 规则**：\n\n> **关键规则**：相同的 `key` 不能在不同的父容器中使用！\n\n即使使用不同的前缀，如果框架的缓存 key 生成产生冲突，元素也会移动到错误的容器。\n"},"source-bccda94534da46aa-s17":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:339-353`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 3. Flexbox + Grid 是正确的模式\n\n**为什么这种混合方式有效**：\n\n- **Flexbox**: 非常适合带粘性侧边栏的水平布局\n- **Grid**: 非常适合等宽列\n- **明确的 `order`**: 防止布局偏移\n- **粘性定位**: 在滚动时保持时间标签可见\n\n**不起作用的替代方法**：\n\n- ❌ 纯 CSS Grid 配合 `grid-column` - 复杂且脆弱\n- ❌ `:nth-child()` 选择器 - 在动态内容时会破坏\n- ❌ 基于 JavaScript 的定位 - 对静态布局来说过度设计\n"},"source-bccda94534da46aa-s18":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:354-360`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 未来考虑\n\n1. **响应式设计**: 为周视图添加移动端断点\n2. **可访问性**: 为时间槽添加 ARIA 标签\n3. **性能**: 为年视图虚拟化日期列\n4. **自定义**: 允许可配置的小时高度和时间轴宽度\n"},"source-bccda94534da46aa-s19":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:361-368`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 参考\n\n- RFC-0006: Container-Light, Leaf-Shadow 模式\n- RFC-0009: Calendar 组件架构\n- RFC-0037: 缓存 Key 最佳实践\n- Google Calendar UI: 参考设计\n- WSX 框架: Shadow DOM 和 JSX 渲染\n"},"source-bccda94534da46aa-s20":{"body":"来源：`.spec/rfc/0010-week-view-layout-fix.md:369-382`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 结论\n\n周视图布局现在**完全正常**并匹配 Google Calendar 设计：\n\n✅ 时间列在左侧\n✅ 今日日期显示蓝色圆形标记\n✅ DOM 结构与模板匹配\n✅ 正确的 Flexbox + Grid 混合布局\n✅ **唯一的语义化 key 前缀防止缓存冲突**（RFC-0037）\n✅ 直接 JSX 文本内容提高可靠性\n\n**关键要点**：根本原因是**跨不同容器的 KEY 重复**（RFC-0037），而不是浏览器缓存或 CSS 问题。使用唯一的语义化前缀（`time-gutter-label-` vs `time-slot-cell-`）消除了将元素移动到错误容器的框架缓存冲突。\n\n**重要教训**：在 WSX 框架中，始终为不同父容器中的元素使用**完全唯一的 key 前缀**，即使你认为框架应该处理它。像 `gutter-` 和 `cell-` 这样的短前缀仍然可能在框架的缓存 key 生成逻辑中发生冲突。"},"folder:reference:.spec/rfc/completed":{"body":"# .spec/rfc/completed\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-92b2d89500b2b237":{"body":"# .spec/rfc/completed/0013-fix-today-handling.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：README.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC 0013: 修复月视图中的\"今天\"高亮显示问题\n\n**状态**: Completed\n\n## 摘要\n\n本 RFC 提议修复日历组件月视图中的一个视觉错误，即当浏览非当前月份时，\"今天\"的高亮样式被错误地应用到了上个月或下个月的日期上（例如：今天是 11 月 30 日，在浏览 12 月时，11 月 30 日的灰色日期块被显示为\"今天\"）。\n\n## 动机\n\n当查看非当前月份（例如：今天是 11 月 30 日，查看 12 月视图）时，属于上个月的灰色日期 \"30\"（代表 11 月 30 日）被高亮显示为 \"今天\"。这会造成困惑，因为 \"今天\" 的样式（蓝色背景/文本）主要用于强调当前上下文中的重要日期。当前的实现覆盖了 \"非本月\"（other-month）的灰色样式，使其看起来像一个普通的活动日期。\n\n## 设计\n\n修复涉及修改 `MonthView.wsx` 中的渲染逻辑。\n\n### 当前逻辑\n\n```typescript\nconst isToday = isSameDay(normalizedDate, this._today);\n// ...\nclass={`month-view-cell ... ${isToday ? \"today\" : \"\"}`}\n```\n\n### 建议逻辑\n\n我们将限制 `today` 类的应用，仅当该日期**同时**属于当前显示的月份时才应用。\n\n```typescript\nconst isToday = isSameDay(normalizedDate, this._today);\n// ...\n// 仅当是今天且属于当前月份时才应用 'today' 类\nconst shouldHighlightToday = isToday && isCurrentMonth;\nclass={`month-view-cell ... ${shouldHighlightToday ? \"today\" : \"\"}`}\n```\n\n或者，我们可以保留 `today` 类，但通过修改 CSS 确保 `other-month` 的样式优先级更高。但在逻辑层面上移除 \"今天\" 的状态对于 \"聚焦当前月\" 的视图来说是更清晰的 UX 选择。\n\n## 附加变更：移除\"选中日期\" (Selected Date) 状态\n\n用户指出不需要\"选中日期\"的高亮状态，且该状态的来源不明确。我们将从所有视图中完全移除\"选中日期\"的视觉样式。\n\n### 变更内容\n\n1.  **MonthView**: 移除单元格的 `selected` 类。\n2.  **WeekView**: 移除日期头部的 `selected` 类。\n3.  **DayView**: 确保没有 `selected` 样式被应用。\n4.  **Calendar**: 仍然保留 `currentDate` 用于控制视图显示的基准日期，但不再通过 UI 强调显示它。\n\n## 实施计划\n\n1.  **复现**: 创建一个单元测试 `packages/calendar/src/views/__tests__/Reproduction.test.ts`，模拟当前日期并渲染不同的月份视图，断言 \"今天\" 的单元格（位于非本月区域）**不**具有 `today` 类。  \n    **✅ 已完成** — 测试存在且通过；并增加正向用例：当月内「今天」具有 `today` 类。测试覆盖：2 用例（other-month 无 today / 当月 today 高亮）。\n2.  **修复**: 更新 `packages/calendar/src/views/MonthView.wsx`。  \n    **✅ 已完成** — 使用 `isToday && isCurrentMonth ? \"today\" : \"\"`。\n3.  **移除选中状态**: 修改 `MonthView`, `WeekView`, `DayView` 移除 `isSelected` 判断及相关 CSS 类。  \n    **✅ 已完成** — 三个视图均未在 DOM 上应用 `selected` 类（可选后续：删除未使用的 `isSelected` 变量）。\n4.  **验证**:\n    - 运行复现单元测试，确认修复前失败，修复后通过。 **✅**\n    - 运行现有测试。 **✅**\n    - **视觉验证**: 启动日历演示并在浏览器中验证行为。 **见下方 Demo 步骤**\n\n### Demo 视觉验证步骤\n\n1.  **启动演示**: 在项目根目录执行 `pnpm run build:calendar` 后执行 `pnpm run dev:react`，浏览器打开 **http://localhost:3000/**。\n2.  **月视图**: 确认右侧为日历，视图为「月」。\n3.  **切到非当前月**: 点击日历头部的「下月」或「上月」，进入非当前月份（例如今天 2 月，则切到 3 月或 1 月）。\n4.  **检查「今天」**: 在月历中会看到上/下月的灰色小格（other-month）。若某格数字与「今天」的日期相同（例如今天 22 号，则找灰色格里的 22）：\n    - **通过**: 该灰色格**没有**蓝色/高亮「今天」样式，仅灰显。\n    - **失败**: 该灰色格被高亮成「今天」样式。\n5.  **可选**: 切回当前月，确认当月内的「今天」仍然有「今天」高亮。\n\n## 替代方案\n\n- **仅 CSS 修复**: 我们可以使用 CSS 优先级使 `.other-month.today` 看起来不同。然而，在逻辑中简单地隐藏 \"今天\" 状态更健壮，并能防止意外的样式冲突。"},"source-92b2d89500b2b237-s1":{"body":"来源：`.spec/rfc/completed/0013-fix-today-handling.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC 0013: 修复月视图中的\"今天\"高亮显示问题\n\n**状态**: Completed\n"},"source-92b2d89500b2b237-s2":{"body":"来源：`.spec/rfc/completed/0013-fix-today-handling.md:5-8`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 摘要\n\n本 RFC 提议修复日历组件月视图中的一个视觉错误，即当浏览非当前月份时，\"今天\"的高亮样式被错误地应用到了上个月或下个月的日期上（例如：今天是 11 月 30 日，在浏览 12 月时，11 月 30 日的灰色日期块被显示为\"今天\"）。\n"},"source-92b2d89500b2b237-s3":{"body":"来源：`.spec/rfc/completed/0013-fix-today-handling.md:9-12`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 动机\n\n当查看非当前月份（例如：今天是 11 月 30 日，查看 12 月视图）时，属于上个月的灰色日期 \"30\"（代表 11 月 30 日）被高亮显示为 \"今天\"。这会造成困惑，因为 \"今天\" 的样式（蓝色背景/文本）主要用于强调当前上下文中的重要日期。当前的实现覆盖了 \"非本月\"（other-month）的灰色样式，使其看起来像一个普通的活动日期。\n"},"source-92b2d89500b2b237-s4":{"body":"来源：`.spec/rfc/completed/0013-fix-today-handling.md:13-16`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 设计\n\n修复涉及修改 `MonthView.wsx` 中的渲染逻辑。\n"},"source-92b2d89500b2b237-s5":{"body":"来源：`.spec/rfc/completed/0013-fix-today-handling.md:17-24`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 当前逻辑\n\n```typescript\nconst isToday = isSameDay(normalizedDate, this._today);\n// ...\nclass={`month-view-cell ... ${isT
