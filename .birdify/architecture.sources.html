te`）\n"},"source-1656dbc06ea608f2-s31":{"body":"来源：`.spec/rfc/0008-calendar-component-api-redesign.md:510-522`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 阶段 4: 测试和文档（3天）\n\n- [ ] 4.1 更新测试用例\n  - [ ] 测试属性（attributes）设置\n  - [ ] 测试属性（properties）设置\n  - [ ] 测试事件绑定和触发\n  - [ ] 测试状态变化和重新渲染\n\n- [ ] 4.2 更新文档\n  - [ ] API 文档\n  - [ ] 使用示例\n  - [ ] 迁移指南（从旧 API 迁移到新 API）\n"},"source-1656dbc06ea608f2-s32":{"body":"来源：`.spec/rfc/0008-calendar-component-api-redesign.md:523-524`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 迁移指南\n"},"source-1656dbc06ea608f2-s33":{"body":"来源：`.spec/rfc/0008-calendar-component-api-redesign.md:525-526`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 从旧 API 迁移到新 API\n"},"source-1656dbc06ea608f2-s34":{"body":"来源：`.spec/rfc/0008-calendar-component-api-redesign.md:527-537`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 旧代码\n\n```typescript\nconst calendar = document.createElement(\"wsx-calendar\");\ncalendar.eventDSL = dslString;\ncalendar.events = events;\ncalendar.user = user;\ncalendar.defaultView = \"month\";\ncalendar.currentDate = new Date(\"2024-12-30\");\n```\n"},"source-1656dbc06ea608f2-s35":{"body":"来源：`.spec/rfc/0008-calendar-component-api-redesign.md:538-548`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 新代码\n\n```typescript\nconst calendar = document.createElement(\"wsx-calendar\");\ncalendar.setAttribute(\"view\", \"month\");\ncalendar.setAttribute(\"date\", \"2024-12-30\");\n// 注意：不再有 DSL property，组件只处理数据模型\ncalendar.events = events;\ncalendar.user = user;\n```\n"},"source-1656dbc06ea608f2-s36":{"body":"来源：`.spec/rfc/0008-calendar-component-api-redesign.md:549-558`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 总结\n\n重新设计后的 Calendar 组件将：\n\n1. ✅ **符合 Web Component 标准**：使用 `observedAttributes`、getters/setters、生命周期方法\n2. ✅ **清晰的 API 设计**：区分 attributes、properties、内部状态\n3. ✅ **统一的事件绑定**：使用 WSX 声明式事件绑定\n4. ✅ **更好的可维护性**：组件结构清晰，代码不重复\n5. ✅ **更好的可测试性**：API 清晰，易于测试\n"},"source-1656dbc06ea608f2-s37":{"body":"来源：`.spec/rfc/0008-calendar-component-api-redesign.md:559-564`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 参考\n\n- [Web Components 标准](https://developer.mozilla.org/en-US/docs/Web/Web_Components)\n- [Custom Elements 规范](https://html.spec.whatwg.org/multipage/custom-elements.html)\n- [WSX 框架文档](https://github.com/wsxjs/wsx)\n- RFC-0001: Event Calendar Component with Event DSL"},"source-b03f4f419b7ae678":{"body":"# .spec/rfc/0011-event-data-model-integration.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：docs/llm-guide.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC-0011: Event 数据模型与 Event DSL 集成\n\n**状态**: Draft  \n**创建日期**: 2026-01-01  \n**最后更新**: 2026-01-01  \n**作者**: CalenderJS Team  \n**关联 RFC**: RFC-0001, RFC-0002, RFC-0009, RFC-0012\n\n## 摘要\n\n**本 RFC 的目的是澄清 Event Data Model 与 Event DSL 的架构关系，并设计插件/扩展机制。**\n\n### 核心架构原则\n\n1. **Event Data Model 是 SSOT（单一数据源）**\n   - **定义位置**：`packages/event-model/src/Event.ts`\n   - **接口结构**：`Event { id, type, title, startTime, endTime, color?, icon?, extra?, metadata? }`\n   - **JSON Schema 位置**：`packages/event-model/src/validator.ts` 中的 `EVENT_BASE_SCHEMA`\n   - **验证器位置**：`packages/event-model/src/validator.ts` 中的 `EventValidator`\n\n2. **Event DSL 是生成工具（不是定义工具）**\n   - **作用**：从 DSL 定义生成符合 Event Data Model 的 Event 数据\n   - **不生成 JSON Schema**：Event Data Model 的 JSON Schema 已经在 `@calenderjs/event-model` 中定义\n   - **生成 Event 对象**：使用 `EventDataGenerator` 从 DSL 生成 Event 数据\n   - **DSL 类型**：`EventDSL`、`EventTypeDefinition`、`EventDSLCompiler`、`EventDSLRuntime`\n   - **命名一致性**：所有 DSL 相关类型和类都使用 \"Event\" 前缀，而不是 \"Appointment\"\n\n3. **Appointment 和 Holiday 都是 Event 的扩展**\n   - 它们都是 Event，只是 `type` 不同\n   - 区别在于详情卡片的数据不同（`extra` 字段内容不同）\n\n4. **插件/扩展机制支持**\n   - Event Data Model 应该支持插件/扩展机制（类似 Editor.js）\n   - Calendar 组件应该允许注册自定义的详情卡片渲染器\n   - 插件系统应该根据 `Event.type` 选择对应的渲染器\n\n5. **数据流向**\n\n```mermaid\n%%{init: {'theme':'base', 'themeVariables': {'primaryColor':'#1e88e5', 'primaryTextColor':'#fff', 'primaryBorderColor':'#1565c0', 'lineColor':'#64b5f6', 'secondaryColor':'#ff9800', 'tertiaryColor':'#4caf50', 'background':'#121212', 'mainBkgColor':'#1e1e1e', 'secondBkgColor':'#2d2d2d', 'textColor':'#e0e0e0'}}}%%\ngraph LR\n    A[DSL 定义] --> B[EventDataGenerator]\n    B --> C[Event 对象\u003cbr/>符合 Event Data Model]\n    C --> D[EventValidator\u003cbr/>使用 EVENT_BASE_SCHEMA]\n    D --> E{验证通过?}\n    E -->|是| F[Calendar 组件]\n    E -->|否| G[验证错误]\n    F --> H[插件系统]\n    H --> I[详情卡片渲染]\n```\n\n本 RFC 确保架构关系清晰，DSL 能够正确生成符合 Event Data Model 的数据，并支持插件/扩展机制。\n\n### 架构关系图\n\n```mermaid\n%%{init: {'theme':'base', 'themeVariables': {'primaryColor':'#1e88e5', 'primaryTextColor':'#fff', 'primaryBorderColor':'#1565c0', 'lineColor':'#64b5f6', 'secondaryColor':'#ff9800', 'tertiaryColor':'#4caf50', 'background':'#121212', 'mainBkgColor':'#1e1e1e', 'secondBkgColor':'#2d2d2d', 'textColor':'#e0e0e0', 'clusterBkg':'#2d2d2d', 'clusterBorder':'#64b5f6'}}}%%\ngraph TB\n    subgraph \"Event Data Model (SSOT)\"\n        A[Event 接口\u003cbr/>Event.ts]\n        B[EVENT_BASE_SCHEMA\u003cbr/>validator.ts]\n        C[EventValidator\u003cbr/>validator.ts]\n    end\n\n    subgraph \"Event DSL (Generator)\"\n        D[DSL 定义]\n        E[EventDataGenerator]\n    end\n\n    subgraph \"Calendar Component\"\n        F[Calendar 组件]\n        G[插件系统]\n    end\n\n    D --> E\n    E --> A\n    A --> B\n    B --> C\n    A --> F\n    F --> G\n    G --> H[详情卡片渲染]\n\n    style A fill:#1e88e5,stroke:#1565c0,color:#fff\n    style B fill:#1e88e5,stroke:#1565c0,color:#fff\n    style C fill:#1e88e5,stroke:#1565c0,color:#fff\n    style E fill:#ff9800,stroke:#f57c00,color:#fff\n    style F fill:#4caf50,stroke:#388e3c,color:#fff\n    style G fill:#4caf50,stroke:#388e3c,color:#fff\n```\n\n## 动机\n\n当前状态：\n\n- ✅ UI 组件（Calendar、WeekView、DayView、MonthView）已实现，可以显示日历网格\n- ✅ Event 数据模型包已创建（`@calenderjs/event-model`）作为 SSOT\n- ✅ Event 核心接口已定义（`packages/event-model/src/Event.ts`）\n- ✅ Event DSL 编译器已实现（验证器、渲染器）\n- ✅ Event 数据生成器已实现（`packages/event-dsl/src/generators/EventDataGenerator.ts`）\n- ✅ 所有包已更新依赖 `@calenderjs/event-model`\n- ✅ JSON Schema 验证功能已实现（`packages/event-model/src/validators/EventValidator.ts`，使用 ajv）\n- ❌ Event 数据模型与 Event DSL 的集成尚未完成\n- ❌ 日历组件中显示事件的功能尚未实现\n\n需要解决的问题：\n\n1. 如何从 Event DSL 定义生成符合 Event Data Model 的 Event 数据？\n2. 如何确保生成的 Event 数据符合 Event Data Model 的结构？\n3. 如何在日历组件中渲染事件？\n4. 如何验证事件数据是否符合 Event Data Model？\n\n## 目标\n\n1. **明确架构关系**\n   - Event Data Model 是 SSOT，定义了 Event 接口结构\n   - DSL 是生成工具，用于生成符合 Event Data Model 的数据\n   - DSL 生成 Event 数据，而不是定义数据模型\n\n2. **实现 Event 数据生成工具**\n   - 从 DSL 定义生成符合 Event Data Model 的 Event 对象\n   - 提供 Event 数据生成器（`EventDataGenerator`）\n   - 提供 Event 数据验证功能（基于 Event Data Model）\n\n3. **实现日历组件事件显示**\n   - 在 WeekView 中显示事件\n   - 在 DayView 中显示事件\n   - 在 MonthView 中显示事件\n   - 支持事件样式和交互\n\n## 范围\n\n### In-Scope\n\n- Event 数据模型与 Event DSL 的集成规范\n- Event 数据生成工具（从 DSL 生成 Event 对象）\n- 日历组件中事件渲染功能\n- 事件数据验证功能（基于 Event Data Model）\n- 事件样式和交互（基础功能）\n\n### Out-of-Scope\n\n- 事件编辑功能（后续 RFC）\n- 事件拖拽功能（后续 RFC）\n- 事件创建表单（后续 RFC）\n- 事件详情弹窗（后续 RFC）\n- **Calendar 插件机制实现**（见 RFC-0012）\n\n### 数据契约（Data Contract）\n\n**数据契约定义**：\n\n数据契约是 Event Data Model 的正式规范，定义了 Calendar 组件与 Event 数据之间的接口约定。\n\n**数据契约内容**：\n\n```typescript\n// 数据契约：Event 接口\ninterface Event {\n  // Calendar 必需字段\n  id: string;\n  type: string;\n  title: string;\n  startTime: Date;\n  endTime: Date;\n\n  // Calendar 显示属性（可选）\n  color?: string;\n  icon?: string;\n\n  // 扩展属性（可选，用于详情卡片）\n  extra?: Record\u003cstring, any>;\n\n  // 元数据（可选）\n  metadata?: EventMetadata;\n}\n```\n\n**数据契约的作用**：\n\n- 定义 Calendar 组件消费 Event 数据的标准接口\n- 确保所有 Event 数据都符合统一的结构\n- 支持插件系统根据 `Event.type` 渲染不同的详情卡片\n- 提供运行时验证（通过 JSON Schema）\n\n**数据契约的位置**：\n\n- Event 接口：`packages/event-model/src/Event.ts`\n- JSON Schema：`packages/event-model/src/validator.ts` 中的 `EVENT_BASE_SCHEMA`\n- 验证器：`packages/event-model/src/validator.ts` 中的 `EventValidator`\n\n### 数据契约关系图\n\n```mermaid\n%%{init: {'theme':'base', 'themeVariables': {'primaryColor':'#1e88e5', 'primaryTextColor':'#fff', 'primaryBorderColor':'#1565c0', 'lineColor':'#64b5f6', 'secondaryColor':'#ff9800', 'tertiaryColor':'#4caf50', 'background':'#121212', 'mainBkgColor':'#1e1e1e', 'secondBkgColor':'#2d2d2d', 'textColor':'#e0e0e0', 'clusterBkg':'#2d2d2d', 'clusterBorder':'#64b5f6'}}}%%\ngraph TB\n    subgraph \"数据契约 (Data Contract)\"\n        A[Event 接口\u003cbr/>TypeScript Interface]\n        B[EVENT_BASE_SCHEMA\u003cbr/>JSON Schema]\n        C[EventValidator\u003cbr/>Runtime Validator]\n    end\n\n    subgraph \"数据生成\"\n        D[Event DSL]\n        E[EventDataGenerator]\n    end\n\n    subgraph \"数据消费\"\n        F[Calendar 组件]\n        G[插件系统]\n    end\n\n    A -.定义.-> B\n    B -.验证.-> C\n    D --> E\n    E -->|生成符合| A\n    C -->|验证| A\n    A -->|消费| F\n    F -->|使用| G\n\n    style A fill:#1e88e5,stroke:#1565c0,color:#fff\n    style B fill:#1e88e5,stroke:#1565c0,color:#fff\n    style C fill:#1e88e5,stroke:#1565c0,color:#fff\n    style E fill:#ff9800,stroke:#f57c00,color:#fff\n    style F fill:#4caf50,stroke:#388e3c,color:#fff\n    style G fill:#4caf50,stroke:#388e3c,color:#fff\n```\n\n### Calendar 插件机制（设计说明）\n\n**重要设计考虑**：\n\nCalendar 组件将提供插件机制（见 RFC-0012），允许为不同类型的事件注册自定义的详情卡片渲染器。\n\n**设计原则**（参考 Editor.js 插件架构）：\n\n1. **Calendar 组件提供插件注册系统**\n   - Calendar 组件负责插件注册和管理\n   - 插件系统应该类似于 Editor.js 的插件架构\n\n2. **插件接口设计**\n   - 插件应该能够根据 `Event.type` 注册不同的渲染器\n   - 插件应该能够访问 `Event.extra` 字段来渲染详情卡片\n   - 插件应该能够访问数据契约（Event 接口）\n\n3. **扩展性**\n   - 插件应该能够扩展 Calendar 功能，而不修改核心代码\n   - 插件系统应该易于使用和扩展\n\n**详细设计**：见 RFC-0012\n\n## 核心交付物\n\n1. **Event 数据模型规范文档**\n   - Event 接口与 DSL 映射关系\n   - Event.data 字段规范\n   - JSON Schema 生成规则\n\n2. **Event 数据生成工具**\n   - `packages/event-dsl/src/generators/event-data-generator.ts`\n   - 从 DSL 生成 Event JSON 示例\n   - 从 DSL 生成 Event TypeScript 类型\n\n3. **日历组件事件渲染**\n   - WeekView 事件渲染\n   - DayView 事件渲染\n   - MonthView 事件渲染\n   - 事件样式支持\n\n4. **事件数据验证**\n   - Event 数据验证工具\n   - 与 DSL 验证器集成\n\n## 成功标准\n\n1. ✅ 可以从 Event DSL 定义生成符合 Event 接口的 JSON 数据模型\n2. ✅ Event.data 字段符合 DSL 定义的字段结构\n3. ✅ 日历组件可以正确显示事件（WeekView、DayView、MonthView）\n4. ✅ 事件数据可以通过 DSL 验证器验证\n5. ✅ 所有代码达到 100% 测试覆盖率\n6. ✅ 所有测试通过\n\n## 详细设计\n\n### 0. Event Data Model 定义位置（SSOT）\n\n**`@calenderjs/event-model` 包的两个核心职责：**\n\n#### 职责 1: 定义数据模型和 JSON Schema（数据契约）\n\n**数据契约（Data Contract）定义**：\n\n数据契约是 Event Data Model 的正式规范，定义了 Calendar 组件与 Event 数据之间的接口约定。\n\n1. **Event 接口定义（数据契约的核心）**\n   - **文件**：`packages/event-model/src/Event.ts`\n   - **内容**：`Event` 和 `EventMetadata` 接口定义\n   - **导出**：`export * from \"./Event\"`\n   - **作用**：定义 Calendar 组件消费 Event 数据的接口契约\n\n2. **Event JSON Schema（数据契约的验证规范）**\n   - **文件**：`packages/event-model/src/validator.ts`\n   - **内容**：`EVENT_BASE_SCHEMA` 常量，定义 Event 接口的 JSON Schema\n   - **导出**：`export * from \"./validator\"`（包含 `EVENT_BASE_SCHEMA`）\n   - **作用**：提供运行时验证，确保数据符合数据契约\n\n3. **JSON Schema 类型定义**\n   - **文件**：`packages/event-model/src/types.ts`\n   - **内容**：`JSONSchema` 接口定义\n   - **导出**：`export * from \"./types\"`\n\n**数据契约内容**：\n\n```typescript\n// 数据契约：Event 接口\ninterface Event {\n  // Calendar 必需字段\n  id: string;\n  type: string;\n  title: string;\n  startTime: Date;\n  endTime: Date;\n\n  // Calendar 显示属性（可选）\n  color?: string;\n  icon?: string;\n\n  // 扩展属性（可选，用于详情卡片）\n  extra?: Record\u003cstring, any>;\n\n  // 元数据（可选）\n  metadata?: EventMetadata;\n}\n```\n\n**数据契约的作用**：\n\n- 定义 Calendar 组件消费 Event 数据的标准接口\n- 确保所有 Event 数据都符合统一的结构\n- 支持插件系统根据 `Event.type` 渲染不同的详情卡片\n\n#### 职责 2: 使用 JSON Schema 验证数据\n\n1. **Event 验证器**\n   - **文件**：`packages/event-model/src/validator.ts`\n   - **内容**：`EventValidator` 类，使用 `EVENT_BASE_SCHEMA` 验证 Event 数据\n   - **方法**：\n     - `validateBase(event)` - 验证 Event 对象是否符合基础 Event Schema\n     - `validateData(event, dataSchema)` - 验证 Event.data 是否符合指定的 JSON Schema\n     - `validate(event, dataSchema?)` - 验证完整的 Event 对象\n     - `validateTimeLogic(event)` - 验证时间逻辑（startTime \u003c endTime）\n   - **导出**：`export * from \"./validator\"`\n\n**重要架构原则**：\n\n- Event Data Model 的 JSON Schema（`EVENT_BASE_SCHEMA`）在 `@calenderjs/event-model` 中定义\n- DSL **不生成** JSON Schema，只生成符合 Event Data Model 的 Event 数据\n- DSL 使用 Event Data Model 的 JSON Schema（`EVENT_BASE_SCHEMA`）进行验证\n\n### 1. Event 数据模型规范\n\n#### 1.1 Event 接口结构\n\n```typescript\n// packages/event-model/src/Event.ts\nexport interface Event {\n  /** 唯一标识符 */\n  id: string;\n  /** 事件类型 (如 meeting, task, reminder) */\n  type: string;\n  /** 事件标题（Calendar 显示用） */\n  title: string;\n  /** 开始时间（必需 - Event 必须有时间） */\n  startTime: Date;\n  /** 结束时间（必需 - Event 必须有时间） */\n  endTime: Date;\n  /** Calendar 显示颜色（可选） */\n  color?: string;\n  /** Calendar 显示图标（可选） */\n  icon?: string;\n  /** 扩展属性（可选，用于详情卡片显示） */\n  extra?: Record\u003cstring, any>;\n  /** 事件元数据（可选） */\n  metadata?: EventMetadata;\n}\n```\n\n#### 1.2 Event 数据模型设计原则\n\n**核心设计理念**：\n\n1. **Calendar 只关心 Event**\n   - Calendar 组件处理的是 Event（时间敏感的活动）\n   - Event 必须有 `startTime` 和 `endTime`\n\n2. **Appointment 和 Holiday 都是 Event 的扩展**\n   - Appointment 和 Holiday 都是 Event，只是 `type` 不同\n   - 它们都有 `startTime` 和 `endTime`，所以是 Event\n   - 区别在于：在 Calendar 中显示时，它们有不同的详情卡片\n\n3. **Event 包含 Calendar 需要的数据**\n   - Event 数据模型包含 Calendar 显示所需的核心字段\n   - `id`, `type`, `title`, `startTime`, `endTime` - Calendar 必需\n   - `color`, `icon` - Calendar 显示属性（可选）\n\n4. **扩展属性用于详情卡片**\n   - Event 的 `extra` 字段存储详情卡片数据\n   - 不同类型的事件（meeting, appointment, holiday）有不同的 `extra` 内容\n   - 在 Calendar 中显示时，根据 `type` 显示不同的详情卡片\n   - 由 Event DSL 定义，用于不同类型的事件\n\n5. **插件/扩展机制支持**\n   - Event Data Model 应该支持插件/扩展机制（类似 Editor.js）\n   - Calendar 组件应该允许注册自定义的详情卡片渲染器\n   - 插件系统应该根据 `Event.type` 选择对应的渲染器\n   - 插件应该能够访问 `Event.extra` 字段来渲染详情卡片\n\n**Event 接口结构**：\n\n```typescript\ninterface Event {\n  // Calendar 必需字段\n  id: string;\n  type: string;\n  title: string;\n  startTime: Date; // 必需 - Event 必须有时间\n  endTime: Date; // 必需 - Event 必须有时间\n\n  // Calendar 显示属性（可选）\n  color?: string;\n  icon?: string;\n\n  // 扩展属性（可选，用于详情卡片）\n  extra?: Record\u003cstring, any>;\n\n  // 元数据（可选）\n  metadata?: EventMetadata;\n}\n```\n\n**`Event.extra` 字段示例**：\n\n```typescript\n// meeting 类型的 Event\nconst meetingEvent: Event = {\n  id: \"event-1\",\n  type: \"meeting\",\n  title: \"团队会议\",\n  startTime: new Date(\"2025-01-15T10:00:00\"),\n  endTime: new Date(\"2025-01-15T11:00:00\"),\n  color: \"#4285f4\",\n  extra: {\n    attendees: [\"user1@example.com\", \"user2@example.com\"],\n    location: \"会议室 A\",\n    agenda: \"讨论项目进度\",\n  },\n};\n\n// appointment 类型的 Event（扩展的 Event）\nconst appointmentEvent: Event = {\n  id: \"event-2\",\n  type: \"appointment\",\n  title: \"医生预约\",\n  startTime: new Date(\"2025-01-15T14:00:00\"),\n  endTime: new Date(\"2025-01-15T15:00:00\"),\n  color: \"#fbbc04\",\n  extra: {\n    doctor: \"Dr. Smith\",\n    department: \"内科\",\n    notes: \"带病历\",\n  },\n};\n\n// holiday 类型的 Event（扩展的 Event）\nconst holidayEvent: Event = {\n  id: \"event-3\",\n  type: \"holiday\",\n  title: \"春节\",\n  startTime: new Date(\"2025-01-29T00:00:00\"),\n  endTime: new Date(\"2025-02-04T23:59:59\"),\n  color: \"#ea4335\",\n  extra: {\n    country: \"CN\",\n    isOfficial: true,\n    description: \"法定节假日\",\n  },\n};\n\n// task 类型的 Event\nconst taskEvent: Event = {\n  id: \"event-4\",\n  type: \"task\",\n  title: \"完成报告\",\n  startTime: new Date(\"2025-01-15T14:00:00\"),\n  endTime: new Date(\"2025-01-15T16:00:00\"),\n  color: \"#34a853\",\n  extra: {\n    assignee: \"user1@example.com\",\n    status: \"in-progress\",\n    priority: \"high\",\n  },\n};\n```\n\n**重要**：\n\n- Appointment 和 Holiday 都是 Event 的扩展类型\n- 它们都是 Event，只是 `type` 不同，`extra` 的内容不同\n- 在 Calendar 中显示时，根据 `type` 显示不同的详情卡片\n- Event 的 `extra` 字段由 Event DSL 定义，用于详情卡片显示\n- Calendar 只使用 Event 的核心字段（id, type, title, startTime, endTime, color, icon）进行显示\n\n#### 1.3 Event 类型与 DSL 类型关联\n\n- `Event.type` 字段对应 DSL 的 `EventTypeDefinition.id`\n- `Event.extra` 字段的值由 DSL 的 `EventTypeDefinition.fields` 生成\n- `Event.color` 和 `Event.icon` 由 DSL 的 `EventTypeDefinition.display` 生成\n- **重要**：\n  - Event Data Model 定义了结构（在 `@calenderjs/event-model` 中）\n  - Event Data Model 的 JSON Schema 在 `packages/event-model/src/validator.ts` 中定义（`EVENT_BASE_SCHEMA`）\n  - DSL 生成符合 Event Data Model 的数据，不生成 JSON Schema\n  - Event 数据验证使用 Event Data Model 的 JSON Schema（`EVENT_BASE_SCHEMA`）\n  - Calendar 组件通过插件系统根据 `Event.type` 渲染不同的详情卡片\n\n**Event 类型映射关系图**：\n\n```mermaid\n%%{init: {'theme':'base', 'themeVariables': {'primaryColor':'#1e88e5', 'primaryTextColor':'#fff', 'primaryBorderColor':'#1565c0', 'lineColor':'#64b5f6', 'secondaryColor':'#ff9800', 'tertiaryColor':'#4caf50', 'background':'#121212', 'mainBkgColor':'#1e1e1e', 'secondBkgColor':'#2d2d2d', 'textColor':'#e0e0e0', 'clusterBkg':'#2d2d2d', 'clusterBorder':'#64b5f6'}}}%%\ngraph LR\n    subgraph \"DSL 定义\"\n        A[EventTypeDefinition.id]\n        B[EventTypeDefinition.fields]\n        C[EventTypeDefinition.display]\n    end\n\n    subgraph \"Event 对象\"\n        D[Event.type]\n        E[Event.extra]\n        F[Event.color\u003cbr/>Event.icon]\n    end\n\n    subgraph \"Calendar 显示\"\n        G[Calendar 组件]\n        H[插件系统]\n        I[详情卡片]\n    end\n\n    A --> D\n    B --> E\n    C --> F\n    D --> G\n    E --> H\n    F --> G\n    H --> I\n\n    style A fill:#ff9800,stroke:#f57c00,color:#fff\n    style B fill:#ff9800,stroke:#f57c00,color:#fff\n    style C fill:#ff9800,stroke:#f57c00,color:#fff\n    style D fill:#1e88e5,stroke:#1565c0,color:#fff\n    style E fill:#1e88e5,stroke:#1565c0,color:#fff\n    style F fill:#1e88e5,stroke:#1565c0,color:#fff\n    style G fill:#4caf50,stroke:#388e3c,color:#fff\n    style H fill:#4caf50,stroke:#388e3c,color:#fff\n    style I fill:#4caf50,stroke:#388e3c,color:#fff\n```\n\n### 2. Event 数据生成工具\n\n**架构说明**：\n\n- Event Data Model 是 SSOT，定义了 Event 接口结构\n- DSL 是生成工具，用于生成符合 Event Data Model 的数据\n- `EventDataGenerator` 从 DSL 定义生成 Event 对象\n\n**命名规范（已统一）**\n\nEvent DSL 中的所有类型和类已统一使用 \"Event\" 前缀，与架构设计一致：\n\n- ✅ `EventDSL` - Event DSL 根类型\n- ✅ `EventTypeDefinition` - 事件类型定义\n- ✅ `EventDSLCompiler` - Event DSL 编译器\n- ✅ `EventDSLRuntime` - Event DSL 运行时\n- ✅ `RenderedEvent` - 渲染后的事件信息\n- ✅ `EventValidator` - 全局验证器（注意：与 event-model 中的 EventValidator 不同）\n- ✅ `EventRule` - 全局规则\n- ✅ `Event` 接口 - 在 @calenderjs/event-model 中定义（SSOT）\n\n**架构原则**：\n\n- DSL 生成 Event 对象，而不是 Appointment 对象\n- Appointment 只是 Event 的一个扩展类型（`type: \"appointment\"`）\n- 所有 DSL 相关类型和类都使用 \"Event\" 前缀，保持命名一致性\n\n#### 2.1 Event 数据生成\n\n```typescript\n// packages/event-dsl/src/generators/EventDataGenerator.ts\nexport class EventDataGenerator {\n  /**\n   * 从 DSL 定义生成符合 Event Data Model 的 Event 对象\n   */\n  generateEvent(\n    dslType: EventTypeDefinition,\n    overrides?: Partial\u003cEvent>,\n  ): Event {\n    // 根据字段定义生成 data 字段的默认值\n    const data: Record\u003cstring, any> = {};\n    dslType.fields.forEach((field) => {\n      data[field.name] = this.generateFieldValue(field);\n    });\n\n    // 生成默认时间（当前时间 + 1小时）\n    const now = new Date();\n    const defaultStartTime = overrides?.startTime || now;\n    const defaultEndTime =\n      overrides?.endTime || new Date(now.getTime() + 60 * 60 * 1000);\n\n    // 生成标题（使用模板或默认值）\n    const title = this.generateTitle(dslType, data, overrides?.title);\n\n    return {\n      id: overrides?.id || this.generateId(),\n      type: dslType.id,\n      title: title,\n      startTime: defaultStartTime,\n      endTime: defaultEndTime,\n      data: { ...data, ...(overrides?.data || {}) },\n      metadata: overrides?.metadata || this.generateMetadata(),\n    };\n  }\n\n  /**\n   * 生成字段默认值\n   */\n  private generateFieldValue(field: FieldDefinition): any {\n    if (field.default !== undefined) {\n      return field.default;\n    }\n\n    switch (field.type) {\n      case \"string\":\n        return \"\";\n      case \"number\":\n        return 0;\n      case \"boolean\":\n        return false;\n      case \"date\":\n        return new Date().toISOString();\n      case \"time\":\n        return \"00:00\";\n      case \"enum\":\n        return field.enum?.[0] || \"\";\n      case \"array\":\n        return [];\n      case \"object\":\n        return {};\n      default:\n        return null;\n    }\n  }\n}\n```\n\n#### 2.2 使用示例\n\n```typescript\nimport { EventDataGenerator } from \"@calenderjs/event-dsl\";\nimport type { EventTypeDefinition } from \"@calenderjs/event-dsl\";\n\nconst meetingType: EventTypeDefinition = {\n  id: \"meeting\",\n  name: \"会议\",\n  fields: [\n    {\n      name: \"attendees\",\n      type: \"array\",\n      items: { type: \"string\" },\n      required: true,\n    },\n    { name: \"location\", type: \"string\" },\n    {\n      name: \"priority\",\n      type: \"enum\",\n      enum: [\"low\", \"normal\", \"high\"],\n      default: \"normal\",\n    },\n  ],\n  display: {\n    color: \"#4285f4\",\n    titleTemplate: \"${title}\",\n  },\n  behavior: {\n    defaultDuration: 60,\n  },\n};\n\nconst generator = new EventDataGenerator();\nconst event = generator.generateEvent(meetingType, {\n  title: \"团队会议\",\n  startTime: new Date(\"2026-01-15T10:00:00\"),\n  endTime: new Date(\"2026-01-15T11:00:00\"),\n});\n\n// 生成的 Event 对象符合 Event Data Model\nconsole.log(event);\n// {\n//   id: \"event-...\",\n//   type: \"meeting\",\n//   title: \"团队会议\",\n//   startTime: Date,\n//   endTime: Date,\n//   color: \"#4285f4\",\n//   extra: {\n//     attendees: [],\n//     location: \"\",\n//     priority: \"normal\"\n//   },\n//   metadata: { createdAt: Date, updatedAt: Date }\n// }\n```\n\n### 3. 日历组件事件渲染\n\n**数据契约消费**：\n\nCalendar 组件消费 Event Data Model 时，必须遵循数据契约：\n\n- Calendar 组件只能访问 Event 接口定义的字段\n- Calendar 组件应该使用 `Event.extra` 字段来获取详情卡片数据\n- Calendar 组件应该根据 `Event.type` 选择不同的渲染方式\n\n**插件机制**：\n\nCalendar 组件将提供插件机制（见 RFC-0012），允许为不同类型的事件注册自定义的详情卡片渲染器。\n\n**设计原则**（参考 Editor.js 插件架构）：\n\n1. **Calendar 组件提供插件注册系统**\n   - Calendar 组件负责插件注册和管理\n   - 插件系统应该类似于 Editor.js 的插件架构\n\n2. **插件接口设计**\n   - 插件应该能够根据 `Event.type` 注册不同的渲染器\n   - 插件应该能够访问 `Event.extra` 字段来渲染详情卡片\n   - 插件应该能够访问数据契约（Event 接口）\n\n3. **扩展性**\n   - 插件应该能够扩展 Calendar 功能，而不修改核心代码\n   - 插件系统应该易于使用和扩展\n\n**详细设计**：见 RFC-0012\n\n#### 3.1 WeekView 事件渲染\n\n```typescript\n// packages/calendar/src/views/WeekView.wsx\n// 在现有的 WeekView 中添加事件渲染\n\n// 计算事件位置和大小\nprivate calculateEventPosition(event: Event): {\n  top: number;\n  height: number;\n  left: number;\n  width: number;\n} {\n  const startHour = event.startTime.getHours();\n  const startMinute = event.startTime.getMinutes();\n  const endHour = event.endTime.getHours();\n  const endMinute = event.endTime.getMinutes();\n\n  const slotHeight = 48; // 每个小时的高度（像素）\n  const slotDuration = 60; // 每个时段的时长（分钟）\n\n  const top = calculateAppointmentTop(event, slotHeight, slotDuration);\n  const height = calculateAppointmentHeight(event, slotHeight, slotDuration);\n\n  // 计算事件在星期几（0=周日，1=周一...）\n  const dayOfWeek = event.startTime.getDay();\n  const dayIndex = (dayOfWeek === 0 ? 7 : dayOfWeek) - 1; // 转换为周一=0\n\n  const left = (dayIndex * 100) / 7; // 百分比\n  const width = 100 / 7; // 百分比\n\n  return { top, height, left, width };\n}\n\n// 渲染事件\nprivate renderEvent(event: Event) {\n  const position = this.calculateEventPosition(event);\n  const dslType = this.getDSLType(event.type);\n  const rendered = dslType\n    ? this.dslRuntime.render(event, event.type)\n    : { title: event.title, color: '#4285f4' };\n\n  return (\n    \u003cdiv\n      class=\"week-view-event\"\n      style={{\n        top: `${position.top}px`,\n        height: `${position.height}px`,\n        left: `${position.left}%`,\n        width: `${position.width}%`,\n        backgroundColor: rendered.color,\n      }}\n      onClick={() => this.handleEventClick(event)}\n    >\n      {rendered.title}\n    \u003c/div>\n  );\n}\n```\n\n#### 3.2 DayView 事件渲染\n\n类似 WeekView，但只显示单天的事件。\n\n#### 3.3 MonthView 事件渲染\n\n在月份视图中，事件显示为日期上的小点或标签。\n\n### 4. 事件数据验证\n\n**验证架构**：\n\n- Event Data Model 定义了 Event 接口结构\n- `@calenderjs/event-model` 提供 `EventValidator` 用于验证 Event 数据是否符合 Event Data Model\n- DSL 验证器用于验证业务规则（如字段值、跨字段验证等）\n\n```typescript\n// 使用 Event Data Model 的验证器\nimport { EventValidator } from \"@calenderjs/event-model\";\nimport { EventDSLRuntime } from \"@calenderjs/event-dsl\";\n\nconst eventValidator = new EventValidator();\nconst dslRuntime = new EventDSLRuntime(ast);\n\n// 1. 验证 Event 数据是否符合 Event Data Model\nconst baseResult = eventValidator.validateBase(event);\nif (!baseResult.valid) {\n  return baseResult;\n}\n\n// 2. 使用 DSL 验证器验证业务规则\nconst dslResult = dslRuntime.validate(event, context);\nif (!dslResult.valid) {\n  return dslResult;\n}\n\n// 3. 验证时间逻辑\nconst timeResult = eventValidator.validateTimeLogic(event);\nif (!timeResult.valid) {\n  return timeResult;\n}\n\nreturn { valid: true, errors: [] };\n```\n\n## 实施计划\n\n### 阶段一：Event 数据模型规范定义\n\n**步骤 1.1**: 更新 Event 接口文档\n\n- 文件：`packages/event-model/src/Event.ts`\n- 添加详细的注释说明 Event.data 字段与 DSL 的关系\n- ✅ 完成标准：注释完整，类型定义清晰\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n- ✅ 状态：已完成\n\n**步骤 1.2**: 创建 Event 数据模型规范文档\n\n- 文件：`docs/event-data-model.md`\n- 详细说明 Event 接口与 DSL 的映射关系\n- ✅ 完成标准：文档完整，示例清晰\n\n**步骤 1.3**: 实现 JSON Schema 验证功能\n\n- 文件：`packages/event-model/src/validators/EventValidator.ts`\n- 使用 ajv 实现 Event 数据验证\n- 实现 EventValidator 类，支持基本结构验证和 JSON Schema 验证\n- ✅ 完成标准：可以验证 Event 基本结构和 Event.data 字段\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n- ✅ 状态：已完成\n\n### 阶段二：Event 数据生成工具\n\n**步骤 2.1**: 创建 EventDataGenerator 类\n\n- 文件：`packages/event-dsl/src/generators/EventDataGenerator.ts`\n- 实现从 DSL 生成符合 Event Data Model 的 Event 对象\n- ✅ 完成标准：可以生成符合 Event 接口的 Event 对象\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n- ✅ 状态：已完成\n\n**步骤 2.2**: 移除 JSON Schema 生成逻辑\n\n- 文件：`packages/event-dsl/src/compiler.ts`\n- 移除 `generateJSONSchema` 和 `fieldToJSONSchema` 方法\n- 更新 `CompiledType` 接口，移除 `schema` 字段\n- ✅ 完成标准：DSL 编译器不再生成 JSON Schema\n- ✅ 测试要求：所有测试通过\n- ✅ 状态：已完成\n\n**步骤 2.3**: 导出生成器\n\n- 文件：`packages/event-dsl/src/index.ts`\n- 导出 EventDataGenerator\n- ✅ 完成标准：导出正确，类型定义完整\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n- ✅ 状态：已完成\n\n### 阶段三：日历组件事件渲染\n\n**步骤 3.1**: 在 WeekView 中添加事件渲染\n\n- 文件：`packages/calendar/src/views/WeekView.wsx`\n- 实现事件位置计算和渲染\n- ✅ 完成标准：事件可以正确显示在周视图中\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n**步骤 3.2**: 在 DayView 中添加事件渲染\n\n- 文件：`packages/calendar/src/views/DayView.wsx`\n- 实现事件位置计算和渲染\n- ✅ 完成标准：事件可以正确显示在日视图中\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n**步骤 3.3**: 在 MonthView 中添加事件渲染\n\n- 文件：`packages/calendar/src/views/MonthView.wsx`\n- 实现事件显示（小点或标签）\n- ✅ 完成标准：事件可以正确显示在月视图中\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n### 阶段四：事件数据验证\n\n**步骤 4.1**: 创建 EventValidator 类\n\n- 文件：`packages/event-dsl/src/validators/event-validator.ts`\n- 实现 Event 数据验证功能\n- ✅ 完成标准：可以验证 Event 数据是否符合 DSL 定义\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n**步骤 4.2**: 集成到日历组件\n\n- 文件：`packages/calendar/src/Calendar.wsx`\n- 在事件数据传入时进行验证\n- ✅ 完成标准：事件数据验证功能正常工作\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n\n## 变更历史\n\n- 2026-01-01: 初始创建\n- 2026-01-01: 创建 `@calenderjs/event-model` 包作为 SSOT，更新所有依赖关系\n- 2026-01-01: 为 `@calenderjs/event-model` 添加 JSON Schema 验证功能（使用 ajv），实现 EventValidator 类\n- 2026-01-01: **架构调整**：明确 DSL 是生成工具而非定义工具\n  - 移除 DSL 编译器中的 JSON Schema 生成逻辑\n  - 创建 EventDataGenerator 用于从 DSL 生成 Event 数据\n  - 更新 CompiledType 接口，移除 schema 字段\n  - Event Data Model 是 SSOT，定义了 Event 接口结构\n  - DSL 用于生成符合 Event Data Model 的数据\n- 2026-01-01: **Event 数据模型重新设计**\n  - 将 `data` 字段改为 `extra`（扩展属性，用于详情卡片）\n  - 添加 `color` 和 `icon` 字段（Calendar 显示属性）\n  - 明确 Appointment 和 Holiday 都是 Event 的扩展类型\n  - 区别在于详情卡片的数据不同（`extra` 字段内容不同）\n- 2026-01-01: **插件/扩展机制设计**\n  - 添加插件/扩展机制设计说明（参考 Editor.js 插件架构）\n  - Event Data Model 应该支持插件注册系统\n  - Calendar 组件应该允许注册自定义的详情卡片渲染器\n  - 插件系统应该根据 `Event.type` 选择对应的渲染器\n- 2026-01-01: **命名规范统一**\n  - 完成 Event DSL 中所有 \"Appointment\" 术语的重命名\n  - **重命名完成**：\n    - ✅ `AppointmentDSL` → `EventDSL`\n    - ✅ `AppointmentType` → `EventTypeDefinition`\n    - ✅ `AppointmentDSLCompiler` → `EventDSLCompiler`\n    - ✅ `RenderedAppointment` → `RenderedEvent`\n    - ✅ `AppointmentValidator` → `EventValidator`\n    - ✅ `AppointmentRule` → `EventRule`\n    - ✅ `Appointment` 接口 → 移除，改用 `Event`（已在 event-model 中定义）\n  - **架构一致性**：所有 DSL 相关类型和类都使用 \"Event\" 前缀，与 Event Data Model 保持一致"},"source-b03f4f419b7ae678-s1":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:1-8`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC-0011: Event 数据模型与 Event DSL 集成\n\n**状态**: Draft  \n**创建日期**: 2026-01-01  \n**最后更新**: 2026-01-01  \n**作者**: CalenderJS Team  \n**关联 RFC**: RFC-0001, RFC-0002, RFC-0009, RFC-0012\n"},"source-b03f4f419b7ae678-s2":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:9-12`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 摘要\n\n**本 RFC 的目的是澄清 Event Data Model 与 Event DSL 的架构关系，并设计插件/扩展机制。**\n"},"source-b03f4f419b7ae678-s3":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:13-53`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 核心架构原则\n\n1. **Event Data Model 是 SSOT（单一数据源）**\n   - **定义位置**：`packages/event-model/src/Event.ts`\n   - **接口结构**：`Event { id, type, title, startTime, endTime, color?, icon?, extra?, metadata? }`\n   - **JSON Schema 位置**：`packages/event-model/src/validator.ts` 中的 `EVENT_BASE_SCHEMA`\n   - **验证器位置**：`packages/event-model/src/validator.ts` 中的 `EventValidator`\n\n2. **Event DSL 是生成工具（不是定义工具）**\n   - **作用**：从 DSL 定义生成符合 Event Data Model 的 Event 数据\n   - **不生成 JSON Schema**：Event Data Model 的 JSON Schema 已经在 `@calenderjs/event-model` 中定义\n   - **生成 Event 对象**：使用 `EventDataGenerator` 从 DSL 生成 Event 数据\n   - **DSL 类型**：`EventDSL`、`EventTypeDefinition`、`EventDSLCompiler`、`EventDSLRuntime`\n   - **命名一致性**：所有 DSL 相关类型和类都使用 \"Event\" 前缀，而不是 \"Appointment\"\n\n3. **Appointment 和 Holiday 都是 Event 的扩展**\n   - 它们都是 Event，只是 `type` 不同\n   - 区别在于详情卡片的数据不同（`extra` 字段内容不同）\n\n4. **插件/扩展机制支持**\n   - Event Data Model 应该支持插件/扩展机制（类似 Editor.js）\n   - Calendar 组件应该允许注册自定义的详情卡片渲染器\n   - 插件系统应该根据 `Event.type` 选择对应的渲染器\n\n5. **数据流向**\n\n```mermaid\n%%{init: {'theme':'base', 'themeVariables': {'primaryColor':'#1e88e5', 'primaryTextColor':'#fff', 'primaryBorderColor':'#1565c0', 'lineColor':'#64b5f6', 'secondaryColor':'#ff9800', 'tertiaryColor':'#4caf50', 'background':'#121212', 'mainBkgColor':'#1e1e1e', 'secondBkgColor':'#2d2d2d', 'textColor':'#e0e0e0'}}}%%\ngraph LR\n    A[DSL 定义] --> B[EventDataGenerator]\n    B --> C[Event 对象\u003cbr/>符合 Event Data Model]\n    C --> D[EventValidator\u003cbr/>使用 EVENT_BASE_SCHEMA]\n    D --> E{验证通过?}\n    E -->|是| F[Calendar 组件]\n    E -->|否| G[验证错误]\n    F --> H[插件系统]\n    H --> I[详情卡片渲染]\n```\n\n本 RFC 确保架构关系清晰，DSL 能够正确生成符合 Event Data Model 的数据，并支持插件/扩展机制。\n"},"source-b03f4f419b7ae678-s4":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:54-90`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 架构关系图\n\n```mermaid\n%%{init: {'theme':'base', 'themeVariables': {'primaryColor':'#1e88e5', 'primaryTextColor':'#fff', 'primaryBorderColor':'#1565c0', 'lineColor':'#64b5f6', 'secondaryColor':'#ff9800', 'tertiaryColor':'#4caf50', 'background':'#121212', 'mainBkgColor':'#1e1e1e', 'secondBkgColor':'#2d2d2d', 'textColor':'#e0e0e0', 'clusterBkg':'#2d2d2d', 'clusterBorder':'#64b5f6'}}}%%\ngraph TB\n    subgraph \"Event Data Model (SSOT)\"\n        A[Event 接口\u003cbr/>Event.ts]\n        B[EVENT_BASE_SCHEMA\u003cbr/>validator.ts]\n        C[EventValidator\u003cbr/>validator.ts]\n    end\n\n    subgraph \"Event DSL (Generator)\"\n        D[DSL 定义]\n        E[EventDataGenerator]\n    end\n\n    subgraph \"Calendar Component\"\n        F[Calendar 组件]\n        G[插件系统]\n    end\n\n    D --> E\n    E --> A\n    A --> B\n    B --> C\n    A --> F\n    F --> G\n    G --> H[详情卡片渲染]\n\n    style A fill:#1e88e5,stroke:#1565c0,color:#fff\n    style B fill:#1e88e5,stroke:#1565c0,color:#fff\n    style C fill:#1e88e5,stroke:#1565c0,color:#fff\n    style E fill:#ff9800,stroke:#f57c00,color:#fff\n    style F fill:#4caf50,stroke:#388e3c,color:#fff\n    style G fill:#4caf50,stroke:#388e3c,color:#fff\n```\n"},"source-b03f4f419b7ae678-s5":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:91-111`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 动机\n\n当前状态：\n\n- ✅ UI 组件（Calendar、WeekView、DayView、MonthView）已实现，可以显示日历网格\n- ✅ Event 数据模型包已创建（`@calenderjs/event-model`）作为 SSOT\n- ✅ Event 核心接口已定义（`packages/event-model/src/Event.ts`）\n- ✅ Event DSL 编译器已实现（验证器、渲染器）\n- ✅ Event 数据生成器已实现（`packages/event-dsl/src/generators/EventDataGenerator.ts`）\n- ✅ 所有包已更新依赖 `@calenderjs/event-model`\n- ✅ JSON Schema 验证功能已实现（`packages/event-model/src/validators/EventValidator.ts`，使用 ajv）\n- ❌ Event 数据模型与 Event DSL 的集成尚未完成\n- ❌ 日历组件中显示事件的功能尚未实现\n\n需要解决的问题：\n\n1. 如何从 Event DSL 定义生成符合 Event Data Model 的 Event 数据？\n2. 如何确保生成的 Event 数据符合 Event Data Model 的结构？\n3. 如何在日历组件中渲染事件？\n4. 如何验证事件数据是否符合 Event Data Model？\n"},"source-b03f4f419b7ae678-s6":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:112-129`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 目标\n\n1. **明确架构关系**\n   - Event Data Model 是 SSOT，定义了 Event 接口结构\n   - DSL 是生成工具，用于生成符合 Event Data Model 的数据\n   - DSL 生成 Event 数据，而不是定义数据模型\n\n2. **实现 Event 数据生成工具**\n   - 从 DSL 定义生成符合 Event Data Model 的 Event 对象\n   - 提供 Event 数据生成器（`EventDataGenerator`）\n   - 提供 Event 数据验证功能（基于 Event Data Model）\n\n3. **实现日历组件事件显示**\n   - 在 WeekView 中显示事件\n   - 在 DayView 中显示事件\n   - 在 MonthView 中显示事件\n   - 支持事件样式和交互\n"},"source-b03f4f419b7ae678-s7":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:130-131`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 范围\n"},"source-b03f4f419b7ae678-s8":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:132-139`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### In-Scope\n\n- Event 数据模型与 Event DSL 的集成规范\n- Event 数据生成工具（从 DSL 生成 Event 对象）\n- 日历组件中事件渲染功能\n- 事件数据验证功能（基于 Event Data Model）\n- 事件样式和交互（基础功能）\n"},"source-b03f4f419b7ae678-s9":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:140-147`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Out-of-Scope\n\n- 事件编辑功能（后续 RFC）\n- 事件拖拽功能（后续 RFC）\n- 事件创建表单（后续 RFC）\n- 事件详情弹窗（后续 RFC）\n- **Calendar 插件机制实现**（见 RFC-0012）\n"},"source-b03f4f419b7ae678-s10":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:148-190`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 数据契约（Data Contract）\n\n**数据契约定义**：\n\n数据契约是 Event Data Model 的正式规范，定义了 Calendar 组件与 Event 数据之间的接口约定。\n\n**数据契约内容**：\n\n```typescript\n// 数据契约：Event 接口\ninterface Event {\n  // Calendar 必需字段\n  id: string;\n  type: string;\n  title: string;\n  startTime: Date;\n  endTime: Date;\n\n  // Calendar 显示属性（可选）\n  color?: string;\n  icon?: string;\n\n  // 扩展属性（可选，用于详情卡片）\n  extra?: Record\u003cstring, any>;\n\n  // 元数据（可选）\n  metadata?: EventMetadata;\n}\n```\n\n**数据契约的作用**：\n\n- 定义 Calendar 组件消费 Event 数据的标准接口\n- 确保所有 Event 数据都符合统一的结构\n- 支持插件系统根据 `Event.type` 渲染不同的详情卡片\n- 提供运行时验证（通过 JSON Schema）\n\n**数据契约的位置**：\n\n- Event 接口：`packages/event-model/src/Event.ts`\n- JSON Schema：`packages/event-model/src/validator.ts` 中的 `EVENT_BASE_SCHEMA`\n- 验证器：`packages/event-model/src/validator.ts` 中的 `EventValidator`\n"},"source-b03f4f419b7ae678-s11":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:191-227`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 数据契约关系图\n\n```mermaid\n%%{init: {'theme':'base', 'themeVariables': {'primaryColor':'#1e88e5', 'primaryTextColor':'#fff', 'primaryBorderColor':'#1565c0', 'lineColor':'#64b5f6', 'secondaryColor':'#ff9800', 'tertiaryColor':'#4caf50', 'background':'#121212', 'mainBkgColor':'#1e1e1e', 'secondBkgColor':'#2d2d2d', 'textColor':'#e0e0e0', 'clusterBkg':'#2d2d2d', 'clusterBorder':'#64b5f6'}}}%%\ngraph TB\n    subgraph \"数据契约 (Data Contract)\"\n        A[Event 接口\u003cbr/>TypeScript Interface]\n        B[EVENT_BASE_SCHEMA\u003cbr/>JSON Schema]\n        C[EventValidator\u003cbr/>Runtime Validator]\n    end\n\n    subgraph \"数据生成\"\n        D[Event DSL]\n        E[EventDataGenerator]\n    end\n\n    subgraph \"数据消费\"\n        F[Calendar 组件]\n        G[插件系统]\n    end\n\n    A -.定义.-> B\n    B -.验证.-> C\n    D --> E\n    E -->|生成符合| A\n    C -->|验证| A\n    A -->|消费| F\n    F -->|使用| G\n\n    style A fill:#1e88e5,stroke:#1565c0,color:#fff\n    style B fill:#1e88e5,stroke:#1565c0,color:#fff\n    style C fill:#1e88e5,stroke:#1565c0,color:#fff\n    style E fill:#ff9800,stroke:#f57c00,color:#fff\n    style F fill:#4caf50,stroke:#388e3c,color:#fff\n    style G fill:#4caf50,stroke:#388e3c,color:#fff\n```\n"},"source-b03f4f419b7ae678-s12":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:228-250`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Calendar 插件机制（设计说明）\n\n**重要设计考虑**：\n\nCalendar 组件将提供插件机制（见 RFC-0012），允许为不同类型的事件注册自定义的详情卡片渲染器。\n\n**设计原则**（参考 Editor.js 插件架构）：\n\n1. **Calendar 组件提供插件注册系统**\n   - Calendar 组件负责插件注册和管理\n   - 插件系统应该类似于 Editor.js 的插件架构\n\n2. **插件接口设计**\n   - 插件应该能够根据 `Event.type` 注册不同的渲染器\n   - 插件应该能够访问 `Event.extra` 字段来渲染详情卡片\n   - 插件应该能够访问数据契约（Event 接口）\n\n3. **扩展性**\n   - 插件应该能够扩展 Calendar 功能，而不修改核心代码\n   - 插件系统应该易于使用和扩展\n\n**详细设计**：见 RFC-0012\n"},"source-b03f4f419b7ae678-s13":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:251-272`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 核心交付物\n\n1. **Event 数据模型规范文档**\n   - Event 接口与 DSL 映射关系\n   - Event.data 字段规范\n   - JSON Schema 生成规则\n\n2. **Event 数据生成工具**\n   - `packages/event-dsl/src/generators/event-data-generator.ts`\n   - 从 DSL 生成 Event JSON 示例\n   - 从 DSL 生成 Event TypeScript 类型\n\n3. **日历组件事件渲染**\n   - WeekView 事件渲染\n   - DayView 事件渲染\n   - MonthView 事件渲染\n   - 事件样式支持\n\n4. **事件数据验证**\n   - Event 数据验证工具\n   - 与 DSL 验证器集成\n"},"source-b03f4f419b7ae678-s14":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:273-281`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 成功标准\n\n1. ✅ 可以从 Event DSL 定义生成符合 Event 接口的 JSON 数据模型\n2. ✅ Event.data 字段符合 DSL 定义的字段结构\n3. ✅ 日历组件可以正确显示事件（WeekView、DayView、MonthView）\n4. ✅ 事件数据可以通过 DSL 验证器验证\n5. ✅ 所有代码达到 100% 测试覆盖率\n6. ✅ 所有测试通过\n"},"source-b03f4f419b7ae678-s15":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:282-283`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 详细设计\n"},"source-b03f4f419b7ae678-s16":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:284-287`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 0. Event Data Model 定义位置（SSOT）\n\n**`@calenderjs/event-model` 包的两个核心职责：**\n"},"source-b03f4f419b7ae678-s17":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:288-340`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 职责 1: 定义数据模型和 JSON Schema（数据契约）\n\n**数据契约（Data Contract）定义**：\n\n数据契约是 Event Data Model 的正式规范，定义了 Calendar 组件与 Event 数据之间的接口约定。\n\n1. **Event 接口定义（数据契约的核心）**\n   - **文件**：`packages/event-model/src/Event.ts`\n   - **内容**：`Event` 和 `EventMetadata` 接口定义\n   - **导出**：`export * from \"./Event\"`\n   - **作用**：定义 Calendar 组件消费 Event 数据的接口契约\n\n2. **Event JSON Schema（数据契约的验证规范）**\n   - **文件**：`packages/event-model/src/validator.ts`\n   - **内容**：`EVENT_BASE_SCHEMA` 常量，定义 Event 接口的 JSON Schema\n   - **导出**：`export * from \"./validator\"`（包含 `EVENT_BASE_SCHEMA`）\n   - **作用**：提供运行时验证，确保数据符合数据契约\n\n3. **JSON Schema 类型定义**\n   - **文件**：`packages/event-model/src/types.ts`\n   - **内容**：`JSONSchema` 接口定义\n   - **导出**：`export * from \"./types\"`\n\n**数据契约内容**：\n\n```typescript\n// 数据契约：Event 接口\ninterface Event {\n  // Calendar 必需字段\n  id: string;\n  type: string;\n  title: string;\n  startTime: Date;\n  endTime: Date;\n\n  // Calendar 显示属性（可选）\n  color?: string;\n  icon?: string;\n\n  // 扩展属性（可选，用于详情卡片）\n  extra?: Record\u003cstring, any>;\n\n  // 元数据（可选）\n  metadata?: EventMetadata;\n}\n```\n\n**数据契约的作用**：\n\n- 定义 Calendar 组件消费 Event 数据的标准接口\n- 确保所有 Event 数据都符合统一的结构\n- 支持插件系统根据 `Event.type` 渲染不同的详情卡片\n"},"source-b03f4f419b7ae678-s18":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:341-358`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 职责 2: 使用 JSON Schema 验证数据\n\n1. **Event 验证器**\n   - **文件**：`packages/event-model/src/validator.ts`\n   - **内容**：`EventValidator` 类，使用 `EVENT_BASE_SCHEMA` 验证 Event 数据\n   - **方法**：\n     - `validateBase(event)` - 验证 Event 对象是否符合基础 Event Schema\n     - `validateData(event, dataSchema)` - 验证 Event.data 是否符合指定的 JSON Schema\n     - `validate(event, dataSchema?)` - 验证完整的 Event 对象\n     - `validateTimeLogic(event)` - 验证时间逻辑（startTime \u003c endTime）\n   - **导出**：`export * from \"./validator\"`\n\n**重要架构原则**：\n\n- Event Data Model 的 JSON Schema（`EVENT_BASE_SCHEMA`）在 `@calenderjs/event-model` 中定义\n- DSL **不生成** JSON Schema，只生成符合 Event Data Model 的 Event 数据\n- DSL 使用 Event Data Model 的 JSON Schema（`EVENT_BASE_SCHEMA`）进行验证\n"},"source-b03f4f419b7ae678-s19":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:359-360`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 1. Event 数据模型规范\n"},"source-b03f4f419b7ae678-s20":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:361-386`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 1.1 Event 接口结构\n\n```typescript\n// packages/event-model/src/Event.ts\nexport interface Event {\n  /** 唯一标识符 */\n  id: string;\n  /** 事件类型 (如 meeting, task, reminder) */\n  type: string;\n  /** 事件标题（Calendar 显示用） */\n  title: string;\n  /** 开始时间（必需 - Event 必须有时间） */\n  startTime: Date;\n  /** 结束时间（必需 - Event 必须有时间） */\n  endTime: Date;\n  /** Calendar 显示颜色（可选） */\n  color?: string;\n  /** Calendar 显示图标（可选） */\n  icon?: string;\n  /** 扩展属性（可选，用于详情卡片显示） */\n  extra?: Record\u003cstring, any>;\n  /** 事件元数据（可选） */\n  metadata?: EventMetadata;\n}\n```\n"},"source-b03f4f419b7ae678-s21":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:387-511`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 1.2 Event 数据模型设计原则\n\n**核心设计理念**：\n\n1. **Calendar 只关心 Event**\n   - Calendar 组件处理的是 Event（时间敏感的活动）\n   - Event 必须有 `startTime` 和 `endTime`\n\n2. **Appointment 和 Holiday 都是 Event 的扩展**\n   - Appointment 和 Holiday 都是 Event，只是 `type` 不同\n   - 它们都有 `startTime` 和 `endTime`，所以是 Event\n   - 区别在于：在 Calendar 中显示时，它们有不同的详情卡片\n\n3. **Event 包含 Calendar 需要的数据**\n   - Event 数据模型包含 Calendar 显示所需的核心字段\n   - `id`, `type`, `title`, `startTime`, `endTime` - Calendar 必需\n   - `color`, `icon` - Calendar 显示属性（可选）\n\n4. **扩展属性用于详情卡片**\n   - Event 的 `extra` 字段存储详情卡片数据\n   - 不同类型的事件（meeting, appointment, holiday）有不同的 `extra` 内容\n   - 在 Calendar 中显示时，根据 `type` 显示不同的详情卡片\n   - 由 Event DSL 定义，用于不同类型的事件\n\n5. **插件/扩展机制支持**\n   - Event Data Model 应该支持插件/扩展机制（类似 Editor.js）\n   - Calendar 组件应该允许注册自定义的详情卡片渲染器\n   - 插件系统应该根据 `Event.type` 选择对应的渲染器\n   - 插件应该能够访问 `Event.extra` 字段来渲染详情卡片\n\n**Event 接口结构**：\n\n```typescript\ninterface Event {\n  // Calendar 必需字段\n  id: string;\n  type: string;\n  title: string;\n  startTime: Date; // 必需 - Event 必须有时间\n  endTime: Date; // 必需 - Event 必须有时间\n\n  // Calendar 显示属性（可选）\n  color?: string;\n  icon?: string;\n\n  // 扩展属性（可选，用于详情卡片）\n  extra?: Record\u003cstring, any>;\n\n  // 元数据（可选）\n  metadata?: EventMetadata;\n}\n```\n\n**`Event.extra` 字段示例**：\n\n```typescript\n// meeting 类型的 Event\nconst meetingEvent: Event = {\n  id: \"event-1\",\n  type: \"meeting\",\n  title: \"团队会议\",\n  startTime: new Date(\"2025-01-15T10:00:00\"),\n  endTime: new Date(\"2025-01-15T11:00:00\"),\n  color: \"#4285f4\",\n  extra: {\n    attendees: [\"user1@example.com\", \"user2@example.com\"],\n    location: \"会议室 A\",\n    agenda: \"讨论项目进度\",\n  },\n};\n\n// appointment 类型的 Event（扩展的 Event）\nconst appointmentEvent: Event = {\n  id: \"event-2\",\n  type: \"appointment\",\n  title: \"医生预约\",\n  startTime: new Date(\"2025-01-15T14:00:00\"),\n  endTime: new Date(\"2025-01-15T15:00:00\"),\n  color: \"#fbbc04\",\n  extra: {\n    doctor: \"Dr. Smith\",\n    department: \"内科\",\n    notes: \"带病历\",\n  },\n};\n\n// holiday 类型的 Event（扩展的 Event）\nconst holidayEvent: Event = {\n  id: \"event-3\",\n  type: \"holiday\",\n  title: \"春节\",\n  startTime: new Date(\"2025-01-29T00:00:00\"),\n  endTime: new Date(\"2025-02-04T23:59:59\"),\n  color: \"#ea4335\",\n  extra: {\n    country: \"CN\",\n    isOfficial: true,\n    description: \"法定节假日\",\n  },\n};\n\n// task 类型的 Event\nconst taskEvent: Event = {\n  id: \"event-4\",\n  type: \"task\",\n  title: \"完成报告\",\n  startTime: new Date(\"2025-01-15T14:00:00\"),\n  endTime: new Date(\"2025-01-15T16:00:00\"),\n  color: \"#34a853\",\n  extra: {\n    assignee: \"user1@example.com\",\n    status: \"in-progress\",\n    priority: \"high\",\n  },\n};\n```\n\n**重要**：\n\n- Appointment 和 Holiday 都是 Event 的扩展类型\n- 它们都是 Event，只是 `type` 不同，`extra` 的内容不同\n- 在 Calendar 中显示时，根据 `type` 显示不同的详情卡片\n- Event 的 `extra` 字段由 Event DSL 定义，用于详情卡片显示\n- Calendar 只使用 Event 的核心字段（id, type, title, startTime, endTime, color, icon）进行显示\n"},"source-b03f4f419b7ae678-s22":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:512-565`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 1.3 Event 类型与 DSL 类型关联\n\n- `Event.type` 字段对应 DSL 的 `EventTypeDefinition.id`\n- `Event.extra` 字段的值由 DSL 的 `EventTypeDefinition.fields` 生成\n- `Event.color` 和 `Event.icon` 由 DSL 的 `EventTypeDefinition.display` 生成\n- **重要**：\n  - Event Data Model 定义了结构（在 `@calenderjs/event-model` 中）\n  - Event Data Model 的 JSON Schema 在 `packages/event-model/src/validator.ts` 中定义（`EVENT_BASE_SCHEMA`）\n  - DSL 生成符合 Event Data Model 的数据，不生成 JSON Schema\n  - Event 数据验证使用 Event Data Model 的 JSON Schema（`EVENT_BASE_SCHEMA`）\n  - Calendar 组件通过插件系统根据 `Event.type` 渲染不同的详情卡片\n\n**Event 类型映射关系图**：\n\n```mermaid\n%%{init: {'theme':'base', 'themeVariables': {'primaryColor':'#1e88e5', 'primaryTextColor':'#fff', 'primaryBorderColor':'#1565c0', 'lineColor':'#64b5f6', 'secondaryColor':'#ff9800', 'tertiaryColor':'#4caf50', 'background':'#121212', 'mainBkgColor':'#1e1e1e', 'secondBkgColor':'#2d2d2d', 'textColor':'#e0e0e0', 'clusterBkg':'#2d2d2d', 'clusterBorder':'#64b5f6'}}}%%\ngraph LR\n    subgraph \"DSL 定义\"\n        A[EventTypeDefinition.id]\n        B[EventTypeDefinition.fields]\n        C[EventTypeDefinition.display]\n    end\n\n    subgraph \"Event 对象\"\n        D[Event.type]\n        E[Event.extra]\n        F[Event.color\u003cbr/>Event.icon]\n    end\n\n    subgraph \"Calendar 显示\"\n        G[Calendar 组件]\n        H[插件系统]\n        I[详情卡片]\n    end\n\n    A --> D\n    B --> E\n    C --> F\n    D --> G\n    E --> H\n    F --> G\n    H --> I\n\n    style A fill:#ff9800,stroke:#f57c00,color:#fff\n    style B fill:#ff9800,stroke:#f57c00,color:#fff\n    style C fill:#ff9800,stroke:#f57c00,color:#fff\n    style D fill:#1e88e5,stroke:#1565c0,color:#fff\n    style E fill:#1e88e5,stroke:#1565c0,color:#fff\n    style F fill:#1e88e5,stroke:#1565c0,color:#fff\n    style G fill:#4caf50,stroke:#388e3c,color:#fff\n    style H fill:#4caf50,stroke:#388e3c,color:#fff\n    style I fill:#4caf50,stroke:#388e3c,color:#fff\n```\n"},"source-b03f4f419b7ae678-s23":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:566-592`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 2. Event 数据生成工具\n\n**架构说明**：\n\n- Event Data Model 是 SSOT，定义了 Event 接口结构\n- DSL 是生成工具，用于生成符合 Event Data Model 的数据\n- `EventDataGenerator` 从 DSL 定义生成 Event 对象\n\n**命名规范（已统一）**\n\nEvent DSL 中的所有类型和类已统一使用 \"Event\" 前缀，与架构设计一致：\n\n- ✅ `EventDSL` - Event DSL 根类型\n- ✅ `EventTypeDefinition` - 事件类型定义\n- ✅ `EventDSLCompiler` - Event DSL 编译器\n- ✅ `EventDSLRuntime` - Event DSL 运行时\n- ✅ `RenderedEvent` - 渲染后的事件信息\n- ✅ `EventValidator` - 全局验证器（注意：与 event-model 中的 EventValidator 不同）\n- ✅ `EventRule` - 全局规则\n- ✅ `Event` 接口 - 在 @calenderjs/event-model 中定义（SSOT）\n\n**架构原则**：\n\n- DSL 生成 Event 对象，而不是 Appointment 对象\n- Appointment 只是 Event 的一个扩展类型（`type: \"appointment\"`）\n- 所有 DSL 相关类型和类都使用 \"Event\" 前缀，保持命名一致性\n"},"source-b03f4f419b7ae678-s24":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:593-662`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 2.1 Event 数据生成\n\n```typescript\n// packages/event-dsl/src/generators/EventDataGenerator.ts\nexport class EventDataGenerator {\n  /**\n   * 从 DSL 定义生成符合 Event Data Model 的 Event 对象\n   */\n  generateEvent(\n    dslType: EventTypeDefinition,\n    overrides?: Partial\u003cEvent>,\n  ): Event {\n    // 根据字段定义生成 data 字段的默认值\n    const data: Record\u003cstring, any> = {};\n    dslType.fields.forEach((field) => {\n      data[field.name] = this.generateFieldValue(field);\n    });\n\n    // 生成默认时间（当前时间 + 1小时）\n    const now = new Date();\n    const defaultStartTime = overrides?.startTime || now;\n    const defaultEndTime =\n      overrides?.endTime || new Date(now.getTime() + 60 * 60 * 1000);\n\n    // 生成标题（使用模板或默认值）\n    const title = this.generateTitle(dslType, data, overrides?.title);\n\n    return {\n      id: overrides?.id || this.generateId(),\n      type: dslType.id,\n      title: title,\n      startTime: defaultStartTime,\n      endTime: defaultEndTime,\n      data: { ...data, ...(overrides?.data || {}) },\n      metadata: overrides?.metadata || this.generateMetadata(),\n    };\n  }\n\n  /**\n   * 生成字段默认值\n   */\n  private generateFieldValue(field: FieldDefinition): any {\n    if (field.default !== undefined) {\n      return field.default;\n    }\n\n    switch (field.type) {\n      case \"string\":\n        return \"\";\n      case \"number\":\n        return 0;\n      case \"boolean\":\n        return false;\n      case \"date\":\n        return new Date().toISOString();\n      case \"time\":\n        return \"00:00\";\n      case \"enum\":\n        return field.enum?.[0] || \"\";\n      case \"array\":\n        return [];\n      case \"object\":\n        return {};\n      default:\n        return null;\n    }\n  }\n}\n```\n"},"source-b03f4f419b7ae678-s25":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:663-720`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 2.2 使用示例\n\n```typescript\nimport { EventDataGenerator } from \"@calenderjs/event-dsl\";\nimport type { EventTypeDefinition } from \"@calenderjs/event-dsl\";\n\nconst meetingType: EventTypeDefinition = {\n  id: \"meeting\",\n  name: \"会议\",\n  fields: [\n    {\n      name: \"attendees\",\n      type: \"array\",\n      items: { type: \"string\" },\n      required: true,\n    },\n    { name: \"location\", type: \"string\" },\n    {\n      name: \"priority\",\n      type: \"enum\",\n      enum: [\"low\", \"normal\", \"high\"],\n      default: \"normal\",\n    },\n  ],\n  display: {\n    color: \"#4285f4\",\n    titleTemplate: \"${title}\",\n  },\n  behavior: {\n    defaultDuration: 60,\n  },\n};\n\nconst generator = new EventDataGenerator();\nconst event = generator.generateEvent(meetingType, {\n  title: \"团队会议\",\n  startTime: new Date(\"2026-01-15T10:00:00\"),\n  endTime: new Date(\"2026-01-15T11:00:00\"),\n});\n\n// 生成的 Event 对象符合 Event Data Model\nconsole.log(event);\n// {\n//   id: \"event-...\",\n//   type: \"meeting\",\n//   title: \"团队会议\",\n//   startTime: Date,\n//   endTime: Date,\n//   color: \"#4285f4\",\n//   extra: {\n//     attendees: [],\n//     location: \"\",\n//     priority: \"normal\"\n//   },\n//   metadata: { createdAt: Date, updatedAt: Date }\n// }\n```\n"},"source-b03f4f419b7ae678-s26":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:721-751`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 3. 日历组件事件渲染\n\n**数据契约消费**：\n\nCalendar 组件消费 Event Data Model 时，必须遵循数据契约：\n\n- Calendar 组件只能访问 Event 接口定义的字段\n- Calendar 组件应该使用 `Event.extra` 字段来获取详情卡片数据\n- Calendar 组件应该根据 `Event.type` 选择不同的渲染方式\n\n**插件机制**：\n\nCalendar 组件将提供插件机制（见 RFC-0012），允许为不同类型的事件注册自定义的详情卡片渲染器。\n\n**设计原则**（参考 Editor.js 插件架构）：\n\n1. **Calendar 组件提供插件注册系统**\n   - Calendar 组件负责插件注册和管理\n   - 插件系统应该类似于 Editor.js 的插件架构\n\n2. **插件接口设计**\n   - 插件应该能够根据 `Event.type` 注册不同的渲染器\n   - 插件应该能够访问 `Event.extra` 字段来渲染详情卡片\n   - 插件应该能够访问数据契约（Event 接口）\n\n3. **扩展性**\n   - 插件应该能够扩展 Calendar 功能，而不修改核心代码\n   - 插件系统应该易于使用和扩展\n\n**详细设计**：见 RFC-0012\n"},"source-b03f4f419b7ae678-s27":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:752-811`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 3.1 WeekView 事件渲染\n\n```typescript\n// packages/calendar/src/views/WeekView.wsx\n// 在现有的 WeekView 中添加事件渲染\n\n// 计算事件位置和大小\nprivate calculateEventPosition(event: Event): {\n  top: number;\n  height: number;\n  left: number;\n  width: number;\n} {\n  const startHour = event.startTime.getHours();\n  const startMinute = event.startTime.getMinutes();\n  const endHour = event.endTime.getHours();\n  const endMinute = event.endTime.getMinutes();\n\n  const slotHeight = 48; // 每个小时的高度（像素）\n  const slotDuration = 60; // 每个时段的时长（分钟）\n\n  const top = calculateAppointmentTop(event, slotHeight, slotDuration);\n  const height = calculateAppointmentHeight(event, slotHeight, slotDuration);\n\n  // 计算事件在星期几（0=周日，1=周一...）\n  const dayOfWeek = event.startTime.getDay();\n  const dayIndex = (dayOfWeek === 0 ? 7 : dayOfWeek) - 1; // 转换为周一=0\n\n  const left = (dayIndex * 100) / 7; // 百分比\n  const width = 100 / 7; // 百分比\n\n  return { top, height, left, width };\n}\n\n// 渲染事件\nprivate renderEvent(event: Event) {\n  const position = this.calculateEventPosition(event);\n  const dslType = this.getDSLType(event.type);\n  const rendered = dslType\n    ? this.dslRuntime.render(event, event.type)\n    : { title: event.title, color: '#4285f4' };\n\n  return (\n    \u003cdiv\n      class=\"week-view-event\"\n      style={{\n        top: `${position.top}px`,\n        height: `${position.height}px`,\n        left: `${position.left}%`,\n        width: `${position.width}%`,\n        backgroundColor: rendered.color,\n      }}\n      onClick={() => this.handleEventClick(event)}\n    >\n      {rendered.title}\n    \u003c/div>\n  );\n}\n```\n"},"source-b03f4f419b7ae678-s28":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:812-815`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 3.2 DayView 事件渲染\n\n类似 WeekView，但只显示单天的事件。\n"},"source-b03f4f419b7ae678-s29":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:816-819`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 3.3 MonthView 事件渲染\n\n在月份视图中，事件显示为日期上的小点或标签。\n"},"source-b03f4f419b7ae678-s30":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:820-856`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 4. 事件数据验证\n\n**验证架构**：\n\n- Event Data Model 定义了 Event 接口结构\n- `@calenderjs/event-model` 提供 `EventValidator` 用于验证 Event 数据是否符合 Event Data Model\n- DSL 验证器用于验证业务规则（如字段值、跨字段验证等）\n\n```typescript\n// 使用 Event Data Model 的验证器\nimport { EventValidator } from \"@calenderjs/event-model\";\nimport { EventDSLRuntime } from \"@calenderjs/event-dsl\";\n\nconst eventValidator = new EventValidator();\nconst dslRuntime = new EventDSLRuntime(ast);\n\n// 1. 验证 Event 数据是否符合 Event Data Model\nconst baseResult = eventValidator.validateBase(event);\nif (!baseResult.valid) {\n  return baseResult;\n}\n\n// 2. 使用 DSL 验证器验证业务规则\nconst dslResult = dslRuntime.validate(event, context);\nif (!dslResult.valid) {\n  return dslResult;\n}\n\n// 3. 验证时间逻辑\nconst timeResult = eventValidator.validateTimeLogic(event);\nif (!timeResult.valid) {\n  return timeResult;\n}\n\nreturn { valid: true, errors: [] };\n```\n"},"source-b03f4f419b7ae678-s31":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:857-858`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 实施计划\n"},"source-b03f4f419b7ae678-s32":{"body":"来源：`.spec/rfc/0011-event-data-model-integration.md:859-883`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 阶段一：Event 数据模型规范定义\n\n**步骤 1.1**: 更新 Event 接口文档\n\n- 文件：`packages/event-model/src/Event.ts`\n- 添加详细的注释说明 Event.data 字段与 DSL 的关系\n- ✅ 完成标准：注释完整，类型定义清晰\n- ✅ 测试要求：100% 覆盖率，所有测试通过\n- ✅ 状态：已完成\n\n**步骤 1.2**: 创建 Event 数据模型规范文档\n\n- 文件：`docs/event-data-model.md`\n- 详细说明 Event 接口与 DSL 的映射关系\n- ✅ 完成标准：文档完整，示例清晰\n\n**步骤 1.3**: 实现 JSON Schema 验证功能\n\n- 文件：`packages/event-model/src/validators/EventValidator.ts`\n
