ce\n\n# RFC-0002: Event DSL\n\n**状态**: Implemented (核心) / In Progress (集成)  \n**创建日期**: 2024-12-19  \n**最后更新**: 2026-03-15  \n**作者**: WSX Team  \n**关联 RFC**: RFC-0005, RFC-0009, RFC-0011, RFC-0012\n\n## 摘要\n\n设计并实现 Event DSL（领域特定语言），用于声明式定义日历事件类型。DSL 通过文本语法定义事件的字段结构、验证规则、显示配置和行为约束，编译后生成运行时数据模型，供 Calendar 组件进行 DSL 驱动的渲染和验证。\n\n**核心定位**：\n\n- **文本 DSL**：拥有独立的语法（由 PEG.js/Peggy 解析），非 TypeScript 配置对象\n- **编译时/运行时分离**：`@calenderjs/event-dsl` 是开发/编译时工具，`@calenderjs/event-runtime` 是生产依赖\n- **Event 是技术模型，Appointment 是业务概念**：DSL 定义业务类型（如 meeting、vacation），编译后生成符合 `Event` 接口的数据\n\n## 术语约定\n\n| 术语                             | 含义                                                           |\n| -------------------------------- | -------------------------------------------------------------- |\n| **Event**                        | 技术数据模型（`@calenderjs/event-model` 中定义的接口）         |\n| **Appointment / Holiday / Task** | 业务概念，都是 Event 的具体类型（`Event.type = \"meeting\"` 等） |\n| **Event DSL**                    | 用于声明式定义事件类型的领域特定语言                           |\n| **EventTypeAST**                 | DSL 文本解析后的抽象语法树                                     |\n| **EventTypeDataModel**           | AST 编译后的运行时数据模型                                     |\n| **EventRuntime**                 | 使用 DataModel 执行验证/渲染/权限检查的运行时实例              |\n\n## 动机\n\n传统的事件数据模型（如 `Event` 接口）提供了灵活的基础结构，但无法优雅地表达不同业务领域的规则。Event DSL 解决以下问题：\n\n- **声明式定义**：通过 DSL 语法声明事件类型的字段、验证、显示和行为规则\n- **业务逻辑分离**：将业务规则从组件逻辑中分离，Calendar 组件不硬编码任何业务逻辑\n- **类型安全**：从 DSL 生成 TypeScript 类型定义和 JSON Schema，提供开发时和运行时双重保障\n- **可扩展性**：添加新事件类型只需写一段 DSL 文本，无需修改核心代码\n\n## 架构概览\n\n### 编译管线\n\n```\nDSL 文本                    ← 用户/业务服务编写\n  ↓ parseEventDSL()         ← @calenderjs/event-dsl (开发时)\nEventTypeAST                ← 抽象语法树（内存表示）\n  ↓ EventDSLCompiler        ← @calenderjs/event-dsl (开发时)\n  ├→ EventDSLDataModel      ← 运行时数据模型\n  ├→ JSON Schema            ← generateJSONSchema() - 校验 Event.data 结构\n  └→ TypeScript 类型        ← generateTypeScript() - IDE 类型补全\n       ↓\nEventRuntime(dataModel)     ← @calenderjs/event-runtime (生产时)\n  ├→ validate(event, ctx)   → ValidationResult\n  ├→ render(event, ctx)     → RenderedEvent\n  └→ canPerform(action, event, user) → boolean\n```\n\n### 包职责\n\n| 包                          | 角色                                      | 运行时依赖          |\n| --------------------------- | ----------------------------------------- | ------------------- |\n| `@calenderjs/event-model`   | Event 接口（SSOT）、JSON Schema、基础验证 | 是（ajv）           |\n| `@calenderjs/event-dsl`     | DSL 解析器、编译器、代码生成器            | 否（仅开发/构建时） |\n| `@calenderjs/event-runtime` | EventRuntime（验证、渲染、权限）          | 是                  |\n\n```\nevent-dsl ──depends──→ event-model ←──depends── event-runtime\n (dev)                   (SSOT)                   (prod)\n```\n\n## DSL 语法设计\n\n### 文本语法\n\nDSL 采用声明式文本语法，由 Peggy（PEG.js 继任）解析。语法设计面向非程序员可读。\n\n#### 最小示例\n\n```\ntype: meeting\nname: \"会议\"\nfields:\n  - title: string\n```\n\n#### 完整示例\n\n```\ntype: meeting\nname: \"团队会议\"\ndescription: \"标准团队会议类型\"\n\nfields:\n  - attendees: list of email, required\n  - location: string\n  - priority: enum(low, normal, high), default: \"normal\"\n  - agenda: text\n\nvalidate:\n  attendees.count between 1 and 50\n  startTime.hour >= 9\n  startTime.hour \u003c= 18\n  title.length >= 1\n  title.length \u003c= 100\n  no conflict with other events\n  when priority is high:\n    attendees.count >= 5\n\ndisplay:\n  color: \"#4285f4\"\n  icon: \"meeting\"\n  color:\n    when priority is high: \"#ea4335\"\n    else: \"#34a853\"\n  title: \"{title}\"\n  description: \"{attendees.count} attendees\"\n\nbehavior:\n  editable: true\n  draggable: true\n  resizable: false\n  editable: role is admin or role is manager\n\nconstraints:\n  timeZone: \"Asia/Shanghai\"\n  timePrecision: 15 minutes\n  minAdvanceTime: 1 hour\n  maxAdvanceTime: 30 days\n  allowCrossDay: true\n  allowedHours: 9 to 18\n\nrecurring:\n  frequency: weekly\n  interval: 2\n  daysOfWeek: [1, 3, 5]\n  endDate: \"2025-12-31\"\n```\n\n### Section 说明\n\n| Section       | 作用                                   | 必需 |\n| ------------- | -------------------------------------- | ---- |\n| `type`        | 事件类型标识符（映射到 `Event.type`）  | 是   |\n| `name`        | 类型显示名称                           | 是   |\n| `description` | 类型描述                               | 否   |\n| `fields`      | 字段定义（映射到 `Event.data` 中的键） | 是   |\n| `validate`    | 验证规则（运行时校验）                 | 否   |\n| `display`     | 显示配置（颜色、图标、标题/描述模板）  | 否   |\n| `behavior`    | 行为规则（可编辑、可拖拽、权限控制）   | 否   |\n| `constraints` | 时间约束（时区、精度、提前量、跨天等） | 否   |\n| `recurring`   | 重复规则（频率、间隔、排除日期等）     | 否   |\n\n### 字段类型\n\n| 类型        | 语法                      | Event.data 中的值    |\n| ----------- | ------------------------- | -------------------- |\n| `string`    | `- name: string`          | `string`             |\n| `number`    | `- count: number`         | `number`             |\n| `boolean`   | `- active: boolean`       | `boolean`            |\n| `email`     | `- contact: email`        | `string`（格式校验） |\n| `text`      | `- notes: text`           | `string`（长文本）   |\n| `list of T` | `- tags: list of string`  | `T[]`                |\n| `enum(...)` | `- status: enum(a, b, c)` | `string`（受限值）   |\n\n**字段修饰符**：`, required`、`, default: \"value\"`、`, min: n`、`, max: n`\n\n### 验证表达式\n\n| 语法                                | 含义         |\n| ----------------------------------- | ------------ |\n| `field between min and max`         | 范围检查     |\n| `field >= value` / `field \u003c= value` | 比较运算     |\n| `field in [\"a\", \"b\", \"c\"]`          | 枚举检查     |\n| `no conflict with other events`     | 时间冲突检测 |\n| `when condition: rules`             | 条件验证     |\n| `not expr`                          | 逻辑否定     |\n| `expr and expr` / `expr or expr`    | 逻辑组合     |\n\n### 显示规则\n\n- 静态值：`color: \"#4285f4\"`\n- 条件值：`color: when priority is high: \"#ea4335\" else: \"#34a853\"`\n- 模板值：`title: \"{title}\"`、`description: \"{attendees.count} attendees\"`\n\n## AST 类型定义\n\nDSL 文本解析后生成以下 AST 结构：\n\n```typescript\ninterface EventTypeAST {\n  type: string;\n  name: string;\n  description?: string;\n  fields: FieldDefinition[];\n  validate: ValidationRule[];\n  display: DisplayRule[];\n  behavior: BehaviorRule[];\n  constraints?: ConstraintRule[];\n  recurring?: RecurringDefinition;\n}\n\ninterface FieldDefinition {\n  name: string;\n  type: FieldType;\n  required?: boolean;\n  default?: any;\n  min?: number;\n  max?: number;\n}\n\ntype FieldType =\n  | \"string\"\n  | \"number\"\n  | \"boolean\"\n  | \"email\"\n  | \"text\"\n  | { type: \"list\"; itemType: FieldType }\n  | { type: \"enum\"; values: string[] };\n```\n\n完整 AST 类型见 `packages/event-dsl/src/ast/types.ts`。\n\n## 编译器输出\n\n### EventDSLDataModel\n\n编译器将 AST 转换为运行时可用的 DataModel：\n\n```typescript\ninterface EventTypeDataModel {\n  id: string;\n  name: string;\n  extraSchema: JSONSchema; // 由 fields 生成，校验 Event.data 结构\n  validationRules: ValidationRule[];\n  displayRules: DisplayRule[];\n  behaviorRules: BehaviorRule[];\n  constraints: ConstraintRule[];\n  recurring?: RecurringDefinition;\n  validator: ValidatorFunction;\n  renderer: RendererFunction;\n  behavior: BehaviorConfig;\n}\n\ninterface EventDSLDataModel {\n  types: EventTypeDataModel[];\n  validators: EventValidatorDataModel[];\n}\n```\n\n### JSON Schema 生成\n\n从 fields 生成 Draft-07 JSON Schema，用于校验 `Event.data` 的结构：\n\n```json\n{\n  \"$schema\": \"http://json-schema.org/draft-07/schema#\",\n  \"type\": \"object\",\n  \"title\": \"会议\",\n  \"properties\": {\n    \"attendees\": {\n      \"type\": \"array\",\n      \"items\": { \"type\": \"string\", \"format\": \"email\" },\n      \"minItems\": 1,\n      \"maxItems\": 50\n    },\n    \"location\": { \"type\": \"string\" },\n    \"priority\": {\n      \"type\": \"string\",\n      \"enum\": [\"low\", \"normal\", \"high\"],\n      \"default\": \"normal\"\n    }\n  },\n  \"required\": [\"attendees\"],\n  \"additionalProperties\": false\n}\n```\n\n### TypeScript 类型生成\n\n从 fields 生成 TypeScript 接口，提供 IDE 类型补全：\n\n```typescript\nexport interface MeetingData {\n  attendees: string[];\n  location?: string;\n  priority?: \"low\" | \"normal\" | \"high\";\n  agenda?: string;\n}\n```\n\n## DSL 与 Event 数据模型的映射\n\nDSL 定义的字段存储在 `Event.data` 中（类型 `Record\u003cstring, any>`）。\n\n### 映射关系\n\n| DSL Section     | Event 字段                         | 说明             |\n| --------------- | ---------------------------------- | ---------------- |\n| `type`          | `Event.type`                       | 事件类型标识符   |\n| `fields`        | `Event.data`                       | 业务字段数据容器 |\n| `display.color` | `Event.color`（运行时渲染后）      | 显示颜色         |\n| `display.icon`  | `Event.icon`（运行时渲染后）       | 显示图标         |\n| `display.title` | 覆盖 `Event.title`（运行时渲染后） | 显示标题         |\n\n### Event 示例\n\n```typescript\nconst meetingEvent: Event = {\n  id: \"evt-001\",\n  type: \"meeting\", // ← DSL type\n  title: \"团队会议\",\n  startTime: new Date(\"2026-01-15T10:00:00\"),\n  endTime: new Date(\"2026-01-15T11:00:00\"),\n  color: \"#4285f4\",\n  data: {\n    // ← DSL fields 存放于此\n    attendees: [\"alice@co.com\", \"bob@co.com\"],\n    location: \"会议室 A\",\n    priority: \"high\",\n    agenda: \"讨论 Q1 计划\",\n  },\n};\n```\n\n## EventRuntime 使用\n\nEventRuntime 是 DSL 的生产时消费者，提供验证、渲染、权限检查三个核心能力。\n\n```typescript\n// 公共 API\nconstructor(dataModel: EventTypeDataModel)\ngetDataModel(): EventTypeDataModel          // 只读获取 DataModel\nvalidate(event, context) → ValidationResult\nrender(event, context)   → RenderedEvent\ncanPerform(action, event, user) → boolean\n```\n\n```typescript\nimport { EventDSLCompiler } from \"@calenderjs/event-dsl\";\nimport { EventRuntime } from \"@calenderjs/event-runtime\";\n\nconst compiler = new EventDSLCompiler();\nconst dataModel = compiler.compileDSL(dslText);\nconst runtime = new EventRuntime(dataModel.types[0]);\n\n// 验证\nconst result = runtime.validate(event, { existingEvents, user });\n// → { valid: true } 或 { valid: false, errors: [...] }\n\n// 渲染\nconst rendered = runtime.render(event, { user });\n// → { title: \"团队会议\", color: \"#ea4335\", description: \"2 attendees\", icon: \"meeting\" }\n\n// 权限\nconst canEdit = runtime.canPerform(\"edit\", event, user);\n// → true/false（基于 behavior 规则和用户角色）\n```\n\n### 字段解析路径\n\nEventRuntime 通过以下路径解析验证表达式中的字段：\n\n| 路径              | 解析为                                                                           |\n| ----------------- | -------------------------------------------------------------------------------- |\n| `title`           | `event.title`                                                                    |\n| `startTime.hour`  | 按 [RFC-0014](0014-event-runtime-timezone-field-semantics.md) 的事件时区语义解析 |\n| `attendees.count` | `event.data.attendees.length`                                                    |\n| `priority`        | `event.data.priority`                                                            |\n| `user.role`       | `context.user.role`                                                              |\n| `duration`        | `endTime - startTime`（分钟）                                                    |\n\n## 包结构\n\n```\npackages/event-dsl/                    ← 开发/编译时工具\n├── src/\n│   ├── event-dsl.pegjs                ← PEG 语法定义\n│   ├── parser/                        ← 解析器（PEG 生成 + 后处理）\n│   ├── ast/types.ts                   ← AST 类型定义\n│   ├── compiler.ts                    ← EventDSLCompiler\n│   ├── generators/\n│   │   ├── json-schema.ts             ← generateJSONSchema()\n│   │   └── typescript.ts              ← generateTypeScript()\n│   └── index.ts\n├── package.json                       ← deps: event-model; devDeps: peggy\n└── vitest.config.ts\n\npackages/event-runtime/                ← 生产时依赖\n├── src/\n│   ├── EventRuntime.ts                ← validate/render/canPerform\n│   └── index.ts\n├── package.json                       ← deps: event-model, core\n└── vitest.config.ts\n\npackages/event-model/                  ← SSOT：Event 接口 + 基础验证\n├── src/\n│   ├── Event.ts                       ← Event, RecurringRule, EventMetadata\n│   ├── EventTypeDataModel.ts          ← EventTypeDataModel, EventDSLDataModel\n│   ├── runtime-types.ts               ← ValidationResult, RenderedEvent, BehaviorConfig\n│   ├── validator.ts                   ← EventValidator, EVENT_BASE_SCHEMA\n│   └── types.ts                       ← JSONSchema 接口\n└── package.json                       ← deps: ajv\n```\n\n## 实现状态\n\n| 模块                    | 状态      | 说明                                      |\n| ----------------------- | --------- | ----------------------------------------- |\n| PEG.js 语法 + 解析器    | ✅ 完成   | 支持全部 sections 和语法                  |\n| AST 类型定义            | ✅ 完成   | EventTypeAST + 子类型                     |\n| EventDSLCompiler        | ✅ 完成   | DSL → DataModel                           |\n| JSON Schema 生成        | ✅ 完成   | fields → Draft-07 Schema                  |\n| TypeScript 生成         | ✅ 完成   | fields → TS interface                     |\n| EventRuntime            | ✅ 完成   | validate / render / canPerform            |\n| EventDataGenerator      | ❌ 未实现 | 从 DSL 生成 Event 数据实例（见 RFC-0011） |\n| Calendar 集成           | ❌ 未实现 | Calendar 接受 EventRuntime（见 RFC-0005） |\n| `extra` → `data` 重命名 | ❌ 待执行 | 全局字段重命名                            |\n\n## 未解决问题\n\n1. **DSL 版本管理**：DSL 定义的版本迁移策略\n2. **表达式安全**：自定义表达式的沙箱执行\n3. **性能优化**：大量事件类型时的编译和验证性能\n4. **DSL 编辑器**：Monaco Editor 集成的语法高亮和补全\n\n---\n\n_本 RFC 定义了 Event DSL 的语法、编译管线和运行时架构。DSL 允许业务服务通过声明式文本定义事件类型，编译后供 Calendar 组件进行 DSL 驱动的渲染、验证和权限控制。_"},"source-e30a5fa87ca32895-s1":{"body":"来源：`.spec/rfc/0002-event-dsl.md:1-8`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC-0002: Event DSL\n\n**状态**: Implemented (核心) / In Progress (集成)  \n**创建日期**: 2024-12-19  \n**最后更新**: 2026-03-15  \n**作者**: WSX Team  \n**关联 RFC**: RFC-0005, RFC-0009, RFC-0011, RFC-0012\n"},"source-e30a5fa87ca32895-s2":{"body":"来源：`.spec/rfc/0002-event-dsl.md:9-18`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 摘要\n\n设计并实现 Event DSL（领域特定语言），用于声明式定义日历事件类型。DSL 通过文本语法定义事件的字段结构、验证规则、显示配置和行为约束，编译后生成运行时数据模型，供 Calendar 组件进行 DSL 驱动的渲染和验证。\n\n**核心定位**：\n\n- **文本 DSL**：拥有独立的语法（由 PEG.js/Peggy 解析），非 TypeScript 配置对象\n- **编译时/运行时分离**：`@calenderjs/event-dsl` 是开发/编译时工具，`@calenderjs/event-runtime` 是生产依赖\n- **Event 是技术模型，Appointment 是业务概念**：DSL 定义业务类型（如 meeting、vacation），编译后生成符合 `Event` 接口的数据\n"},"source-e30a5fa87ca32895-s3":{"body":"来源：`.spec/rfc/0002-event-dsl.md:19-29`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 术语约定\n\n| 术语                             | 含义                                                           |\n| -------------------------------- | -------------------------------------------------------------- |\n| **Event**                        | 技术数据模型（`@calenderjs/event-model` 中定义的接口）         |\n| **Appointment / Holiday / Task** | 业务概念，都是 Event 的具体类型（`Event.type = \"meeting\"` 等） |\n| **Event DSL**                    | 用于声明式定义事件类型的领域特定语言                           |\n| **EventTypeAST**                 | DSL 文本解析后的抽象语法树                                     |\n| **EventTypeDataModel**           | AST 编译后的运行时数据模型                                     |\n| **EventRuntime**                 | 使用 DataModel 执行验证/渲染/权限检查的运行时实例              |\n"},"source-e30a5fa87ca32895-s4":{"body":"来源：`.spec/rfc/0002-event-dsl.md:30-38`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 动机\n\n传统的事件数据模型（如 `Event` 接口）提供了灵活的基础结构，但无法优雅地表达不同业务领域的规则。Event DSL 解决以下问题：\n\n- **声明式定义**：通过 DSL 语法声明事件类型的字段、验证、显示和行为规则\n- **业务逻辑分离**：将业务规则从组件逻辑中分离，Calendar 组件不硬编码任何业务逻辑\n- **类型安全**：从 DSL 生成 TypeScript 类型定义和 JSON Schema，提供开发时和运行时双重保障\n- **可扩展性**：添加新事件类型只需写一段 DSL 文本，无需修改核心代码\n"},"source-e30a5fa87ca32895-s5":{"body":"来源：`.spec/rfc/0002-event-dsl.md:39-40`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 架构概览\n"},"source-e30a5fa87ca32895-s6":{"body":"来源：`.spec/rfc/0002-event-dsl.md:41-57`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 编译管线\n\n```\nDSL 文本                    ← 用户/业务服务编写\n  ↓ parseEventDSL()         ← @calenderjs/event-dsl (开发时)\nEventTypeAST                ← 抽象语法树（内存表示）\n  ↓ EventDSLCompiler        ← @calenderjs/event-dsl (开发时)\n  ├→ EventDSLDataModel      ← 运行时数据模型\n  ├→ JSON Schema            ← generateJSONSchema() - 校验 Event.data 结构\n  └→ TypeScript 类型        ← generateTypeScript() - IDE 类型补全\n       ↓\nEventRuntime(dataModel)     ← @calenderjs/event-runtime (生产时)\n  ├→ validate(event, ctx)   → ValidationResult\n  ├→ render(event, ctx)     → RenderedEvent\n  └→ canPerform(action, event, user) → boolean\n```\n"},"source-e30a5fa87ca32895-s7":{"body":"来源：`.spec/rfc/0002-event-dsl.md:58-70`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 包职责\n\n| 包                          | 角色                                      | 运行时依赖          |\n| --------------------------- | ----------------------------------------- | ------------------- |\n| `@calenderjs/event-model`   | Event 接口（SSOT）、JSON Schema、基础验证 | 是（ajv）           |\n| `@calenderjs/event-dsl`     | DSL 解析器、编译器、代码生成器            | 否（仅开发/构建时） |\n| `@calenderjs/event-runtime` | EventRuntime（验证、渲染、权限）          | 是                  |\n\n```\nevent-dsl ──depends──→ event-model ←──depends── event-runtime\n (dev)                   (SSOT)                   (prod)\n```\n"},"source-e30a5fa87ca32895-s8":{"body":"来源：`.spec/rfc/0002-event-dsl.md:71-72`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## DSL 语法设计\n"},"source-e30a5fa87ca32895-s9":{"body":"来源：`.spec/rfc/0002-event-dsl.md:73-76`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 文本语法\n\nDSL 采用声明式文本语法，由 Peggy（PEG.js 继任）解析。语法设计面向非程序员可读。\n"},"source-e30a5fa87ca32895-s10":{"body":"来源：`.spec/rfc/0002-event-dsl.md:77-85`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 最小示例\n\n```\ntype: meeting\nname: \"会议\"\nfields:\n  - title: string\n```\n"},"source-e30a5fa87ca32895-s11":{"body":"来源：`.spec/rfc/0002-event-dsl.md:86-138`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 完整示例\n\n```\ntype: meeting\nname: \"团队会议\"\ndescription: \"标准团队会议类型\"\n\nfields:\n  - attendees: list of email, required\n  - location: string\n  - priority: enum(low, normal, high), default: \"normal\"\n  - agenda: text\n\nvalidate:\n  attendees.count between 1 and 50\n  startTime.hour >= 9\n  startTime.hour \u003c= 18\n  title.length >= 1\n  title.length \u003c= 100\n  no conflict with other events\n  when priority is high:\n    attendees.count >= 5\n\ndisplay:\n  color: \"#4285f4\"\n  icon: \"meeting\"\n  color:\n    when priority is high: \"#ea4335\"\n    else: \"#34a853\"\n  title: \"{title}\"\n  description: \"{attendees.count} attendees\"\n\nbehavior:\n  editable: true\n  draggable: true\n  resizable: false\n  editable: role is admin or role is manager\n\nconstraints:\n  timeZone: \"Asia/Shanghai\"\n  timePrecision: 15 minutes\n  minAdvanceTime: 1 hour\n  maxAdvanceTime: 30 days\n  allowCrossDay: true\n  allowedHours: 9 to 18\n\nrecurring:\n  frequency: weekly\n  interval: 2\n  daysOfWeek: [1, 3, 5]\n  endDate: \"2025-12-31\"\n```\n"},"source-e30a5fa87ca32895-s12":{"body":"来源：`.spec/rfc/0002-event-dsl.md:139-152`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Section 说明\n\n| Section       | 作用                                   | 必需 |\n| ------------- | -------------------------------------- | ---- |\n| `type`        | 事件类型标识符（映射到 `Event.type`）  | 是   |\n| `name`        | 类型显示名称                           | 是   |\n| `description` | 类型描述                               | 否   |\n| `fields`      | 字段定义（映射到 `Event.data` 中的键） | 是   |\n| `validate`    | 验证规则（运行时校验）                 | 否   |\n| `display`     | 显示配置（颜色、图标、标题/描述模板）  | 否   |\n| `behavior`    | 行为规则（可编辑、可拖拽、权限控制）   | 否   |\n| `constraints` | 时间约束（时区、精度、提前量、跨天等） | 否   |\n| `recurring`   | 重复规则（频率、间隔、排除日期等）     | 否   |\n"},"source-e30a5fa87ca32895-s13":{"body":"来源：`.spec/rfc/0002-event-dsl.md:153-166`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 字段类型\n\n| 类型        | 语法                      | Event.data 中的值    |\n| ----------- | ------------------------- | -------------------- |\n| `string`    | `- name: string`          | `string`             |\n| `number`    | `- count: number`         | `number`             |\n| `boolean`   | `- active: boolean`       | `boolean`            |\n| `email`     | `- contact: email`        | `string`（格式校验） |\n| `text`      | `- notes: text`           | `string`（长文本）   |\n| `list of T` | `- tags: list of string`  | `T[]`                |\n| `enum(...)` | `- status: enum(a, b, c)` | `string`（受限值）   |\n\n**字段修饰符**：`, required`、`, default: \"value\"`、`, min: n`、`, max: n`\n"},"source-e30a5fa87ca32895-s14":{"body":"来源：`.spec/rfc/0002-event-dsl.md:167-178`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 验证表达式\n\n| 语法                                | 含义         |\n| ----------------------------------- | ------------ |\n| `field between min and max`         | 范围检查     |\n| `field >= value` / `field \u003c= value` | 比较运算     |\n| `field in [\"a\", \"b\", \"c\"]`          | 枚举检查     |\n| `no conflict with other events`     | 时间冲突检测 |\n| `when condition: rules`             | 条件验证     |\n| `not expr`                          | 逻辑否定     |\n| `expr and expr` / `expr or expr`    | 逻辑组合     |\n"},"source-e30a5fa87ca32895-s15":{"body":"来源：`.spec/rfc/0002-event-dsl.md:179-184`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 显示规则\n\n- 静态值：`color: \"#4285f4\"`\n- 条件值：`color: when priority is high: \"#ea4335\" else: \"#34a853\"`\n- 模板值：`title: \"{title}\"`、`description: \"{attendees.count} attendees\"`\n"},"source-e30a5fa87ca32895-s16":{"body":"来源：`.spec/rfc/0002-event-dsl.md:185-222`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## AST 类型定义\n\nDSL 文本解析后生成以下 AST 结构：\n\n```typescript\ninterface EventTypeAST {\n  type: string;\n  name: string;\n  description?: string;\n  fields: FieldDefinition[];\n  validate: ValidationRule[];\n  display: DisplayRule[];\n  behavior: BehaviorRule[];\n  constraints?: ConstraintRule[];\n  recurring?: RecurringDefinition;\n}\n\ninterface FieldDefinition {\n  name: string;\n  type: FieldType;\n  required?: boolean;\n  default?: any;\n  min?: number;\n  max?: number;\n}\n\ntype FieldType =\n  | \"string\"\n  | \"number\"\n  | \"boolean\"\n  | \"email\"\n  | \"text\"\n  | { type: \"list\"; itemType: FieldType }\n  | { type: \"enum\"; values: string[] };\n```\n\n完整 AST 类型见 `packages/event-dsl/src/ast/types.ts`。\n"},"source-e30a5fa87ca32895-s17":{"body":"来源：`.spec/rfc/0002-event-dsl.md:223-224`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 编译器输出\n"},"source-e30a5fa87ca32895-s18":{"body":"来源：`.spec/rfc/0002-event-dsl.md:225-249`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### EventDSLDataModel\n\n编译器将 AST 转换为运行时可用的 DataModel：\n\n```typescript\ninterface EventTypeDataModel {\n  id: string;\n  name: string;\n  extraSchema: JSONSchema; // 由 fields 生成，校验 Event.data 结构\n  validationRules: ValidationRule[];\n  displayRules: DisplayRule[];\n  behaviorRules: BehaviorRule[];\n  constraints: ConstraintRule[];\n  recurring?: RecurringDefinition;\n  validator: ValidatorFunction;\n  renderer: RendererFunction;\n  behavior: BehaviorConfig;\n}\n\ninterface EventDSLDataModel {\n  types: EventTypeDataModel[];\n  validators: EventValidatorDataModel[];\n}\n```\n"},"source-e30a5fa87ca32895-s19":{"body":"来源：`.spec/rfc/0002-event-dsl.md:250-277`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### JSON Schema 生成\n\n从 fields 生成 Draft-07 JSON Schema，用于校验 `Event.data` 的结构：\n\n```json\n{\n  \"$schema\": \"http://json-schema.org/draft-07/schema#\",\n  \"type\": \"object\",\n  \"title\": \"会议\",\n  \"properties\": {\n    \"attendees\": {\n      \"type\": \"array\",\n      \"items\": { \"type\": \"string\", \"format\": \"email\" },\n      \"minItems\": 1,\n      \"maxItems\": 50\n    },\n    \"location\": { \"type\": \"string\" },\n    \"priority\": {\n      \"type\": \"string\",\n      \"enum\": [\"low\", \"normal\", \"high\"],\n      \"default\": \"normal\"\n    }\n  },\n  \"required\": [\"attendees\"],\n  \"additionalProperties\": false\n}\n```\n"},"source-e30a5fa87ca32895-s20":{"body":"来源：`.spec/rfc/0002-event-dsl.md:278-290`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### TypeScript 类型生成\n\n从 fields 生成 TypeScript 接口，提供 IDE 类型补全：\n\n```typescript\nexport interface MeetingData {\n  attendees: string[];\n  location?: string;\n  priority?: \"low\" | \"normal\" | \"high\";\n  agenda?: string;\n}\n```\n"},"source-e30a5fa87ca32895-s21":{"body":"来源：`.spec/rfc/0002-event-dsl.md:291-294`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## DSL 与 Event 数据模型的映射\n\nDSL 定义的字段存储在 `Event.data` 中（类型 `Record\u003cstring, any>`）。\n"},"source-e30a5fa87ca32895-s22":{"body":"来源：`.spec/rfc/0002-event-dsl.md:295-304`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 映射关系\n\n| DSL Section     | Event 字段                         | 说明             |\n| --------------- | ---------------------------------- | ---------------- |\n| `type`          | `Event.type`                       | 事件类型标识符   |\n| `fields`        | `Event.data`                       | 业务字段数据容器 |\n| `display.color` | `Event.color`（运行时渲染后）      | 显示颜色         |\n| `display.icon`  | `Event.icon`（运行时渲染后）       | 显示图标         |\n| `display.title` | 覆盖 `Event.title`（运行时渲染后） | 显示标题         |\n"},"source-e30a5fa87ca32895-s23":{"body":"来源：`.spec/rfc/0002-event-dsl.md:305-324`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Event 示例\n\n```typescript\nconst meetingEvent: Event = {\n  id: \"evt-001\",\n  type: \"meeting\", // ← DSL type\n  title: \"团队会议\",\n  startTime: new Date(\"2026-01-15T10:00:00\"),\n  endTime: new Date(\"2026-01-15T11:00:00\"),\n  color: \"#4285f4\",\n  data: {\n    // ← DSL fields 存放于此\n    attendees: [\"alice@co.com\", \"bob@co.com\"],\n    location: \"会议室 A\",\n    priority: \"high\",\n    agenda: \"讨论 Q1 计划\",\n  },\n};\n```\n"},"source-e30a5fa87ca32895-s24":{"body":"来源：`.spec/rfc/0002-event-dsl.md:325-358`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## EventRuntime 使用\n\nEventRuntime 是 DSL 的生产时消费者，提供验证、渲染、权限检查三个核心能力。\n\n```typescript\n// 公共 API\nconstructor(dataModel: EventTypeDataModel)\ngetDataModel(): EventTypeDataModel          // 只读获取 DataModel\nvalidate(event, context) → ValidationResult\nrender(event, context)   → RenderedEvent\ncanPerform(action, event, user) → boolean\n```\n\n```typescript\nimport { EventDSLCompiler } from \"@calenderjs/event-dsl\";\nimport { EventRuntime } from \"@calenderjs/event-runtime\";\n\nconst compiler = new EventDSLCompiler();\nconst dataModel = compiler.compileDSL(dslText);\nconst runtime = new EventRuntime(dataModel.types[0]);\n\n// 验证\nconst result = runtime.validate(event, { existingEvents, user });\n// → { valid: true } 或 { valid: false, errors: [...] }\n\n// 渲染\nconst rendered = runtime.render(event, { user });\n// → { title: \"团队会议\", color: \"#ea4335\", description: \"2 attendees\", icon: \"meeting\" }\n\n// 权限\nconst canEdit = runtime.canPerform(\"edit\", event, user);\n// → true/false（基于 behavior 规则和用户角色）\n```\n"},"source-e30a5fa87ca32895-s25":{"body":"来源：`.spec/rfc/0002-event-dsl.md:359-371`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 字段解析路径\n\nEventRuntime 通过以下路径解析验证表达式中的字段：\n\n| 路径              | 解析为                                                                           |\n| ----------------- | -------------------------------------------------------------------------------- |\n| `title`           | `event.title`                                                                    |\n| `startTime.hour`  | 按 [RFC-0014](0014-event-runtime-timezone-field-semantics.md) 的事件时区语义解析 |\n| `attendees.count` | `event.data.attendees.length`                                                    |\n| `priority`        | `event.data.priority`                                                            |\n| `user.role`       | `context.user.role`                                                              |\n| `duration`        | `endTime - startTime`（分钟）                                                    |\n"},"source-e30a5fa87ca32895-s26":{"body":"来源：`.spec/rfc/0002-event-dsl.md:372-404`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 包结构\n\n```\npackages/event-dsl/                    ← 开发/编译时工具\n├── src/\n│   ├── event-dsl.pegjs                ← PEG 语法定义\n│   ├── parser/                        ← 解析器（PEG 生成 + 后处理）\n│   ├── ast/types.ts                   ← AST 类型定义\n│   ├── compiler.ts                    ← EventDSLCompiler\n│   ├── generators/\n│   │   ├── json-schema.ts             ← generateJSONSchema()\n│   │   └── typescript.ts              ← generateTypeScript()\n│   └── index.ts\n├── package.json                       ← deps: event-model; devDeps: peggy\n└── vitest.config.ts\n\npackages/event-runtime/                ← 生产时依赖\n├── src/\n│   ├── EventRuntime.ts                ← validate/render/canPerform\n│   └── index.ts\n├── package.json                       ← deps: event-model, core\n└── vitest.config.ts\n\npackages/event-model/                  ← SSOT：Event 接口 + 基础验证\n├── src/\n│   ├── Event.ts                       ← Event, RecurringRule, EventMetadata\n│   ├── EventTypeDataModel.ts          ← EventTypeDataModel, EventDSLDataModel\n│   ├── runtime-types.ts               ← ValidationResult, RenderedEvent, BehaviorConfig\n│   ├── validator.ts                   ← EventValidator, EVENT_BASE_SCHEMA\n│   └── types.ts                       ← JSONSchema 接口\n└── package.json                       ← deps: ajv\n```\n"},"source-e30a5fa87ca32895-s27":{"body":"来源：`.spec/rfc/0002-event-dsl.md:405-418`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 实现状态\n\n| 模块                    | 状态      | 说明                                      |\n| ----------------------- | --------- | ----------------------------------------- |\n| PEG.js 语法 + 解析器    | ✅ 完成   | 支持全部 sections 和语法                  |\n| AST 类型定义            | ✅ 完成   | EventTypeAST + 子类型                     |\n| EventDSLCompiler        | ✅ 完成   | DSL → DataModel                           |\n| JSON Schema 生成        | ✅ 完成   | fields → Draft-07 Schema                  |\n| TypeScript 生成         | ✅ 完成   | fields → TS interface                     |\n| EventRuntime            | ✅ 完成   | validate / render / canP 数（基于字段定义，如 `required`、`min`、`max`）\n\n2. **JSON Schema 验证**（EventValidator，在 `@calenderjs/event-model` 包中）：\n   - 验证 Event 对象是否符合 Event 接口结构\n   - 验证 Event.extra 是否符合 JSON Schema（结构验证）\n   - 无法验证业务规则（如 `attendees.count between 1 and 50` 需要计算数组长度）\n\n3. **运行时验证**（EventRuntime，在 `@calenderjs/event-runtime` 包中）：\n   - 执行 DSL 中定义的业务规则（如 `attendees.count between 1 and 50`）\n   - 验证的是 Event 数据模型的数据（`@calenderjs/event-model` 中的 Event 对象）\n   - 需要运行时数据（event.extra.attendees.length）\n   - 需要上下文信息（context.events, context.now, context.user）\n   - 无法在编译时验证（数据是动态的）\n   - 无法通过 JSON Schema 验证（JSON Schema 只能验证结构，不能验证业务逻辑）\n\n**重要**：\n\n- 运行时**不在**数据模型包中（`@calenderjs/event-model`）\n- 运行时在 DSL 包中（`@calenderjs/event-dsl`）\n- 但运行时验证的是 Event 数据模型的数据\n\n**重要说明**：\n\n- **DSL 的主要用途**：编译成 Data Model (Event 对象，包含规则和数据)\n- **Calendar 组件**：直接使用 Event 对象（event.color, event.icon, event.title），**不需要运行时**\n- **运行时的用途**（应用层）：\n  1. **业务规则验证**：执行 DSL 中定义的业务规则（如 `attendees.count between 1 and 50`、`no conflict with other events`）\n  2. **权限检查**：检查用户是否可以执行某个操作（draggable, editable, deletable）\n  3. **动态渲染**（可选）：根据 DSL 规则动态生成显示属性（但 Event 已有 color/icon）\n\n**数据流程**：\n\n```\nDSL 文本\n  → Peggy 解析器\n  → AST\n  → EventDSLCompiler\n  → Data Model (Event 对象，包含规则和数据)\n  → Calendar 组件（直接使用）\n\n验证流程：\n1. 编译时验证（EventDSLCompiler）：验证 DSL 语法，编译成 Data Model\n2. JSON Schema 验证（EventValidator）：使用 Data Model 中的标准 JSON Schema 验证 Event 结构\n3. 运行时验证（EventRuntime）：使用 Data Model 中的业务规则验证业务逻辑（应用层使用，在 `@calenderjs/event-runtime` 包中）\n```\n\n## 安装\n\n```bash\npnpm add @calenderjs/event-dsl\n```\n\n## 快速开始\n\n### 1. 定义事件类型\n\n```typescript\nimport { EventTypeDefinition } from \"@calenderjs/event-dsl\";\n\nconst meetingType: EventTypeDefinition = {\n  id: \"meeting\",\n  name: \"会议\",\n  fields: [\n    {\n      name: \"title\",\n      type: \"string\",\n      required: true,\n      validation: [\n        { type: \"minLength\", value: 1, errorMessage: \"标题不能为空\" },\n      ],\n    },\n    {\n      name: \"attendees\",\n      type: \"array\",\n      items: { type: \"string\" },\n    },\n  ],\n  display: {\n    color: \"#4285f4\",\n    titleTemplate: \"${title}\",\n    descriptionTemplate: \"${attendees.length} 人\",\n  },\n  behavior: {\n    draggable: true,\n    minDuration: 15,\n    timeConstraints: [\n      {\n        type: \"workingHours\",\n        value: { start: \"09:00\", end: \"18:00\" },\n        errorMessage: \"会议只能在工作时间内安排\",\n      },\n    ],\n  },\n};\n```\n\n### 2. 编译 DSL\n\n```typescript\nimport { EventDSLCompiler } from \"@calenderjs/event-dsl\";\n\nconst dsl: EventDSL = {\n  types: [meetingType],\n};\n\nconst compiler = new EventDSLCompiler();\nconst compiled = compiler.compile(dsl);\n```\n\n### 3. 使用编译后的 Data Model\n\n```typescript\nimport type { Event } from \"@calenderjs/event-model\";\n\n// Data Model 是 Event 对象，包含规则和数据\n// compiled.types[0] 是 CompiledType (Data Model)\nconst dataModel = compiled.types[0];\n\n// Data Model 包含：\n// - extraSchema: JSON Schema (用于验证 Event.extra 结构)\n// - validationRules: 业务规则 (用于验证业务逻辑)\n// - validator, renderer, behavior 等\n```\n\n### 4. 验证 Event 对象\n\n```typescript\nimport { EventValidator } from \"@calenderjs/event-model\";\nimport { EventRuntime } from \"@calenderjs/event-runtime\";\nimport { EventDSLCompiler } from \"@calenderjs/event-dsl\";\n\n// 使用 Event Data Model 验证器验证基础结构\nconst eventValidator = new EventValidator();\nconst baseValidation = eventValidator.validateBase(event);\n\n// 使用运行时验证业务规则\nconst compiler = new EventDSLCompiler();\nconst dataModel = compiler.compileFromAST([ast]);\nconst runtime = new EventRuntime(dataModel.types[0]);\nconst runtimeValidation = runtime.validate(event, context);\n```\n\n## API\n\n### EventDSLCompiler\n\n编译 DSL 定义，生成可执行的验证器和渲染器。\n\n### EventRuntime\n\n运行时系统，使用编译后的 Data Model 进行验证、渲染和行为配置查询。\n\n## 更多示例\n\n查看 `docs/examples/appointment-dsl-examples.ts` 获取更多示例。"},"source-e993807c6fff0101-s1":{"body":"来源：`packages/event-dsl/README.md:1-73`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示 据)\n  → Calendar 组件（直接使用）\n\n验证流程：\n1. 编译时验证（EventDSLCompiler）：验证 DSL 语法，编译成 Data Model\n2. JSON Schema 验证（EventValidator）：使用 Data Model 中的标准 JSON Schema 验证 Event 结构\n3. 运行时验证（EventRuntime）：使用 Data Model 中的业务规则验证业务逻辑（应用层使用，在 `@calenderjs/event-runtime` 包中）\n```\n"},"source-e993807c6fff0101-s2":{"body":"来源：`packages/event-dsl/README.md:74-79`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 安装\n\n```bash\npnpm add @calenderjs/event-dsl\n```\n"},"source-e993807c6fff0101-s3":{"body":"来源：`packages/event-dsl/README.md:80-81`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 快速开始\n"},"source-e993807c6fff0101-s4":{"body":"来源：`packages/event-dsl/README.md:82-123`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 1. 定义事件类型\n\n```typescript\nimport { EventTypeDefinition } from \"@calenderjs/event-dsl\";\n\nconst meetingType: EventTypeDefinition = {\n  id: \"meeting\",\n  name: \"会议\",\n  fields: [\n    {\n      name: \"title\",\n      type: \"string\",\n      required: true,\n      validation: [\n        { type: \"minLength\", value: 1, errorMessage: \"标题不能为空\" },\n      ],\n    },\n    {\n      name: \"attendees\",\n      type: \"array\",\n      items: { type: \"string\" },\n    },\n  ],\n  display: {\n    color: \"#4285f4\",\n    titleTemplate: \"${title}\",\n    descriptionTemplate: \"${attendees.length} 人\",\n  },\n  behavior: {\n    draggable: true,\n    minDuration: 15,\n    timeConstraints: [\n      {\n        type: \"workingHours\",\n        value: { start: \"09:00\", end: \"18:00\" },\n        errorMessage: \"会议只能在工作时间内安排\",\n      },\n    ],\n  },\n};\n```\n"},"source-e993807c6fff0101-s5":{"body":"来源：`packages/event-dsl/README.md:124-136`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 语义核验，不代表代码有误。\n\n### EventDSLCompiler\n\n编译 DSL 定义，生成可执行的验证器和渲染器。\n"},"source-e993807c6fff0101-s10":{"body":"来源：`packages/event-dsl/README.md:176-179`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### EventRuntime\n\n运行时系统，使用编译后的 Data Model 进行验证、渲染和行为配置查询。\n"},"source-e993807c6fff0101-s11":{"body":"来源：`packages/event-dsl/README.md:180-182`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 更多示例\n\n查看 `docs/examples/appointment-dsl-examples.ts` 获取更多示例。"},"folder:reference:packages/react":{"body":"# packages/react\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-3dae6d110b675ef3":{"body":"# packages/react/README.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：docs/llm-guide.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# @calenderjs/react\n\nReact wrapper for `@calenderjs/calendar` Web Component.\n\n## 安装\n\n```bash\npnpm add @calenderjs/react @calenderjs/calendar\n```\n\n本包仅封装日历 Web Component（`Calendar`）与布局辅助（`ResizableSplitter`）。Event DSL 编辑器请用独立包 `@calenderjs/react-event-editor`。\n\n## 使用方式\n\n### 基础使用\n\n```tsx\nimport { Calendar } from \"@calenderjs/react\";\n\nfunction App() {\n  return \u003cCalendar view=\"month\" date=\"2024-12-30\" />;\n}\n```\n\n### 使用事件回调\n\n```tsx\nimport { Calendar } from \"@calenderjs/react\";\n\nfunction App() {\n  const handleDateChange = (e: CustomEvent\u003c{ date: Date }>) => {\n    console.log(\"Date changed:\", e.detail.date);\n  };\n\n  const handleViewChange = (\n    e: CustomEvent\u003c{ view: \"month\" | \"week\" | \"day\" }>,\n  ) => {\n    console.log(\"View changed:\", e.detail.view);\n  };\n\n  return (\n    \u003cCalendar\n      view=\"month\"\n      date={new Date()}\n      onDateChange={handleDateChange}\n      onViewChange={handleViewChange}\n    />\n  );\n}\n```\n\n### 使用 ref 控制组件\n\n```tsx\nimport { Calendar, CalendarRef } from \"@calenderjs/react\";\nimport { useRef } from \"react\";\n\nfunction App() {\n  const calendarRef = useRef\u003cCalendarRef>(null);\n\n  const handleGoToToday = () => {\n    calendarRef.current?.goToToday();\n  };\n\n  const handleSetView = (view: \"month\" | \"week\" | \"day\") => {\n    calendarRef.current?.setView(view);\n  };\n\n  return (\n    \u003cdiv>\n      \u003cbutton onClick={handleGoToToday}>今天\u003c/button>\n      \u003cbutton onClick={() => handleSetView(\"week\")}>周视图\u003c/button>\n      \u003cCalendar ref={calendarRef} />\n    \u003c/div>\n  );\n}\n```\n\n### 设置事件数据\n\n```tsx\nimport { Calendar } from \"@calenderjs/react\";\nimport type { Event } from \"@calenderjs/event-model\";\n\nfunction App() {\n  const events: Event[] = [\n    {\n      id: \"1\",\n      type: \"meeting\",\n      title: \"团队会议\",\n      startTime: new Date(\"2024-12-30T10:00:00\"),\n      endTime: new Date(\"2024-12-30T11:00:00\"),\n      data: {},\n    },\n  ];\n\n  return \u003cCalendar view=\"month\" events={events} />;\n}\n```\n\n## ResizableSplitter 组件\n\n`ResizableSplitter` 是一个通用的可调整大小的分割面板组件，可用于创建可拖拽调整的左右分栏布局。\n\n### 基础使用\n\n```tsx\nimport { ResizableSplitter } from \"@calenderjs/react\";\n\nfunction App() {\n  return (\n    \u003cResizableSplitter\n      left={\u003cdiv>左侧内容\u003c/div>}\n      right={\u003cdiv>右侧内容\u003c/div>}\n      initialLeftWidth={40}\n      minLeftWidth={20}\n      maxLeftWidth={80}\n    />\n  );\n}\n```\n\n### 与 Calendar 结合使用\n\n```tsx\nimport { ResizableSplitter, Calendar } from \"@calenderjs/react\";\n\nfunction App() {\n  return (\n    \u003cResizableSplitter\n      left={\n        \u003cdiv style={{ padding: \"20px\" }}>\n          \u003ch2>编辑器\u003c/h2>\n          \u003ctextarea style={{ width: \"100%\", height: \"100%\" }} />\n        \u003c/div>\n      }\n      right={\n        \u003cdiv style={{ padding: \"20px\" }}>\n          \u003ch2>日历\u003c/h2>\n          \u003cCalendar view=\"month\" />\n        \u003c/div>\n      }\n      initialLeftWidth={50}\n      minLeftWidth={30}\n      maxLeftWidth={70}\n    />\n  );\n}\n```\n\n## API\n\n### Calendar Props\n\n| 属性           | 类型                                                             | 默认值      | 说明                 |\n| -------------- | ---------------------------------------------------------------- | ----------- | -------------------- |\n| `view`         | `'month' \\| 'week' \\| 'day'`                                     | `'month'`   | 初始视图             |\n| `date`         | `string \\| Date`                                                 | 当前日期    | 初始日期             |\n| `events`       | `Event[]`                                                        | `[]`        | 事件列表（数据模型） |\n| `user`         | `any`                                                            | `undefined` | 当前用户             |\n| `onDateChange` | `(e: CustomEvent\u003c{ date: Date }>) => void`                       | -           | 日期变化回调         |\n| `onViewChange` | `(e: CustomEvent\u003c{ view: 'month' \\| 'week' \\| 'day' }>) => void` | -           | 视图切换回调         |\n| `className`    | `string`                                                         | -           | CSS 类名             |\n| `style`        | `React.CSSProperties`                                            | -           | 内联样式             |\n\n### CalendarRef\n\n| 方法            | 说明                          |\n| --------------- | ----------------------------- |\n| `getElement()`  | 获取底层的 Web Component 实例 |\n| `setView(view)` | 设置当前视图                  |\n| `setDate(date)` | 设置当前日期                  |\n| `goToToday()`   | 跳转到今天                    |\n\n### ResizableSplitter Props\n\n| 属性               | 类型              | 默认值 | 说明                              |\n| ------------------ | ----------------- | ------ | --------------------------------- |\n| `left`             | `React.ReactNode` | -      | 左侧面板内容（必需）              |\n| `right`            | `React.ReactNode` | -      | 右侧面板内容（必需）              |\n| `initialLeftWidth` | `number`          | `40`   | 初始左侧面板宽度（百分比，0-100） |\n| `minLeftWidth`     | `number`          | `20`   | 左侧面板最小宽度（百分比）        |\n| `maxLeftWidth`     | `number`          | `80`   | 左侧面板最大宽度（百分比）        |\n| `className`        | `string`          | `\"\"`   | 自定义 CSS 类名                   |\n\n## CSS 变量自定义\n\n所有组件都支持通过 CSS 变量进行自定义。Calendar 组件使用 `--calender-` 前缀，ResizableSplitter 组件使用 `--resizable-splitter-` 前缀。\n\n### Calendar CSS 变量\n\nCalendar 组件支持大量 CSS 变量来自定义外观。主要变量包括：\n\n```css\n:root {\n  /* 基础颜色 */\n  --calender-bg-color: #fff;\n  --calender-text-color: #202124;\n  --calender-primary-color: #1a73e8;\n\n  /* 状态颜色 */\n  --calender-today-bg-color: #e8f0fe;\n  --calender-selected-bg-color: #e8f0fe;\n  --calender-hover-bg-color: #f1f3f4;\n\n  /* 边框 */\n  --calender-border-color: #dadce0;\n  --calender-border-radius: 4px;\n\n  /* 字体 */\n  --calender-font-family: \"Google Sans\", Roboto, Arial, sans-serif;\n  --calender-font-size: 14px;\n\n  /* 尺寸 */\n  --calender-month-cell-min-height: 100px;\n  --calender-hour-cell-height: 48px;\n\n  /* 过渡 */\n  --calender-transition-duration: 0.2s;\n}\n```\n\n完整的 CSS 变量列表请参考 `@calenderjs/calendar` 包的 `CSS_VARIABLES.md` 文档。\n\n### ResizableSplitter CSS 变量\n\n组件使用 CSS 变量来支持主题定制，所有变量都使用 `--resizable-splitter-` 前缀：\n\n```css\n:root {\n  /* 分割器主体 */\n  --resizable-splitter-width: 4px; /* 分割器宽度 */\n  --resizable-splitter-bg-color: #ddd; /* 分割器背景色 */\n  --resizable-splitter-hover-bg-color: #bbb; /* 分割器悬停背景色 */\n  --resizable-splitter-transition: background-color 0.2s; /* 过渡效果 */\n\n  /* 分割器手柄 */\n  --resizable-splitter-handle-width: 20px; /* 手柄宽度 */\n  --resizable-splitter-handle-height: 40px; /* 手柄高度 */\n  --resizable-splitter-handle-border-radius: 4px; /* 手柄圆角 */\n  --resizable-splitter-handle-bg-color: rgba(0, 0, 0, 0.1); /* 手柄背景色 */\n\n  /* 分割器圆点 */\n  --resizable-splitter-dot-size: 3px; /* 圆点大小 */\n  --resizable-splitter-dot-color: #999; /* 圆点颜色 */\n  --resizable-splitter-dot-gap: 2px; /* 圆点间距 */\n}\n```\n\n### 暗色模式示例\n\n```css\n.dark-mode {\n  /* Calendar 暗色模式 */\n  --calender-bg-color: #1e1e1e;\n  --calender-text-color: #e0e0e0;\n  --calender-border-color: #3a3a3a;\n  --calender-primary-color: #4285f4;\n  --calender-today-bg-color: #1a3a5a;\n  --calender-hover-bg-color: #2a2a2a;\n\n  /* ResizableSplitter 暗色模式 */\n  --resizable-splitter-bg-color: #333;\n  --resizable-splitter-hover-bg-color: #555;\n  --resizable-splitter-handle-bg-color: rgba(255, 255, 255, 0.1);\n  --resizable-splitter-dot-color: #ccc;\n}\n```\n\n## 注意事项\n\n1. 确保已安装 `@calenderjs/calendar` 包\n2. Web Component 会自动注册，无需手动注册\n3. 组件是纯数据驱动的，只处理数据模型，不涉及 DSL\n4. `ResizableSplitter` 是一个纯 React 组件，不依赖 Web Components\n5. 所有组件都支持通过 CSS 变量进行主题自定义"},"source-3dae6d110b675ef3-s1":{"body":"来源：`packages/react/README.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# @calenderjs/react\n\nReact wrapper for `@calenderjs/calendar` Web Component.\n"},"source-3dae6d110b675ef3-s2":{"body":"来源：`packages/react/README.md:5-12`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 安装\n\n```bash\npnpm add @calenderjs/react @calenderjs/calendar\n```\n\n本包仅封装日历 Web Component（`Calendar`）与布局辅助（`ResizableSplitter`）。Event DSL 编辑器请用独立包 `@calenderjs/react-event-editor`。\n"},"source-3dae6d110b675ef3-s3":{"body":"来源：`packages/react/README.md:13-14`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 使用方式\n"},"source-3dae6d110b675ef3-s4":{"body":"来源：`packages/react/README.md:15-24`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 基础使用\n\n```tsx\nimport { Calendar } from \"@calenderjs/react\";\n\nfunction App() {\n  return \u003cCalendar view=\"month\" date=\"2024-12- 节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 注意事项\n\n1. 确保已安装 `@calenderjs/calendar` 包\n2. Web Component 会自动注册，无需手动注册\n3. 组件是纯数据驱动的，只处理数据模型，不涉及 DSL\n4. `ResizableSplitter` 是一个纯 React 组件，不依赖 Web Components\n5. 所有组件都支持通过 CSS 变量进行主题自定义"},"folder:reference:packages/react-event-editor":{"body":"# packages/react-event-editor\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-82ef1497cd8b5e79":{"body":"# packages/react-event-editor/README.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：docs/llm-guide.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# @calenderjs/react-event-editor\n\nReact Event DSL 编辑器组件。基于 Monaco Editor，语言支持来自 `@calenderjs/monaco-event-dsl`。\n\n与 `@calenderjs/react`（日历 wrapper）分离：只做日历时不装本包，也不拉 Monaco。\n\n## 安装\n\n```bash\npnpm add @calenderjs/react-event-editor @calenderjs/monaco-event-dsl monaco-editor @monaco-editor/react\n```\n\n`monaco-editor` 与 `@monaco-editor/react` 为 peer dependency，需由宿主安装。\n\n## 使用\n\n```tsx\nimport { EventEditor } from \"@calenderjs/react-event-editor\";\nimport { Editor } from \"@monaco-editor/react\";\nimport { useState } from \"react\";\n\nfunction App() {\n  const [dsl, setDsl] = useState('type: meeting\\nname: \"团队会议\"');\n\n  return (\n    \u003cEventEditor\n      EditorComponent={Editor}\n      value={dsl}\n      onChange={setDsl}\n      height=\"100%\"\n      darkMode={false}\n    />\n  );\n}\n```\n\n`EditorComponent` 必需：由调用方传入，本包不内置 Monaco React 实现。\n\n## 与 Calendar 组合\n\n```tsx\nimport { Calendar, ResizableSplitter } from \"@calenderjs/react\";\nimport { EventEditor } from \"@calenderjs/react-event-editor\";\nimport { Editor } from \"@monaco-editor/react\";\n\nfunction App() {\n  return (\n    \u003cResizableSplitter\n      left={\u003cEventEditor EditorComponent={Editor} value={\"\"} height=\"100%\" />}\n      right={\u003cCalendar view=\"month\" />}\n    />\n  );\n}\n```\n\n## Props\n\n| 属性              | 类型                                          | 默认值   | 说明                       |\n| ----------------- | --------------------------------------------- | -------- | -------------------------- |\n| `EditorComponent` | `React.ComponentType\u003cEditorProps>`            | -        | Monaco Editor 组件（必需） |\n| `value`           | `string`                                      | `\"\"`     | Event DSL 代码内容         |\n| `onChange`        | `(value: string \\| undefined) => void`        | -        | 代码变化回调               |\n| `height`          | `string \\| number`                            | `\"100%\"` | 编辑器高度                 |\n| `darkMode`        | `boolean`                                     | `false`  | 暗色主题                   |\n| `className`       | `string`                                      | `\"\"`     | CSS 类名                   |\n| `style`           | `React.CSSProperties`                         | -        | 内联样式                   |\n| `options`         | `editor.IStandaloneEditorConstructionOptions` | -        | Monaco 选项（与默认合并）  |\n| `onMount`         | `(editor, monaco) => void`                    | -        | 挂载回调                   |\n\n## 默认 Monaco 选项\n\n- `minimap: { enabled: false }`\n- `fontSize: 14`\n- `wordWrap: \"on\"`\n- `lineNumbers: \"on\"`\n- `scrollBeyondLastLine: false`\n- `suggestOnTriggerCharacters: true`\n- `quickSuggestions: true`\n- `tabSize: 2`\n- `autoIndent: \"full\"`\n\n## CSS 变量\n\n```css\n:root {\n  --event-editor-bg-color: #fff;\n  --event-editor-bg-color-dark: #1e1e1e;\n}\n```"},"source-82ef1497cd8b5e79-s1":{"body":"来源：`packages/react-event-editor/README.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# @calenderjs/react-event-editor\n\nReact Event DSL 编辑器组件。基于 Monaco Editor，语言支持来自 `@calenderjs/monaco-event-dsl`。\n\n与 `@calenderjs/react`（日历 wrapper）分离：只做日历时不装本包，也不拉 Monaco。\n"},"s nt-dsl\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-22fb579f31ba4fdd":{"body":"# packages/monaco-event-dsl/README.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：docs/llm-guide.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# @calenderjs/monaco-event-dsl\n\nMonaco Editor 语言支持包 - 为 Event DSL 提供语法高亮和自动完成\n\n## 功能特性\n\n- ✅ Event DSL 语法高亮\n- ✅ 智能自动完成建议\n- ✅ 代码片段支持（Snippets）\n- ✅ 浅色和暗色主题\n- ✅ TypeScript 类型定义\n- ✅ 零运行时依赖（仅类型依赖）\n- ✅ 不包含 Monaco Editor 本身（作为 peer dependency）\n\n## 安装\n\n```bash\npnpm add @calenderjs/monaco-event-dsl monaco-editor\n```\n\n**注意**: `monaco-editor` 是 peer dependency，需要单独安装。这个包只提供语言支持，不包含编辑器本身。\n\n## 使用\n\n### 基础用法\n\n```typescript\nimport { registerEventDSL } from \"@calenderjs/monaco-event-dsl\";\nimport { Editor } from \"@monaco-editor/react\";\n\nfunction EventDSLEditor() {\n    return (\n        \u003cEditor\n            language=\"event-dsl\"\n            theme=\"event-dsl-theme\"\n            onMount={(editor, monaco) => {\n                // 注册 Event DSL 语言\n                registerEventDSL(monaco);\n            }}\n        />\n    );\n}\n```\n\n### 支持暗色模式\n\n```typescript\nimport { registerEventDSL } from \"@calenderjs/monaco-event-dsl\";\nimport { Editor } from \"@monaco-editor/react\";\nimport { useState } from \"react\";\n\nfunction EventDSLEditor() {\n    const [isDarkMode, setIsDarkMode] = useState(false);\n\n    return (\n        \u003cEditor\n            language=\"event-dsl\"\n            theme={isDarkMode ? \"event-dsl-theme-dark\" : \"event-dsl-theme\"}\n            onMount={(editor, monaco) => {\n                registerEventDSL(monaco);\n            }}\n        />\n    );\n}\n```\n\n### 使用原生 Monaco Editor\n\n```typescript\nimport * as monaco from \"monaco-editor\";\nimport { registerEventDSL } from \"@calenderjs/monaco-event-dsl\";\n\n// 注册语言\nregisterEventDSL(monaco);\n\n// 创建编辑器\nconst editor = monaco.editor.create(document.getElementById(\"container\"), {\n  value: 'type: meeting\\nname: \"团队会议\"',\n  language: \"event-dsl\",\n  theme: \"event-dsl-theme\",\n});\n```\n\n## API\n\n### `registerEventDSL(monaco: MonacoInstance): void`\n\n注册 Event DSL 语言到 Monaco Editor。此函数会：\n\n1. 注册 `event-dsl` 语言 ID\n2. 配置语法高亮规则（Monarch Tokenizer）\n3. 注册自动完成提供者\n4. 定义浅色和暗色主题（`event-dsl-theme` 和 `event-dsl-theme-dark`）\n\n**参数：**\n\n- `monaco`: Monaco Editor 实例，包含 `editor` 和 `languages` 对象\n\n**注意：**\n\n- 此函数是幂等的，多次调用只会注册一次\n- 此包不包含 Monaco Editor 本身，需要单独安装 `monaco-editor`\n- 可以在任何使用 Monaco Editor 的项目中使用（React、Vue、原生 JS 等）\n\n## 支持的语言特性\n\n### 语法高亮\n\n- **关键字**: `type`, `name`, `description`, `fields`, `validate`, `display`, `behavior` 等\n- **类型**: `string`, `number`, `boolean`, `email`, `list` 等\n- **操作符**: `>=`, `\u003c=`, `>`, `\u003c`, `between` 等\n- **字符串**: 双引号和单引号字符串\n- **数字**: 整数和布尔值\n- **颜色值**: 十六进制颜色代码（如 `#4285f4`）\n- **字段访问**: 如 `attendees.count`, `startTime.hour`\n- **注释**: 以 `#` 开头的注释\n\n### 自动完成\n\n提供以下自动完成建议：\n\n- 关键字：`type`, `name`, `description`, `fields`, `validate`, `display`, `behavior`\n- 类型：`string`, `number`, `boolean`, `email`, `list of`\n- 操作符：`>=`, `\u003c=`, `between`\n\n所有建议都支持代码片段，可以快速生成模板代码。\n\n## 主题\n\n包提供了两个预定义主题：\n\n- `event-dsl-theme`: 浅色主题\n- `event-dsl-theme-dark`: 暗色主题\n\n## 类型定义\n\n```typescript\nimport type { MonacoInstance } from \"@calenderjs/monaco-event-dsl\";\n\nfunction setupEditor(monaco: MonacoInstance) {\n  registerEventDSL(monaco);\n}\n```\n\n## 许可证\n\nMIT"},"source-22fb579f31ba4fdd-s1":{"body":"来源：`packages/monaco-event-dsl/README.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# @calenderjs/monaco-event-dsl\n\nMonaco Editor 语言支持包 - 为 Event DSL 提供语法高亮和自动完成\n"},"source-22fb579f31ba4fdd-s2":{"body":"来源：`packages/monaco-event-dsl/README.md:5-14`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本 件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# RFC-0005: Calendar Component\n\n**状态**: In Progress  \n**创建日期**: 2024-12-19  \n**最后更新**: 2026-03-15  \n**作者**: WSX Team  \n**关联 RFC**: RFC-0002 (Event DSL), RFC-0008 (API Redesign), RFC-0009 (Data-driven Calendar), RFC-0011 (Event Data Model), RFC-0012 (Plugin Mechanism)\n\n## 摘要\n\n设计并实现 `\u003cwsx-calendar>` 组件，一个基于 WSX 框架构建的 DSL 驱动日历组件。组件提供月视图、周视图和日视图三种显示模式，界面设计参考 Google 日历。\n\n**核心架构**：\n\n- **DSL 驱动**：Calendar 接受 `EventRuntime` 实例，用于增强渲染（颜色、图标、标题模板）、验证（字段和时间约束）、行为控制（拖拽、编辑权限）\n- **优雅降级**：未提供 EventRuntime 时，Calendar 回退到纯数据驱动模式，使用 Event 核心字段渲染\n- **Web Components 标准**：基于 WSX 框架，使用 Custom Elements + Shadow DOM + JSX 语法\n- **Event 数据模型**：组件消费 `Event[]` 数据，通过 `Event.type` + `Event.data` 承载 DSL 定义的业务字段\n\n**开源定位**：\n\n- `@calenderjs/calendar`：开源日历组件（MIT 协议）\n- 依赖 `@calenderjs/event-model`（Event 数据模型 SSOT）\n- 可选依赖 `@calenderjs/event-runtime`（DSL 驱动能力）\n\n## 术语约定\n\n| 术语                             | 含义                                                                       |\n| -------------------------------- | -------------------------------------------------------------------------- |\n| **Event**                        | 技术数据模型（`Event { id, type, title, startTime, endTime, data, ... }`） |\n| **Appointment / Holiday / Task** | 业务概念，都是 Event 的具体类型（`Event.type = \"meeting\"` 等）             |\n| **EventRuntime**                 | DSL 编译后的运行时实例，提供 validate / render / canPerform                |\n| **data**                         | `Event.data: Record\u003cstring, any>` — DSL fields 定义的业务数据容器          |\n\n## 动机\n\n在事件管理、日程安排、预约管理等场景中，日历组件是核心需求。现有方案（FullCalendar 等）不基于 Web Components，无法利用 Shadow DOM 隔离，也不支持 DSL 驱动的声明式事件类型系统。本组件通过 WSX 框架 + Event DSL 提供：\n\n- **框架无关**：Web Components 标准，可在 React/Vue/Angular/原生 HTML 中使用\n- **业务可配**：通过 DSL 文本声明事件类型、验证规则、显示规则、行为规则\n- **零运行时开销**：WSX 在构建时编译 JSX 为原生 DOM 操作\n\n## 组件 API 设计\n\n### 三层 API\n\nCalendar API 分三层，遵循 Web Components 标准（RFC-0008）：\n\n#### 1. HTML Attributes（简单配置）\n\n```html\n\u003cwsx-calendar view=\"month\" date=\"2026-03-15\">\u003c/wsx-calendar>\n```\n\n| Attribute | 类型                         | 默认值    | 说明              |\n| --------- | ---------------------------- | --------- | ----------------- |\n| `view`    | `'month' \\| 'week' \\| 'day'` | `'month'` | 初始/当前视图     |\n| `date`    | ISO 8601 字符串              | 当前日期  | 初始/当前显示日期 |\n\n#### 2. JavaScript Properties（复杂数据）\n\n```typescript\nconst calendar = document.querySelector(\"wsx-calendar\") as Calendar;\ncalendar.events = events; // Event[] - 事件数据\ncalendar.user = currentUser; // User - 当前用户\ncalendar.eventRuntime = runtime; // EventRuntime - DSL 运行时（可选）\n```\n\n| Property       | 类型           | 必需 | 说明                            |\n| -------------- | -------------- | ---- | ------------------------------- |\n| `events`       | `Event[]`      | 是   | 事件列表（数据模型）            |\n| `user`         | `User`         | 否   | 当前用户（权限验证用）          |\n| `eventRuntime` | `EventRuntime` | 否   | DSL 运行时（启用 DSL 驱动模式） |\n\n**实现方式**：getter/setter 模式，setter 中处理 JSON string 和 object 两种输入。\n\n#### 3. 内部状态（@state）\n\n```typescript\n@state currentView: 'month' | 'week' | 'day' = 'month';\n@state currentDate: Date = new Date();\n@state private showEventDialog: boolean = false;\n@state private editingEvent: Event | undefined = undefined;\n@state private showDeleteConfirm: boolean = false;\n@state private deletingEvent: Event | undefined = undefined;\n```\n\n### 事件系统（CustomEvent）\n\n所有事件使用 `CustomEvent`，`bubbles: true` + `composed: true`（穿透 Shadow DOM）。\n\n| 事件名         | detail 类型                    | 触发时机   |\n| -------------- | ------------------------------ | ---------- |\n| `date-change`  | `{ date: Date }`               | 日期导航   |\n| `view-change`  | `{ view: string }`             | 视图切换   |\n| `event-click`  | `{ event: Event }`             | 点击事件块 |\n| `event-create` | `{ event: Event }`             | 创建事件   |\n| `event-update` | `{ id: string, event: Event }` | 更新事件   |\n| `event-delete` | `{ id: string }`               | 删除事件   |\n\n### 公共方法\n\n```typescript\ncreateEvent(data: Partial\u003cEvent>): { success: boolean; event?: Event; errors?: string[] }\nupdateEvent(id: string, data: Partial\u003cEvent>): { success: boolean; event?: Event; errors?: string[] }\ndeleteEvent(id: string): { success: boolean; error?: string }\n```\n\n## DSL 驱动架构\n\n### 两种模式\n\n#### 模式 A：DSL 驱动（提供 EventRuntime）\n\n```typescript\nimport { EventDSLCompiler } from \"@calenderjs/event-dsl\";\nimport { EventRuntime } from \"@calenderjs/event-runtime\";\n\nconst compiler = new EventDSLCompiler();\nconst dataModel = compiler.compileDSL(meetingDSL);\nconst runtime = new EventRuntime(dataModel.types[0]);\n\nconst calendar = document.querySelector(\"wsx-calendar\");\ncalendar.events = events;\ncalendar.user = currentUser;\ncalendar.eventRuntime = runtime; // 启用 DSL 驱动\n```\n\nDSL 驱动时，Calendar 的行为变化：\n\n| 能力     | 无 DSL                                     | 有 DSL                                                          |\n| -------- | ------------------------------------------ | --------------------------------------------------------------- |\n| **渲染** | 使用 `event.title`、`event.color` 直接渲染 | 使用 `runtime.render()` 获取增强的 title/color/icon/description |\n| **验证** | 无验证（信任外部数据）                     | 使用 `runtime.validate()` 校验字段/时间约束/冲突                |\n| **行为** | 所有事件可编辑/拖拽/删除                   | 使用 `runtime.canPerform()` 按 DSL behavior 规则和用户角色控制  |\n\n#### 模式 B：纯数据驱动（无 EventRuntime）\n\n```typescript\nconst calendar = document.querySelector(\"wsx-calendar\");\ncalendar.events = events; // 直接使用 Event 核心字段渲染\n```\n\n### Calendar 内部的 DSL 集成逻辑\n\n```typescript\nprivate renderEventBlock(event: Event): HTMLElement {\n  let title = event.title;\n  let color = event.color || '#4285f4';\n  let description = '';\n  let icon: string | undefined;\n\n  if (this._eventRuntime) {\n    const rendered = this._eventRuntime.render(event, { user: this._user });\n    title = rendered.title;\n    color = rendered.color;\n    description = rendered.description || '';\n    icon = rendered.icon;\n  }\n\n  return (\n    \u003cdiv class=\"event-block\" style={{ backgroundColor: color }}\n         onclick={() => this.handleEventClick(event)}>\n      {icon && \u003cspan class=\"event-icon\">{icon}\u003c/span>}\n      \u003cspan class=\"event-title\">{title}\u003c/span>\n      {description && \u003cspan class=\"event-desc\">{description}\u003c/span>}\n    \u003c/div>\n  );\n}\n\nprivate handleEventCreate(eventData: Partial\u003cEvent>): void {\n  if (this._eventRuntime) {\n    const validation = this._eventRuntime.validate(eventData, {\n      existingEvents: this._events,\n      user: this._user\n    });\n    if (!validation.valid) {\n      this.dispatchEvent(new CustomEvent('event-create-error', {\n        detail: { errors: validation.errors },\n        bubbles: true, composed: true\n      }));\n      return;\n    }\n  }\n\n  this.dispatchEvent(new CustomEvent('event-create', {\n    detail: { event: eventData },\n    bubbles: true, composed: true\n  }));\n}\n\nprivate isEventDraggable(event: Event): boolean {\n  if (!this._eventRuntime) return true;\n  return this._eventRuntime.canPerform('drag', event, this._user);\n}\n```\n\n## Event 数据模型\n\nCalendar 消费的核心数据结构（定义在 `@calenderjs/event-model`）：\n\n```typescript\ninterface Event {\n  id: string; // 唯一标识符\n  type: string; // DSL 类型标识（如 \"meeting\"、\"vacation\"）\n  title: string; // 显示标题\n  startTime: Date; // 开始时间\n  endTime: Date; // 结束时间\n  color?: string; // 显示颜色\n  icon?: string; // 显示图标\n  data?: Record\u003cstring, any>; // DSL 业务字段容器\n  timeZone?: string; // 时区（IANA 标识符）\n  allDay?: boolean; // 全天事件\n  recurring?: RecurringRule; // 重复规则\n  parentEventId?: string; // 父事件ID（重复事件实例）\n  recurrenceId?: string; // 重复实例ID\n  metadata?: EventMetadata; // 创建/更新元数据\n}\n```\n\n**`Event.data` 字段设计（替代原 `extra`）**：\n\n- DSL fields 定义的业务字段统一存储在 `data` 中\n- 语义明确：\"这是此事件类型的核心数据\"，而非\"额外的附加信息\"\n- JSON Schema 校验 `data` 结构（由 DSL 编译器从 fields 生成）\n- TypeScript 类型生成（如 `MeetingData`）提供开发时类型安全\n\n```typescript\n// meeting 类型事件\n{\n  type: \"meeting\",\n  title: \"团队会议\",\n  startTime: new Date(\"2026-01-15T10:00\"),\n  endTime: new Date(\"2026-01-15T11:00\"),\n  data: {\n    attendees: [\"alice@co.com\", \"bob@co.com\"],\n    location: \"会议室 A\",\n    priority: \"high\"\n  }\n}\n\n// vacation 类型事件\n{\n  type: \"vacation\",\n  title: \"年假\",\n  startTime: new Date(\"2026-02-01\"),\n  endTime: new Date(\"2026-02-03\"),\n  allDay: true,\n  data: {\n    reason: \"春节\",\n    approvedBy: \"manager@co.com\",\n    days: 3\n  }\n}\n```\n\n## 视图设计\n\n### 月视图（MonthView）\n\n- 显示整月日期网格（6 行 x 7 列，含前后月补齐）\n- 每个日期单元格显示事件预览（标题 + 颜色条）\n- 事件过多时显示 \"+N more\"\n- 点击日期跳转到日视图\n- 双击日期创建事件\n\n### 周视图（WeekView）\n\n- 显示 7 天时间轴（默认 00:00-24:00）\n- 事件块按时间定位（top = startTime, height = duration）\n- 处理重叠事件的并排布局\n- 当前时间线指示器\n\n### 日视图（DayView）\n\n- 显示单日时间轴（时间槽更细：15/30 分钟）\n- 事件块精确定位\n- 详细事件信息展示\n\n### 视图渲染与 DSL 集成\n\n所有视图渲染事件时遵循相同逻辑：\n\n```\nEvent → (有 EventRuntime?) → runtime.render(event) → RenderedEvent\n                           ↓ (无)\n                           → 使用 event.title / event.color 直接渲染\n```\n\n`RenderedEvent` 结构：\n\n```typescript\ninterface RenderedEvent {\n  title: string;\n  description?: string;\n  color: string;\n  icon?: string;\n  allDay?: boolean;\n  [key: string]: any; // 允许扩展渲染属性\n}\n```\n\n## 组件架构\n\n### WSX 组件结构\n\n```\nCalendar.wsx (主组件: @autoRegister({ tagName: \"wsx-calendar\" }))\n├── 工具栏（视图切换、日期导航、Today 按钮）\n├── 视图容器\n│   ├── MonthView.wsx (wsx-month-view)\n│   ├── WeekView.wsx (wsx-week-view)\n│   └── DayView.wsx (wsx-day-view)\n├── 事件创建/编辑对话框\n└── 删除确认对话框\n```\n\n### 组件通信\n\n```\n外部应用\n  ↓ (attributes: view, date)\n  ↓ (properties: events, user, eventRuntime)\nCalendar 主组件\n  ↓ (attributes: JSON 序列化的 events/date)\n视图子组件 (MonthView / WeekView / DayView)\n  ↑ (CustomEvent 冒泡: date-click, event-click)\nCalendar 主组件\n  ↑ (CustomEvent composed: event-create, event-update, event-delete)\n外部应用\n```\n\n### 工具函数\n\n纯函数，独立于组件实例，便于测试：\n\n| 文件             | 函数                                                                                          | 用途           |\n| ---------------- | --------------------------------------------------------------------------------------------- | -------------- |\n| `date-utils.ts`  | `getMonthDates()`, `getWeekDates()`, `isSameDay()`, `isSameMonth()`, `getDayHours()`          | 日期计算       |\n| `event-utils.ts` | `groupEventsByDate()`, `getEventsForDate()`, `sortEventsByTime()`, `calculateEventPosition()` | 事件分组与定位 |\n\n## 使用示例\n\n### HTML（最简）\n\n```html\n\u003cwsx-calendar view=\"month\" date=\"2026-03-15\">\u003c/wsx-calendar>\n\u003cscript>\n  const calendar = document.querySelector(\"wsx-calendar\");\n  calendar.events = [\n    {\n      id: \"1\",\n      type: \"meeting\",\n      title: \"会议\",\n      startTime: new Date(),\n      endTime: new Date(),\n    },\n  ];\n\u003c/script>\n```\n\n### TypeScript + DSL 驱动\n\n```typescript\nimport { EventDSLCompiler } from \"@calenderjs/event-dsl\";\nimport { EventRuntime } from \"@calenderjs/event-runtime\";\n\nconst meetingDSL = `\ntype: meeting\nname: \"会议\"\nfields:\n  - attendees: list of email, required\n  - location: string\n  - priority: enum(low, normal, high), default: \"normal\"\ndisplay:\n  color: \"#4285f4\"\n  color: when priority is high: \"#ea4335\" else: \"#4285f4\"\n  title: \"{title}\"\n  description: \"{attendees.count} 人参会\"\nbehavior:\n  draggable: true\n  editable: role is admin or role is manager\n`;\n\nconst compiler = new EventDSLCompiler();\nconst dataModel = compiler.compileDSL(meetingDSL);\nconst runtime = new EventRuntime(dataModel.types[0]);\n\nconst calendar = document.querySelector(\"wsx-calendar\");\ncalendar.events = events;\ncalendar.user = { id: \"u1\", role: \"admin\" };\ncalendar.eventRuntime = runtime;\n\ncalendar.addEventListener(\"event-create\", (e) => {\n  console.log(\"创建事件:\", e.detail.event);\n});\n```\n\n### React 集成\n\n```tsx\nimport \"@calenderjs/calendar\";\nimport { useRef, useEffect } from \"react\";\n\nfunction CalendarApp({ events, user, runtime }) {\n  const ref = useRef\u003cHTMLElement>(null);\n\n  useEffect(() => {\n    const el = ref.current;\n    if (!el) return;\n    el.events = events;\n    el.user = user;\n    el.eventRuntime = runtime;\n  }, [events, user, runtime]);\n\n  return \u003cwsx-calendar ref={ref} view=\"week\" />;\n}\n```\n\n## 文件结构\n\n```\npackages/calendar/\n├── src/\n│   ├── Calendar.wsx                   # 主组件\n│   ├── Calendar.css                   # 组件样式（Shadow DOM 内联）\n│   ├── views/\n│   │   ├── MonthView.wsx              # 月视图\n│   │   ├── MonthView.css\n│   │   ├── WeekView.wsx               # 周视图\n│   │   ├── WeekView.css\n│   │   ├── DayView.wsx                # 日视图\n│   │   └── DayView.css\n│   ├── utils/\n│   │   ├── date-utils.ts              # 日期工具\n│   │   └── event-utils.ts             # 事件工具\n│   ├── __tests__/\n│   │   ├── Calendar.test.ts\n│   │   └── utils/\n│   │       ├── date-utils.test.ts\n│   │       └── event-utils.test.ts\n│   └── index.ts\n├── vite.config.ts\n├── vitest.config.ts\n└── package.json\n```\n\n## 依赖\n\n```json\n{\n  \"dependencies\": {\n    \"@calenderjs/event-model\": \"workspace:*\",\n    \"@wsxjs/wsx-core\": \"^0.0.23\"\n  },\n  \"peerDependencies\": {\n    \"@wsxjs/wsx-core\": \"^0.0.23\"\n  },\n  \"optionalDependencies\": {\n    \"@calenderjs/event-runtime\": \"workspace:*\"\n  }\n}\n```\n\n`event-runtime` 是可选依赖：Calendar 不硬依赖 DSL 运行时，通过 property 注入。\n\n## 实现状态\n\n| 模块                         | 状态      | 说明                                        |\n| ---------------------------- | --------- | ------------------------------------------- |\n| 组件基础结构                 | ✅ 完成   | WebComponent, @autoRegister, Shadow DOM     |\n| 月/周/日视图渲染             | ✅ 完成   | 数据驱动渲染，无 DSL                        |\n| 工具栏 + 视图切换 + 日期导航 | ✅ 完成   |                                             |\n| CRUD 操作 + 对话框           | ✅ 完成   | create/update/delete + CustomEvent          |\n| API 标准化 (RFC-0008)        | ✅ 完成   | observedAttributes, getter/setter, 事件统一 |\n| \"today\" 高亮 (RFC-0013)      | ✅ 完成   |                                             |\n| 工具函数 + 单元测试          | ✅ 完成   | 45 测试用例通过                             |\n| **EventRuntime 集成**        | ❌ 未实现 | Calendar 接受 eventRuntime property         |\n| **DSL 驱动渲染**             | ❌ 未实现 | runtime.render() 增强渲染                   |\n| **DSL 驱动验证**             | ❌ 未实现 | runtime.validate() 创建/更新前验证          |\n| **DSL 驱动行为**             | ❌ 未实现 | runtime.canPerform() 权限检查               |\n| `extra` → `data` 重命名      | ❌ 待执行 | Event 接口字段重命名                        |\n| 拖拽功能                     | ❌ 未实现 | HTML5 Drag and Drop API                     |\n| 视图切换动画                 | ❌ 未实现 | CSS transitions                             |\n| 虚拟滚动                     | ❌ 未实现 | 大量事件性能优化                            |\n\n## 实施计划\n\n### 已完成里程碑\n\n- **M1**: 基础视图渲染（月/周/日）\n- **M2**: CRUD 操作 + 事件系统\n- **M3**: API 标准化（RFC-0008）\n\n### 下一步里程碑\n\n**M4: DSL 集成**（优先级最高）\n\n1. `extra` → `data` 全局重命名（Event 接口 + 所有消费者）\n2. Calendar 添加 `eventRuntime` property（getter/setter）\n3. 渲染集成：有 runtime 时使用 `runtime.render()` 增强\n4. 验证集成：创建/更新时使用 `runtime.validate()`\n5. 行为集成：拖拽/编辑/删除前使用 `runtime.canPerform()`\n6. 错误事件：`event-create-error`、`event-update-error`\n\n**M5: 交互增强**\n\n1. 拖拽功能（HTML5 Drag and Drop API）\n2. 时间调整（拖拽底部边缘调整 duration）\n3. 视图切换动画\n\n**M6: 性能与文档**\n\n1. 虚拟滚动（大量事件）\n2. 事件聚合缓存\n3. API 文档 + 使用示例\n\n## 性能目标\n\n| 指标          | 目标           |\n| ------------- | -------------- |\n| 1000 事件渲染 | \u003c 100ms        |\n| 视图切换      | \u003c 50ms         |\n| 事件交互响应  | \u003c 16ms (60fps) |\n| 1000 事件内存 | \u003c 50MB         |\n\n## 向后兼容性\n\n- 当前纯数据驱动模式（无 eventRuntime）保持不变\n- `eventRuntime` 是新增可选 property，不影响现有 API\n- `extra` → `data` 重命名是破坏性变更，需要在所有包中同步更新\n\n## 参考\n\n- [Google Calendar](https://calendar.google.com/)\n- [FullCalendar](https://fullcalendar.io/)\n- [Web Components 标准](https://developer.mozilla.org/en-US/docs/Web/Web_Components)\n- [WSX 框架](https://wsxjs.dev)\n\n---\n\n_本 RFC 定义了 `\u003cwsx-calendar>` 组件的完整架构：DSL 驱动的事件渲染、验证和行为控制，同时支持无 DSL 的纯数据驱动降级模式。_"},"source-57de40d9754b7ad6-s1":{"body":"来源：`.spec/rfc/0005-calendar-component.md:1-8`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# RFC-0005: Calendar Component\n\n**状态**: In Progress  \n**创建日期**: 2024-12-19  \n**最后更新**: 2026-03-15  \n**作者**: WSX Team  \n**关联 RFC**: RFC-0002 (Event DSL), RFC-0008 (API Redesign), RFC-0009 (Data-driven Calendar), RFC-0011 (Event Data Model), RFC-0012 (Plugin Mechanism)\n"},"source-57de40d9754b7ad6-s2":{"body":"来源：`.spec/rfc/0005-calendar-component.md:9-25`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 摘要\n\n设计并实现 `\u003cwsx-calendar>` 组件，一个基于 WSX 框架构建的 DSL 驱动日历组件。组件提供月视图、周视图和日视图三种显示模式，界面设计参考 Google 日历。\n\n**核心架构**：\n\n- **DSL 驱动**：Calendar 接受 `EventRuntime` 实例，用于增强渲染（颜色、图标、标题模板）、验证（字段和时间约束）、行为控制（拖拽、编辑权限）\n- **优雅降级**：未提供 EventRuntime 时，Calendar 回退到纯数据驱动模式，使用 Event 核心字段渲染\n- **Web Components 标准**：基于 WSX 框架，使用 Custom Elements + Shadow DOM + JSX 语法\n- **Event 数据模型**：组件消费 `Event[]` 数据，通过 `Event.type` + `Event.data` 承载 DSL 定义的业务字段\n\n**开源定位**：\n\n- `@calenderjs/calendar`：开源日历组件（MIT 协议）\n- 依赖 `@calenderjs/event-model`（Event 数据模型 SSOT）\n- 可选依赖 `@calenderjs/event-runtime`（DSL 驱动能力）\n"},"source-57de40d9754b7ad6-s3":{"body":"来源：`.spec/rfc/0005-calendar-component.md:26-34`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 术语约定\n\n| 术语                             | 含义                                                                       |\n| -------------------------------- | -------------------------------------------------------------------------- |\n| **Event**                        | 技术数据模型（`Event { id, type, title, startTime, endTime, data, ... }`） |\n| **Appointment / Holiday / Task** | 业务概念，都是 Event 的具体类型（`Event.type = \"meeting\"` 等）             |\n| **EventRuntime**                 | DSL 编译后的运行时实例，提供 validate / render / canPerform                |\n| **data**                         | `Event.data: Record\u003cstring, any>` — DSL fields 定义的业务数据容器          |\n"},"source-57de40d9754b7ad6-s4":{"body":"来源：`.spec/rfc/0005-calendar-component.md:35-42`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 动机\n\n在事件管理、日程安排、预约管理等场景中，日历组件是核心需求。现有方案（FullCalendar 等）不基于 Web Components，无法利用 Shadow DOM 隔离，也不支持 DSL 驱动的声明式事件类型系统。本组件通过 WSX 框架 + Event DSL 提供：\n\n- **框架无关**：Web Components 标准，可在 React/Vue/Angular/原生 HTML 中使用\n- **业务可配**：通过 DSL 文本声明事件类型、验证规则、显示规则、行为规则\n- **零运行时开销**：WSX 在构建时编译 JSX 为原生 DOM 操作\n"},"source-57de40d9754b7ad6-s5":{"body":"来源：`.spec/rfc/0005-calendar-component.md:43-44`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 组件 API 设计\n"},"source-57de40d9754b7ad6-s6":{"body":"来源：`.spec/rfc/0005-calendar-component.md:45-48`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 三层 API\n\nCalendar API 分三层，遵循 Web Components 标准（RFC-0008）：\n"},"source-57de40d9754b7ad6-s7":{"body":"来源：`.spec/rfc/0005-calendar-component.md:49-59`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 1. HTML Attributes（简单配置）\n\n```html\n\u003cwsx-calendar view=\"month\" date=\"2026-03-15\">\u003c/wsx-calendar>\n```\n\n| Attribute | 类型                         | 默认值    | 说明              |\n| --------- | ---------------------------- | --------- | ----------------- |\n| `view`    | `'month' \\| 'week' \\| 'day'` | `'month'` | 初始/当前视图     |\n| `date`    | ISO 8601 字符串              | 当前日期  | 初始/当前显示日期 |\n"},"source-57de40d9754b7ad6-s8":{"body":"来源：`.spec/rfc/0005-calendar-component.md:60-76`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 2. JavaScript Properties（复杂数据）\n\n```typescript\nconst calendar = document.querySelector(\"wsx-calendar\") as Calendar;\ncalendar.events = events; // Event[] - 事件数据\ncalendar.user = currentUser; // User - 当前用户\ncalendar.eventRuntime = runtime; // EventRuntime - DSL 运行时（可选）\n```\n\n| Property       | 类型           | 必需 | 说明                            |\n| -------------- | -------------- | ---- | ------------------------------- |\n| `events`       | `Event[]`      | 是   | 事件列表（数据模型）            |\n| `user`         | `User`         | 否   | 当前用户（权限验证用）          |\n| `eventRuntime` | `EventRuntime` | 否   | DSL 运行时（启用 DSL 驱动模式） |\n\n**实现方式**：getter/setter 模式，setter 中处理 JSON string 和 object 两种输入。\n"},"source-57de40d9754b7ad6-s9":{"body":"来源：`.spec/rfc/0005-calendar-component.md:77-87`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n#### 3. 内部状态（@state）\n\n```typescript\n@state currentView: 'month' | 'week' | 'day' = 'month';\n@state currentDate: Date = new Date();\n@state private showEventDialog: boolean = false;\n@state private editingEvent: Event | undefined = undefined;\n@state private showDeleteConfirm: boolean = false;\n@state private deletingEvent: Event | undefined = undefined;\n```\n"},"source-57de40d9754b7ad6-s10":{"body":"来源：`.spec/rfc/0005-calendar-component.md:88-100`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 事件系统（CustomEvent）\n\n所有事件使用 `CustomEvent`，`bubbles: true` + `composed: true`（穿透 Shadow DOM）。\n\n| 事件名         | detail 类型                    | 触发时机   |\n| -------------- | ------------------------------ | ---------- |\n| `date-change`  | `{ date: Date }`               | 日期导航   |\n| `view-change`  | `{ view: string }`             | 视图切换   |\n| `event-click`  | `{ event: Event }`             | 点击事件块 |\n| `event-cr
